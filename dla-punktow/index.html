<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bierzesz Langera — zyskujesz | Oferta dla punktów handlowych | Langer Dystrybucja</title>
  <link rel="icon" href="/api/favicon" />
  <link rel="apple-touch-icon" href="/api/favicon" />
  <meta name="description" content="Oferta dla sklepów i hurtowni: do zamówionych kartonów Langera pistolet za 1 zł, a pozostałe marki nawet kilka procent taniej. Bez sztywnego progu, ze zwrotami bez ryzyka i możliwą współpracą marketingową." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
/* ===== BRAND TOKENS — te same co w index.html ===== */
:root {
  --flame:        #F04E23;
  --flame-600:    #D63F18;
  --flame-700:    #B63411;
  --flame-tint:   #FBE7DF;
  --flame-glow:   #FF6A3D;
  --cobalt:       #1E3FB5;
  --cobalt-600:   #182F95;
  --cobalt-tint:  #E5E9F8;
  --navy:         #0E1533;
  --navy-800:     #161E45;
  --navy-700:     #232C5E;
  --navy-900:     #080C22;
  --ash:          #8B9199;
  --ash-700:      #565D67;
  --light:        #EEF0F3;
  --paper:        #F6F7F9;
  --white:        #FFFFFF;
  --line:         #E2E5EA;
  --line-2:       #CFD4DC;
  --font-display: 'Space Grotesk', 'Hanken Grotesk', system-ui, sans-serif;
  --font-text:    'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, Menlo, monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px; --r-full:999px;
  --e1: 0 1px 2px rgb(14 21 51 / 0.06), 0 1px 1px rgb(14 21 51 / 0.04);
  --e2: 0 18px 48px -16px rgb(14 21 51 / 0.22), 0 6px 16px -8px rgb(14 21 51 / 0.10);
  --header-h: 76px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 16px); }
body {
  margin: 0; background: var(--white); color: var(--navy);
  font-family: var(--font-text); font-size: 17px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--flame); outline-offset: 3px; }

.wrap { width: min(1240px, 100% - 96px); margin-inline: auto; }
@media (max-width: 760px) { .wrap { width: min(1240px, 100% - 40px); } }

.eyebrow {
  display: inline-block; font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--flame);
}
.h1 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; margin: 0; }
.h2 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; margin: 0; font-size: clamp(28px, 3.4vw, 42px); text-wrap: balance; }
.lead { font-size: 18px; line-height: 1.55; color: var(--ash-700); margin: 0; text-wrap: pretty; }
.lead-dark { color: rgba(255,255,255,.72); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font-text); font-size: 16px; font-weight: 700; cursor: pointer;
  border: none; padding: 15px 26px; border-radius: var(--r-sm); text-align: center;
  transition: transform .12s, background .15s, box-shadow .15s, color .15s, border-color .15s;
}
.btn-flame { background: var(--flame); color: #fff; }
.btn-flame:hover { background: var(--flame-600); transform: translateY(-2px); }
.btn-flame:active { background: var(--flame-700); transform: translateY(0); }
.btn-dark { background: var(--navy); color: #fff; }
.btn-dark:hover { background: var(--navy-800); transform: translateY(-2px); }
.btn-light { background: #fff; color: var(--navy); }
.btn-light:hover { transform: translateY(-2px); box-shadow: var(--e2); }
.btn-outline { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.28); }
.btn-outline:hover { border-color: #fff; background: rgba(255,255,255,.06); }

/* ===== HEADER ===== */
.hdr {
  position: sticky; top: 0; z-index: 60; background: rgba(255,255,255,.92);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
}
.hdr-in { display: flex; align-items: center; gap: var(--s6); height: var(--header-h); }
.logo { display: inline-flex; align-items: center; gap: 10px; color: var(--navy); min-width: 0; }
.logo img { max-width: 100%; }
.logo-words { display: flex; flex-direction: column; line-height: 1; }
.logo-name { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.hdr-nav { display: flex; align-items: center; gap: var(--s5); margin-left: auto; }
.hdr-link { position: relative; font-size: 15px; font-weight: 600; color: var(--ash-700); transition: color .15s; }
.hdr-link:hover, .hdr-link.on { color: var(--navy); }
/* podkreślenie sekcji, w której jesteś — strona „wie", gdzie jest klient */
.hdr-link.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -8px; height: 2px; border-radius: 2px; background: var(--flame); }
.hdr-back { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ash); }
.hdr-back:hover { color: var(--flame); }
.cta-short { display: none; }
@media (max-width: 1140px) { .hdr-back { display: none; } }
/* Poniżej 980 px chowamy linki, ale CTA zostaje — bez niego nagłówek
   na telefonie byłby samym logo i nie prowadziłby nigdzie. */
@media (max-width: 980px) {
  .hdr-nav { display: none; }
  .hdr-in { justify-content: space-between; }
  .hdr-cta { margin-left: auto; }
}
@media (max-width: 420px) {
  .cta-long { display: none; } .cta-short { display: inline; }
}
/* Logo z panelu nie może wejść pod przycisk „Oferta" */
@media (max-width: 560px) { .hdr .logo img { max-height: 32px; max-width: 46vw; } .hdr-in { gap: 16px; } }

/* ===== HERO ===== */
.hero {
  padding: 88px 0 72px; text-align: center; border-bottom: 1px solid var(--line);
  background: radial-gradient(900px 420px at 50% -140px, var(--flame-tint), transparent 70%), var(--white);
}
.hero-in { display: flex; flex-direction: column; align-items: center; gap: var(--s5); }
.hero h1 { font-size: clamp(38px, 6vw, 76px); max-width: 16ch; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--flame); }
.hero .lead { max-width: 60ch; font-size: 19px; }
.hero-cta { display: flex; gap: var(--s3); flex-wrap: wrap; justify-content: center; padding-top: var(--s2); }
.hero-trust { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; font-size: 14.5px; color: var(--ash-700); }
.hero-trust span { display: inline-flex; align-items: center; gap: 7px; }
.hero-trust svg { color: var(--flame); }
@media (max-width: 560px) {
  .hero { padding: 56px 0 48px; }
  .hero .lead { font-size: 17px; }
  .hero-cta { width: 100%; flex-direction: column; } .hero-cta .btn { width: 100%; }
  .hero-trust { flex-direction: column; align-items: center; }
}

/* cztery kafle: bierzesz → dostajesz → oszczędzasz → rośniesz */
.deal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; width: 100%; max-width: 1120px; margin-top: var(--s5); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--e2); }
.deal-cell { padding: 26px 28px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.deal-k { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; }
.deal-v { font-family: var(--font-display); font-size: clamp(22px, 2.1vw, 28px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.deal-d { font-size: 14.5px; line-height: 1.45; }
.deal-1 { background: var(--light); color: var(--navy); }
.deal-1 .deal-k { color: var(--ash); } .deal-1 .deal-d { color: var(--ash-700); }
.deal-2 { background: var(--cobalt); color: #fff; }
.deal-2 .deal-k { color: var(--cobalt-tint); } .deal-2 .deal-d { color: rgba(255,255,255,.85); }
.deal-3 { background: var(--flame); color: #fff; }
.deal-3 .deal-k { color: var(--flame-tint); } .deal-3 .deal-d { color: rgba(255,255,255,.88); }
.deal-4 { background: var(--navy); color: #fff; }
.deal-4 .deal-k { color: rgba(255,255,255,.55); } .deal-4 .deal-d { color: rgba(255,255,255,.75); }
@media (max-width: 1040px) { .deal { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px)  { .deal { grid-template-columns: 1fr; } .deal-cell { padding: 18px 20px; } }

/* ===== SEKCJE ===== */
.sec { padding: var(--s9) 0; }
.sec-tight { padding: var(--s8) 0; }
.sec-paper { background: var(--paper); }
.sec-dark { background: var(--navy); color: #fff; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s6); margin-bottom: var(--s7); }
.sec-head-l { display: flex; flex-direction: column; gap: var(--s3); max-width: 720px; }
.sec-head-r { max-width: 380px; font-size: 16px; }
@media (max-width: 760px) {
  .sec { padding: var(--s8) 0; } .sec-tight { padding: var(--s7) 0; }
  .sec-head { flex-direction: column; align-items: flex-start; margin-bottom: var(--s6); gap: var(--s4); }
}

/* ===== JAK TO DZIAŁA ===== */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s5); }
.step { position: relative; display: flex; flex-direction: column; gap: 10px; padding-top: 64px; }
/* linia łącząca kroki — od kółka do następnego kółka */
.step::before { content: ''; position: absolute; top: 21px; left: 52px; right: calc(8px - var(--s5)); height: 2px; background: var(--line-2); }
.step:last-child::before { display: none; }
.step-n {
  position: absolute; top: 0; left: 0; width: 44px; height: 44px; border-radius: 50%;
  background: var(--navy); color: #fff; font-family: var(--font-mono); font-weight: 600; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.step:first-child .step-n { background: var(--flame); }
.step-t { font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; margin: 0; }
.step-d { font-size: 15.5px; line-height: 1.5; color: var(--ash-700); margin: 0; }
.step-a { margin-top: auto; padding-top: 4px; font-weight: 700; font-size: 15px; color: var(--flame); display: inline-flex; gap: 6px; align-items: center; }
.step-a:hover { color: var(--flame-600); }
@media (max-width: 980px) {
  .steps { grid-template-columns: 1fr 1fr; row-gap: var(--s7); }
  .step:nth-child(2)::before { display: none; }
}
@media (max-width: 620px) {
  .steps { grid-template-columns: 1fr; gap: 0; }
  .step { padding: 0 0 30px 62px; }
  .step:last-child { padding-bottom: 0; }
  .step::before, .step:nth-child(2)::before { display: block; top: 50px; bottom: 6px; left: 21px; right: auto; width: 2px; height: auto; }
  .step:last-child::before { display: none; }
  .step-n { width: 44px; }
}

/* Schemat zamówienia: Langer + reszta → co z tego masz */
.basket {
  margin-top: var(--s8); background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: var(--s6); box-shadow: var(--e1);
  display: grid; grid-template-columns: 2fr 3fr; gap: 12px 6px;
}
.basket-k { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ash); margin-bottom: 4px; }
.bseg { border-radius: var(--r-md); padding: 18px 22px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 96px; color: #fff; }
.bseg-l { grid-column: 1; grid-row: 2; background: var(--flame); }
.bseg-o { grid-column: 2; grid-row: 2; background: var(--navy); }
.bseg-k { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
.bseg-d { font-size: 14px; opacity: .82; }
.bgain { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16.5px; color: var(--navy); padding: 6px 4px 0; }
.bgain-l { grid-column: 1; grid-row: 3; }
.bgain-o { grid-column: 2; grid-row: 3; }
.bgain-ic { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--flame-tint); color: var(--flame); display: inline-flex; align-items: center; justify-content: center; }
.basket-f { grid-column: 1 / -1; grid-row: 4; margin: 10px 0 0; padding-top: 18px; border-top: 1px dashed var(--line-2); font-size: 15.5px; color: var(--ash-700); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.basket-f strong { color: var(--navy); }
.basket-scale { flex: none; display: inline-block; width: 120px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--line), var(--flame)); }
@media (max-width: 700px) {
  .basket { grid-template-columns: 1fr; padding: 20px; gap: 10px; }
  .bseg-l, .bseg-o, .bgain-l, .bgain-o, .basket-f { grid-column: auto; grid-row: auto; }
  .bgain { padding: 0 2px 8px; }
  .bseg { min-height: 0; }
}

/* ===== KARUZELA LANGER =====
   Ten sam wygląd na stronie głównej i na /dla-punktow/ (kopia stylów i
   komponentu jest w obu plikach — zmieniając jeden, popraw drugi).
   Komputer: duży kadr + szczegóły + miniatury z nazwami.
   Telefon: przesuwane karty z kropkami i strzałkami. */
.lc-show { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--e1); }
.lc-media { position: relative; display: flex; align-items: center; justify-content: center; padding: 56px 76px; min-height: 520px;
  background: radial-gradient(58% 52% at 50% 46%, rgb(255 255 255 / 0.10), transparent 72%), var(--navy); }
.lc-photo { display: block; width: 100%; height: 400px; object-fit: contain; filter: drop-shadow(0 24px 30px rgb(0 0 0 / 0.42)); }
.lc-noimg { display: flex; align-items: center; justify-content: center; filter: none; color: rgb(255 255 255 / 0.45);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.lc-badge { position: absolute; top: 22px; left: 22px; z-index: 2; background: var(--flame); color: #fff; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; padding: 7px 12px; border-radius: var(--r-sm); }
.lc-count { position: absolute; bottom: 22px; left: 24px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; color: rgb(255 255 255 / 0.55); }
.lc-nav { position: absolute; top: 50%; z-index: 2; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; color: #fff; background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.2);
  transition: background .15s, border-color .15s; }
.lc-nav:hover { background: var(--flame); border-color: var(--flame); }
.lc-prev { left: 16px; } .lc-next { right: 16px; }
.lc-body { padding: 44px 48px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.lc-cat { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--ash); }
.lc-name { font-family: var(--font-display); font-size: clamp(30px, 3vw, 42px); font-weight: 700; letter-spacing: -.03em; line-height: 1.02; margin: 0; color: var(--navy); }
.lc-sub { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--flame); margin-top: 8px; }
.lc-desc { font-size: 16.5px; line-height: 1.55; color: var(--ash-700); margin: 0; max-width: 60ch; }
.lc-specs { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.lc-spec { background: var(--white); padding: 14px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.lc-spec-k { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
.lc-spec-v { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--navy); line-height: 1.15; overflow-wrap: anywhere; }
.lc-uses { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.lc-use { border: 1px solid var(--line-2); border-radius: var(--r-full); font-size: 13.5px; font-weight: 600; color: var(--navy); padding: 6px 12px; line-height: 1.3; }
.lc-acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 6px; }
.lc-thumbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; margin-top: 14px; }
.lc-thumb { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 8px 12px 8px 8px; border: 1.5px solid var(--line); border-radius: var(--r-md);
  background: var(--white); cursor: pointer; text-align: left; font: inherit; color: var(--navy); transition: border-color .15s, box-shadow .15s; }
.lc-thumb:hover { border-color: var(--line-2); }
.lc-thumb.on { border-color: var(--flame); box-shadow: 0 0 0 3px rgb(240 78 35 / 0.12); }
.lc-thumb-img { flex: none; display: block; width: 34px; height: 50px; object-fit: contain; }
.lc-thumb-img.lc-noimg { background: var(--light); border-radius: 4px; }
.lc-thumb-t { min-width: 0; font-size: 13px; font-weight: 700; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.lc-anim { animation: lc-in .35s ease both; }
@keyframes lc-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.lc-nav:focus-visible, .lc-thumb:focus-visible, .lc-dot:focus-visible, .lc-mnav:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
@media (max-width: 1080px) { .lc-specs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lc-media { padding: 48px 64px; } .lc-body { padding: 36px; } }

/* telefon: przesuwane karty */
.lc-track { display: grid; grid-auto-flow: column; grid-auto-columns: 84%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
  scroll-padding-inline: 20px; margin-inline: -20px; padding: 2px 20px 6px; scrollbar-width: none; overscroll-behavior-x: contain; }
.lc-track::-webkit-scrollbar { display: none; }
.lc-card { scroll-snap-align: start; display: flex; flex-direction: column; min-width: 0; background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.lc-card-media { position: relative; height: 260px; padding: 24px; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(60% 55% at 50% 46%, rgb(255 255 255 / 0.10), transparent 72%), var(--navy); }
.lc-card-media .lc-photo { height: 100%; }
.lc-card-media .lc-badge { top: 12px; left: 12px; font-size: 9.5px; padding: 6px 10px; }
.lc-card-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.lc-card-name { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin: 0; color: var(--navy); }
.lc-card .lc-sub { margin-top: 4px; font-size: 11.5px; }
.lc-card .lc-desc { font-size: 14.5px; line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.lc-card .lc-specs { grid-template-columns: 1fr 1fr; }
.lc-card .lc-spec { padding: 10px 12px; }
.lc-card .lc-spec-v { font-size: 16px; }
.lc-card .lc-uses { margin-top: 0; gap: 6px; }
.lc-card .lc-use { font-size: 12.5px; padding: 5px 10px; }
.lc-card .lc-acts { flex-direction: column; padding-top: 4px; }
.lc-card .lc-acts .btn { width: 100%; padding: 13px 16px; font-size: 15px; }
.lc-mbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.lc-dots { display: flex; flex-wrap: wrap; justify-content: center; min-width: 0; }
.lc-dot { width: 24px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.lc-dot::before { content: ''; width: 8px; height: 8px; border-radius: 4px; background: var(--line-2); transition: width .2s, background .2s; }
.lc-dot.on::before { width: 20px; background: var(--flame); }
.lc-mnav { flex: none; width: 42px; height: 42px; padding: 0; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--white); color: var(--navy);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.lc-mnav:disabled { opacity: .35; cursor: default; }
@media (prefers-reduced-motion: reduce) { .lc-anim { animation: none; } }

/* „Nie wiesz, od czego zacząć?" pod produktami */
.prod-cta { margin-top: var(--s5); display: flex; align-items: center; justify-content: space-between; gap: var(--s5); padding: 22px 28px; background: var(--white); border: 1.5px dashed var(--line-2); border-radius: var(--r-lg); }
.prod-cta p { margin: 0; font-size: 16.5px; line-height: 1.5; color: var(--ash-700); }
.prod-cta strong { color: var(--navy); }
@media (max-width: 760px) { .prod-cta { flex-direction: column; align-items: stretch; padding: 20px; } }

/* ===== PASEK PISTOLETU ===== */
.pistol { background: var(--cobalt); color: #fff; }
.pistol-in { display: flex; align-items: center; justify-content: space-between; gap: var(--s6); padding: var(--s6) 0; }
.pistol-l { display: flex; align-items: center; gap: var(--s5); }
.pistol-price { font-family: var(--font-display); font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; flex: none; }
.pistol-d { font-size: 17px; line-height: 1.45; max-width: 62ch; margin: 0; }
.pistol-d strong { font-weight: 700; }
@media (max-width: 860px) { .pistol-in { flex-direction: column; align-items: flex-start; gap: var(--s4); } }

/* ===== WSPÓŁPRACA MARKETINGOWA ===== */
.pill-note { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--r-full); border: 1px solid var(--navy-700); background: var(--navy-800); color: rgba(255,255,255,.8); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.pill-note svg { color: var(--flame-glow); }
.mkt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s4); }
.mkt {
  background: var(--navy-800); border: 1px solid var(--navy-700); border-radius: var(--r-lg);
  padding: 28px; display: flex; flex-direction: column; gap: 12px; transition: border-color .15s, transform .15s;
}
.mkt:hover { border-color: rgba(255,255,255,.22); transform: translateY(-2px); }
.mkt-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mkt-ic { width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,.06); color: var(--flame-glow); display: inline-flex; align-items: center; justify-content: center; }
.mkt-tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.45); }
.mkt-t { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 4px 0 0; color: #fff; }
.mkt-d { font-size: 15px; line-height: 1.55; color: rgba(255,255,255,.68); margin: 0; }
.mkt-cta {
  margin-top: var(--s6); display: flex; align-items: center; justify-content: space-between; gap: var(--s5);
  padding: 24px 28px; border-radius: var(--r-lg);
  background: rgba(240, 78, 35, .12); border: 1px solid rgba(240, 78, 35, .35);
  background: color-mix(in srgb, var(--flame) 12%, transparent);
  border-color: color-mix(in srgb, var(--flame) 35%, transparent);
}
.mkt-cta p { margin: 0; color: rgba(255,255,255,.82); font-size: 16.5px; line-height: 1.5; }
.mkt-cta strong { color: #fff; }
@media (max-width: 980px) { .mkt-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) {
  .mkt-grid { grid-template-columns: 1fr; gap: var(--s3); }
  .mkt { padding: 22px; }
  .mkt-cta { flex-direction: column; align-items: stretch; padding: 20px; }
  .pill-note { white-space: normal; }
}

/* ===== BEZ RYZYKA ===== */
.safe-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: var(--s6) var(--s5); }
.safe-item { display: flex; gap: 14px; align-items: flex-start; }
.safe-ic { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--flame-tint); color: var(--flame); display: inline-flex; align-items: center; justify-content: center; }
.safe-t { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; line-height: 1.25; margin: 2px 0 6px; }
.safe-d { font-size: 15px; line-height: 1.5; color: var(--ash-700); margin: 0; }

/* ===== GDZIE DOWOZIMY =====
   Mapa obszaru dowozu (dane: shared/delivery-area.js). Ta sama sekcja jest na
   stronie głównej i na /dla-punktow/ — kopia stylów i komponentu w obu plikach. */
.dm-sec { background: var(--white); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.dm-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr); gap: 32px 40px; align-items: center; }
.dm-card { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); background: #F3F5F8; box-shadow: var(--e1); }
.dm-svg { display: block; width: 100%; height: auto; }
.dm-bg { fill: #F3F5F8; }
.dm-river { fill: #B9D1EA; }
.dm-ring { fill: none; stroke: var(--ash); stroke-opacity: .55; stroke-width: 1.5; stroke-dasharray: 6 7; }
.dm-ring-t { font: 600 15px var(--font-mono); fill: var(--ash); letter-spacing: .04em; }
.dm-area { fill: rgb(240 78 35 / 0.13); stroke: var(--flame); stroke-width: 3; stroke-linejoin: round; }
.dm-town circle { fill: var(--navy); stroke: #fff; stroke-width: 3; transition: fill .15s; }
.dm-town text, .dm-ref text, .dm-c-t { paint-order: stroke; stroke: #F3F5F8; stroke-linejoin: round; }
.dm-town text { font: 600 19px var(--font-text); fill: var(--navy); stroke-width: 5px; transition: fill .15s; }
.dm-town.on circle { fill: var(--flame); }
.dm-town.on text { fill: var(--flame-600); font-weight: 700; }
.dm-ref rect, .dm-ref circle { fill: var(--ash); }
.dm-ref text { font: 500 16px var(--font-text); fill: var(--ash-700); stroke-width: 5px; }
.dm-c { fill: var(--flame); stroke: #fff; stroke-width: 4; }
.dm-pulse { fill: var(--flame); transform-box: fill-box; transform-origin: center; animation: dm-pulse 2.4s ease-out infinite; }
@keyframes dm-pulse { from { transform: scale(1); opacity: .45; } to { transform: scale(3.4); opacity: 0; } }
.dm-c-t { font: 700 27px var(--font-display); fill: var(--navy); stroke-width: 6px; letter-spacing: -.01em; }
.dm-inset-bg { fill: #fff; stroke: var(--line); }
.dm-pl { fill: var(--light); stroke: var(--line-2); stroke-width: 1; }
.dm-inset-area { fill: var(--flame); opacity: .85; }
.dm-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.dm-k { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ash-700); }
.dm-towns { display: flex; flex-wrap: wrap; gap: 6px; }
.dm-chip { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: var(--r-full); border: 1.5px solid var(--line-2); background: var(--white);
  font: inherit; font-size: 14px; font-weight: 600; color: var(--navy); cursor: pointer; transition: border-color .12s, background .12s, color .12s; }
.dm-chip:hover, .dm-chip.on { border-color: var(--flame); color: var(--flame-600); }
.dm-chip.on { background: var(--flame-tint); }
.dm-chip:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
.dm-note { margin: 0; padding: 16px 18px; border-radius: var(--r-md); background: var(--paper); border: 1px solid var(--line); font-size: 15px; line-height: 1.5; color: var(--ash-700); }
.dm-note b { color: var(--navy); }
.dm-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ash-700); }
.dm-legend span { display: inline-flex; align-items: center; gap: 7px; }
.dm-legend i { display: inline-block; flex: none; }
.dm-li-area { width: 16px; height: 12px; border-radius: 3px; background: rgb(240 78 35 / 0.18); border: 2px solid var(--flame); }
.dm-li-base { width: 12px; height: 12px; border-radius: 50%; background: var(--flame); box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--flame); }
.dm-li-ring { width: 16px; height: 0; border-top: 2px dashed var(--ash); }
@media (max-width: 900px) { .dm-grid { grid-template-columns: 1fr; } }
/* Telefon: podpisy miast nachodziłyby na siebie — zostaje Płońsk, punkty
   orientacyjne i miasto wybrane na liście pod mapą. */
@media (max-width: 680px) {
  .dm-town text { display: none; }
  .dm-town.on text { display: block; font-size: 30px; stroke-width: 7px; }
  .dm-town circle { r: 9px; }
  .dm-c-t { font-size: 36px; }
  .dm-ref text { font-size: 24px; }
  .dm-ring-t { font-size: 22px; }
  .dm-chip { font-size: 13.5px; padding: 6px 11px; }
}
@media (prefers-reduced-motion: reduce) { .dm-pulse { animation: none; opacity: 0; } }

.dm-head { max-width: 760px; margin-bottom: 36px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.dm-h { font-family: var(--font-display); font-weight: 700; letter-spacing: -.03em; line-height: 1.06; margin: 0; font-size: clamp(28px, 3.4vw, 44px); color: var(--navy); text-wrap: balance; }
.dm-lead { margin: 0; font-size: 17.5px; line-height: 1.55; color: var(--ash-700); max-width: 62ch; }
.dm-side .btn { align-self: flex-start; }

/* ===== FAQ ===== */
.faq-grid { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: var(--s8); align-items: start; }
.faq-side { display: flex; flex-direction: column; gap: var(--s3); position: sticky; top: calc(var(--header-h) + 32px); }
.faq-phone { display: inline-flex; align-items: center; gap: 10px; margin-top: var(--s2); font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--navy); }
.faq-phone:hover { color: var(--flame); }
.faq-list { border-top: 1px solid var(--line-2); }
.faq { border-bottom: 1px solid var(--line-2); }
.faq summary {
  list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding: 20px 0; font-family: var(--font-display); font-weight: 700; font-size: 18.5px; letter-spacing: -0.01em; line-height: 1.3;
  transition: color .15s;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary:hover { color: var(--flame); }
.faq-ic { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line-2); color: var(--navy); display: inline-flex; align-items: center; justify-content: center; transition: transform .2s, background .15s, color .15s, border-color .15s; }
.faq[open] .faq-ic { transform: rotate(45deg); background: var(--navy); border-color: var(--navy); color: #fff; }
.faq-a { margin: 0 0 22px; padding-right: 48px; color: var(--ash-700); font-size: 16px; line-height: 1.6; max-width: 64ch; }
@media (max-width: 900px) {
  .faq-grid { grid-template-columns: 1fr; gap: var(--s6); }
  .faq-side { position: static; }
  .faq summary { font-size: 17px; padding: 18px 0; }
  .faq-a { padding-right: 0; }
}

/* ===== KONTAKT ===== */
/* Na komputerze: opis i telefon po lewej, formularz po prawej. Na telefonie
   formularz idzie zaraz pod opisem — telefon i e-mail dopiero pod nim. */
.contact-grid {
  display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--s8); align-items: start;
  grid-template-areas: "intro form" "direct form"; grid-template-rows: auto 1fr;
}
.contact-intro { grid-area: intro; }
.contact-direct { grid-area: direct; }
.contact-form { grid-area: form; }
@media (max-width: 900px) {
  .contact-grid { grid-template-columns: 1fr; grid-template-areas: "intro" "form" "direct"; grid-template-rows: auto; row-gap: var(--s6); }
  .contact-direct .direct { margin-top: 0; }
}
.next { list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-direction: column; gap: 16px; counter-reset: n; }
.next li { display: grid; grid-template-columns: 36px 1fr; column-gap: 14px; counter-increment: n; }
.next li::before {
  content: counter(n); grid-row: span 2; width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid var(--navy-700); display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--flame-glow);
}
.next b { color: #fff; font-size: 16.5px; line-height: 1.35; }
.next span { color: rgba(255,255,255,.6); font-size: 14.5px; line-height: 1.45; }
.direct { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--navy-700); display: flex; flex-direction: column; gap: 8px; }
.direct-k { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); font-weight: 600; }
.contact-phone { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
.contact-phone:hover { color: var(--flame-glow); }
.direct-row { display: inline-flex; align-items: center; gap: 9px; color: rgba(255,255,255,.8); font-size: 16px; word-break: break-word; }
a.direct-row:hover { color: #fff; }
.direct-row svg { flex: none; color: var(--ash); }
.direct-meta { color: rgba(255,255,255,.55); font-size: 14.5px; }

.form { background: var(--navy-800); border: 1px solid var(--navy-700); border-radius: var(--r-lg); padding: var(--s6); display: flex; flex-direction: column; gap: var(--s4); }
.form-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: var(--s2); }
.form-title { font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; color: #fff; }
.form-time { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ash); white-space: nowrap; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); }
@media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } .form { padding: 22px 18px; } }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field > span, .picks legend { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); font-weight: 600; }
.field input, .field textarea {
  font-family: var(--font-text); font-size: 16px; color: #fff; background: var(--navy); width: 100%;
  border: 1.5px solid var(--navy-700); border-radius: var(--r-sm); padding: 13px 15px;
  transition: border-color .15s, box-shadow .15s; resize: vertical;
}
.field input::placeholder, .field textarea::placeholder { color: rgba(255,255,255,.35); }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--flame); box-shadow: 0 0 0 3px rgba(240, 78, 35, .18); }
.picks { border: 0; padding: 0; margin: 0; min-width: 0; }
.picks legend { padding: 0; margin-bottom: 10px; }
.picks-in { display: flex; flex-wrap: wrap; gap: 8px; }
.pick {
  display: inline-flex; align-items: center; gap: 9px; padding: 9px 14px 9px 10px; cursor: pointer;
  border-radius: var(--r-full); border: 1.5px solid var(--navy-700); background: var(--navy);
  color: rgba(255,255,255,.78); font-size: 14.5px; font-weight: 600; line-height: 1.2;
  transition: border-color .15s, background .15s, color .15s;
}
.pick:hover { border-color: rgba(255,255,255,.35); }
.pick-box { flex: none; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid rgba(255,255,255,.35); display: inline-flex; align-items: center; justify-content: center; color: transparent; transition: background .15s, border-color .15s, color .15s; }
.pick.on { border-color: var(--flame); color: #fff; background: rgba(240, 78, 35, .14); background: color-mix(in srgb, var(--flame) 14%, var(--navy)); }
.pick.on .pick-box { background: var(--flame); border-color: var(--flame); color: #fff; }
.form-note { font-size: 12.5px; line-height: 1.5; color: var(--ash); margin: 0; }
.form-note b { color: rgba(255,255,255,.8); font-weight: 600; }
.form-done { background: var(--navy-800); border: 1px solid var(--navy-700); border-radius: var(--r-lg); padding: var(--s7) var(--s6); text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--s3); }
.form-done-ic { width: 64px; height: 64px; border-radius: 50%; background: rgba(240, 78, 35, .16); color: var(--flame-glow); display: inline-flex; align-items: center; justify-content: center; }
.form-done-t { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin: 0; color: #fff; }
.form-done-acts { display: flex; gap: var(--s2); flex-wrap: wrap; justify-content: center; margin-top: var(--s2); }
.link-btn { background: none; border: 0; padding: 6px; cursor: pointer; color: var(--ash); font-size: 14.5px; font-weight: 600; }
.link-btn:hover { color: #fff; }

/* ===== STOPKA ===== */
.footer { background: var(--navy-900); color: rgba(255,255,255,.55); padding: var(--s7) 0; }
.footer-in { display: flex; align-items: center; justify-content: space-between; gap: var(--s5); flex-wrap: wrap; font-size: 14px; }
.footer-c { display: flex; gap: var(--s5); flex-wrap: wrap; }
.footer a:hover { color: #fff; }

/* ===== PRZYKLEJONY PASEK (mobile) ===== */
.sticky-cta {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
  background: var(--cobalt); color: #fff; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  box-shadow: 0 -8px 28px rgb(14 21 51 / .28);
  transition: transform .25s ease, visibility 0s;
}
/* przy formularzu pasek znika — powtarzałby to, co klient ma przed oczami */
.sticky-cta.off { transform: translateY(110%); visibility: hidden; transition: transform .25s ease, visibility 0s .25s; }
.sticky-cta-t { font-size: 13px; line-height: 1.3; min-width: 0; }
.sticky-acts { display: flex; gap: 8px; flex: none; }
.sticky-call { width: 46px; height: 46px; border-radius: var(--r-sm); border: 1.5px solid rgba(255,255,255,.4); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
.sticky-pad { height: 72px; }
@media (min-width: 861px) { .sticky-cta, .sticky-pad { display: none; } }
@media (max-width: 359px) { .sticky-cta-t { display: none; } .sticky-acts { flex: 1; } .sticky-acts .btn { flex: 1; } }

/* ===== ANIMACJA WEJŚCIA ===== */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s cubic-bezier(.2,0,0,1), transform .7s cubic-bezier(.2,0,0,1); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  html { scroll-behavior: auto; }
  .btn:hover, .snav:hover, .thumb:hover, .mkt:hover { transform: none; }
  .sticky-cta { transition: none; }
}
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <!-- Domyślne slajdy karuzeli Langer (wspólne ze stroną główną i panelem) -->
  <script src="../shared/langer-showcase.js"></script>
  <!-- Obszar dowozu: miasta i mapa (wspólne ze stroną główną) -->
  <script src="../shared/delivery-area.js"></script>

  <script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ============================================================
   PARAMETRY OFERTY I KONTAKT
   ============================================================
   Wartości domyślne — identyczne z tymi w api/settings.js. Strona pobiera
   aktualne z /api/settings; gdy API nie odpowie (brak bazy, podgląd z dysku),
   zostają poniższe. Zmieniasz je w panelu: /admin-langer/ → Ustawienia →
   „Oferta dla punktów handlowych". */
const OFFER_DEFAULTS = {
  landing_discount_text: 'kilka procent', // czytane jako „nawet … taniej"
  landing_pistol_price:  '1',             // '0' = „gratis"

  // Kontakt na tej podstronie. Puste telefon/e-mail = dane z karty
  // „Dane kontaktowe" (contact_*). Puste osoba/godziny = nie pokazujemy.
  landing_phone:  '',
  landing_email:  '',
  landing_person: '',
  landing_hours:  '',

  contact_phone:  '+48 000 000 000',
  contact_email:  'biuro@langerdystrybucja.pl',
  stat_delivery:  '48 h',

  // Identyfikacja wizualna z panelu (Ustawienia → Logo i kolory marki).
  // Puste logo = wbudowany sygnet, tak jak dotąd.
  logo_light:     '',
  logo_dark:      '',
  brand_accent:   '#F04E23',
  langer_showcase: '',   // slajdy karuzeli Langer (JSON) — puste = domyślne
};

/* Ustawienia z panelu -> gotowe teksty i linki. Jedno miejsce, w którym
   rozstrzygamy fallbacki, żeby żadna sekcja nie pokazała pustego „za  zł". */
function terms(o) {

  const free = Number(price.replace(',', '.')) === 0;
  const phone = trim(o.landing_phone) || trim(o.contact_phone);

/* Odcień koloru: mix z bielą (t>0) albo czernią (t<0). Jeden wybrany kolor
   akcentu daje komplet odcieni — hover, wciśnięcie, jasne tło ikon. */
function shade(hex, t) {
  const m = /^#?([\da-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  const mix = (c) => Math.round(t >= 0 ? c + (255 - c) * t : c * (1 + t));
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(mix);
  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');
}

function applyAccent(hex) {
  if (!/^#?[\da-f]{6}$/i.test(String(hex || '').trim())) return;
  const root = document.documentElement.style;
  root.setProperty('--flame', hex);
  root.setProperty('--flame-600', shade(hex, -0.14));
  root.setProperty('--flame-700', shade(hex, -0.28));
  root.setProperty('--flame-tint', shade(hex, 0.86));
  root.setProperty('--flame-glow', shade(hex, 0.14));
}

/* Parametry oferty z panelu. Błąd sieci/API nie może wywrócić strony —
   w najgorszym razie zostają wartości domyślne. */
function useOffer() {
  const [offer, setOffer] = useState(OFFER_DEFAULTS);
  useEffect(() => {
    let alive = true;
    // ?fresh (link z panelu) omija cache CDN — zmiany widać od razu po zapisie
    fetch('/api/settings' + (/[?&]fresh\b/.test(location.search) ? '?fresh=1' : ''))
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (alive && d && typeof d === 'object') setOffer(o => ({ ...o, ...d })); })
      .catch(() => {});
    return () => { alive = false; };
  }, []);
  return offer;
}

/* Marki z panelu (Ustawienia → Marki) — w schemacie zamówienia pokazujemy
   konkretne nazwy zamiast „innych marek". Bez API zostaje opis ogólny. */
function useBrands() {
  const [list, setList] = useState([]);
  useEffect(() => {
    let alive = true;
    fetch('/api/brands')
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (alive && Array.isArray(d)) setList(d.filter(b => typeof b === 'string' && b.trim())); })
      .catch(() => {});
    return () => { alive = false; };
  }, []);
  return list;
}

/* Desktop dostaje duży slider, telefon — przesuwaną karuzelę kafli.
   Renderujemy tylko jeden z nich, żeby nie ładować zdjęć produktów dwa razy. */
function useIsMobile(query = '(max-width: 860px)') {
  const [match, setMatch] = useState(() => window.matchMedia(query).matches);
  useEffect(() => {
    const mq = window.matchMedia(query);
    const on = e => setMatch(e.matches);
    setMatch(mq.matches);
    mq.addEventListener('change', on);
    return () => mq.removeEventListener('change', on);
  }, [query]);
  return match;
}

const useNarrow = useIsMobile;

/* Która sekcja jest teraz na środku ekranu — podświetla link w nagłówku. */
function useActiveSection(ids) {
  const [active, setActive] = useState('');
  const key = ids.join();
  useEffect(() => {
    if (!('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-40% 0px -55% 0px' });
    ids.map(id => document.getElementById(id)).filter(Boolean).forEach(el => io.observe(el));
    return () => io.disconnect();
  }, [key]);
  return active;
}

/* Czy element o danym id jest choć trochę widoczny. */
function useInView(id) {
  const [v, setV] = useState(false);
  useEffect(() => {
    const el = document.getElementById(id);
    if (!el || !('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(([e]) => setV(e.isIntersecting));
    io.observe(el);
    return () => io.disconnect();
  }, [id]);
  return v;
}

/* Odsłanianie sekcji przy przewijaniu. Klasę „in" trzyma stan Reacta, a nie
   ręczna zmiana classList — inaczej pierwsze przerysowanie (np. gdy dojdą
   ustawienia z /api/settings) nadpisałoby className i sekcja zostałaby
   przezroczysta na stałe. */
function Reveal({ as: Tag = 'div', className = '', children, ...rest }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el || !('IntersectionObserver' in window)) { setShown(true); return; }
    const io = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setShown(true); io.disconnect(); }
    }, { rootMargin: '0px 0px -10% 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const cls = [className, 'reveal', shown ? 'in' : ''].filter(Boolean).join(' ');
  return <Tag ref={ref} className={cls} {...rest}>{children}</Tag>;
}

/* ===== ZDJĘCIA PRODUKTÓW: JEDNA WIELKOŚĆ =====
   Wiele zdjęć ma szerokie, puste marginesy (przezroczyste albo jednolite
   tło), przez co produkt wygląda na mniejszy od sąsiada. Po wczytaniu
   liczymy na małej kopii, gdzie naprawdę jest produkt, i pokazujemy tylko
   ten fragment — SVG z viewBox skaluje go jak object-fit: contain, więc
   każdy produkt wypełnia kadr tak samo. Zdjęcie z obcej domeny bez CORS
   (canvas go nie odczyta) zostaje pokazane tak, jak jest. */
function contentBox(img) {
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !nh) return null;
  const k = Math.min(1, 160 / Math.max(nw, nh));
  const w = Math.max(1, Math.round(nw * k)), h = Math.max(1, Math.round(nh * k));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;       // rzuca błąd przy braku CORS
  const at = (x, y) => (y * w + x) * 4;
  // Tło: kolor nieprzezroczystych rogów. Przezroczyste rogi = tło przezroczyste.
  let r = 0, g = 0, b = 0, n = 0;
  for (const i of [at(0, 0), at(w - 1, 0), at(0, h - 1), at(w - 1, h - 1)]) {
    if (d[i + 3] > 200) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  }
  const solid = n >= 3;
  if (solid) { r /= n; g /= n; b /= n; }
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = at(x, y);
    if (d[i + 3] < 24) continue;
    if (solid && Math.abs(d[i] - r) + Math.abs(d[i + 1] - g) + Math.abs(d[i + 2] - b) < 40) continue;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) return null;
  const bx = x0 / k, by = y0 / k, bw = (x1 - x0 + 1) / k, bh = (y1 - y0 + 1) / k;
  if (bw > nw * 0.94 && bh > nh * 0.94) return null;  // produkt już wypełnia kadr
  const pad = Math.max(bw, bh) * 0.03;
  return { nw, nh, x: bx - pad, y: by - pad, w: bw + 2 * pad, h: bh + 2 * pad, bg: solid ? `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})` : null };
}

const sameOrigin = (src) => { try { return new URL(src, location.href).origin === location.origin; } catch (e) { return false; } };

/* Zdjęcie przycięte do produktu. onBg dostaje kolor tła zdjęcia (albo null),
   żeby kafel mógł się do niego dopasować. */
function FitImage({ src, alt = '', className = '', onBg, lazy = true }) {
  const [cors, setCors] = useState(true);
  const [box, setBox] = useState(null);
  const [failed, setFailed] = useState(false);
  useEffect(() => { setBox(null); setFailed(false); setCors(true); }, [src]);

  if (!src || failed) return <span className={className + ' lc-noimg'} role="img" aria-label={alt}>{className.includes('thumb') ? '' : 'Zdjęcie wkrótce'}</span>;
  if (box) return (
    <svg className={className} viewBox={`${box.x} ${box.y} ${box.w} ${box.h}`} preserveAspectRatio="xMidYMid meet" role="img" aria-label={alt}>
      <image href={src} width={box.nw} height={box.nh} />
    </svg>
  );
  return (
    <img key={cors ? 'c' : 'p'} src={src} alt={alt} className={className} decoding="async" loading={lazy ? 'lazy' : undefined}
      crossOrigin={cors ? 'anonymous' : undefined}
      onLoad={e => {
        try { const bx = contentBox(e.target); if (onBg) onBg(bx ? bx.bg : null); if (bx) setBox(bx); }
        catch (err) { if (onBg) onBg(null); }
      }}
      onError={() => { if (cors && !sameOrigin(src)) setCors(false); else setFailed(true); }} />
  );
}

/* Slajdy: lista z panelu (Karuzela Langer) albo domyślna z
   shared/langer-showcase.js. Brakujące pola uzupełnia produkt z bazy. */
function showcaseSlides(value, products = []) {
  const S = window.LangerShowcase;
  if (!S) return [];
  return S.items(value).map((it, i) => {
    const prod = S.findProduct(it, products);
    const sku = String(it.sku || (prod && prod.sku) || '');
    return {
      key: (sku || it.name || 'slajd') + ':' + i,
      sku,
      name: it.name || (prod && prod.name) || '',
      sub: it.sub || (prod && prod.variant) || '',
      cat: it.cat || '',
      badge: it.badge || '',
      desc: it.desc || '',
      specs: (it.specs || []).filter(s => s && (s.k || s.v)).slice(0, 4),
      uses: (it.uses || []).map(u => String(u).trim()).filter(Boolean),
      img: it.img || (prod && (prod.image || prod.image_url)) || (sku ? '/api/img?sku=' + encodeURIComponent(sku) : ''),
    };
  }).filter(s => s.name);
}

/* Komputer: duży kadr, szczegóły, miniatury z nazwami. Strzałki klawiatury
   przełączają produkty, gdy fokus jest w karuzeli. */
function LcShowcase({ slides, cta }) {
  const [i, setI] = useState(0);
  const n = slides.length;
  const k = Math.min(i, n - 1);
  const cur = slides[k];
  const go = (d) => setI(v => (Math.min(v, n - 1) + d + n) % n);
  const onKey = (e) => {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  };
  return (
    <div className="lc" onKeyDown={onKey}>
      <div className="lc-show">
        <div className="lc-media">
          <FitImage key={'m' + cur.key} src={cur.img} alt={cur.name} className="lc-photo lc-anim" lazy={false} />
          {cur.badge && <span className="lc-badge">{cur.badge}</span>}
          <span className="lc-count">{pad2(k + 1)} / {pad2(n)}</span>
          {n > 1 && (
            <>
              <button type="button" className="lc-nav lc-prev" onClick={() => go(-1)} aria-label="Poprzedni produkt"><IArrow s={20} style={{ transform: 'rotate(180deg)' }} /></button>
              <button type="button" className="lc-nav lc-next" onClick={() => go(1)} aria-label="Następny produkt"><IArrow s={20} /></button>
            </>
          )}
        </div>
        <div className="lc-body lc-anim" key={'b' + cur.key} aria-live="polite">
          {cur.cat && <span className="lc-cat">{cur.cat}</span>}
          <div>
            <h3 className="lc-name">{cur.name}</h3>
            {cur.sub && <div className="lc-sub">{cur.sub}</div>}
          </div>
          {cur.desc && <p className="lc-desc">{cur.desc}</p>}
          <LcSpecs specs={cur.specs} />
          <LcUses uses={cur.uses} />
          <div className="lc-acts">{cta(cur)}</div>
        </div>
      </div>
      {n > 1 && (
        <div className="lc-thumbs" role="tablist" aria-label="Produkty w karuzeli">
          {slides.map((s, j) => (
            <button key={s.key} type="button" role="tab" aria-selected={j === k}
                    className={'lc-thumb' + (j === k ? ' on' : '')} onClick={() => setI(j)}>
              <FitImage src={s.img} alt="" className="lc-thumb-img" />
              <span className="lc-thumb-t">{s.name}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* Telefon: przesuwane kciukiem karty. Kropki i strzałki pokazują, gdzie
   jesteś i ile jest jeszcze produktów. */
function LcScroller({ slides, cta }) {
  const ref = useRef(null);
  const [i, setI] = useState(0);
  const n = slides.length;
  useEffect(() => {
    const t = ref.current;
    if (!t) return;
    let raf = 0;
    const on = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const first = t.firstElementChild;
        if (!first) return;
        const step = first.getBoundingClientRect().width + 12;
        const atEnd = t.scrollLeft + t.clientWidth >= t.scrollWidth - 4;
        setI(atEnd ? n - 1 : Math.max(0, Math.min(n - 1, Math.round(t.scrollLeft / step))));
      });
    };
    t.addEventListener('scroll', on, { passive: true });
    return () => { t.removeEventListener('scroll', on); cancelAnimationFrame(raf); };
  }, [n]);
  const go = (j) => {
    const t = ref.current;
    const card = t && t.children[Math.max(0, Math.min(n - 1, j))];
    if (card) t.scrollTo({ left: card.offsetLeft - t.firstElementChild.offsetLeft, behavior: 'smooth' });
  };
  return (
    <div className="lc">
      <div className="lc-track" ref={ref} aria-label="Produkty w karuzeli">
        {slides.map(s => (
          <article className="lc-card" key={s.key}>
            <div className="lc-card-media">
              <FitImage src={s.img} alt={s.name} className="lc-photo" />
              {s.badge && <span className="lc-badge">{s.badge}</span>}
            </div>
            <div className="lc-card-body">
              {s.cat && <span className="lc-cat">{s.cat}</span>}
              <div>
                <h3 className="lc-card-name">{s.name}</h3>
                {s.sub && <div className="lc-sub">{s.sub}</div>}
              </div>
              {s.desc && <p className="lc-desc">{s.desc}</p>}
              <LcSpecs specs={s.specs} />
              <LcUses uses={s.uses} label={false} />
              <div className="lc-acts">{cta(s)}</div>
            </div>
          </article>
        ))}
      </div>
      {n > 1 && (
        <div className="lc-mbar">
          <button type="button" className="lc-mnav" onClick={() => go(i - 1)} disabled={i === 0} aria-label="Poprzedni produkt"><IArrow s={18} style={{ transform: 'rotate(180deg)' }} /></button>
          <div className="lc-dots">
            {slides.map((s, j) => (
              <button key={s.key} type="button" className={'lc-dot' + (j === i ? ' on' : '')} onClick={() => go(j)}
                      aria-label={`${s.name} (${j + 1} z ${n})`} aria-current={j === i ? 'true' : undefined} />
            ))}
          </div>
          <button type="button" className="lc-mnav" onClick={() => go(i + 1)} disabled={i === n - 1} aria-label="Następny produkt"><IArrow s={18} /></button>
        </div>
      )}
    </div>
  );
}

function LangerCarousel({ slides, cta }) {
  const narrow = useNarrow('(max-width: 860px)');
  if (!slides.length) return null;
  return narrow ? <LcScroller slides={slides} cta={cta} /> : <LcShowcase slides={slides} cta={cta} />;
}

/* ===== GDZIE DOWOZIMY =====
   Mapa obszaru dowozu z Płońska. Miasta, kolejność obwodu i punkty
   orientacyjne: shared/delivery-area.js. Ta sama sekcja jest na stronie
   głównej i na /dla-punktow/ (kopia komponentu w obu plikach). */
function DeliveryMap({ hl, onPick }) {
  const D = window.LangerDelivery;
  const geo = useMemo(() => {
    if (!D) return null;
    const towns = D.TOWNS.map(t => ({ ...t, xy: D.project(t.lat, t.lon) }));
    return {
      towns,
      area: D.smooth(towns.map(t => t.xy)),
      c: D.project(D.CENTER.lat, D.CENTER.lon),
      refs: D.REF.map(r => ({ ...r, xy: D.project(r.lat, r.lon) })),
      inArea: D.smooth(D.TOWNS.map(t => D.projectInset(t.lat, t.lon))),
      inC: D.projectInset(D.CENTER.lat, D.CENTER.lon),
    };
  }, []);
  if (!geo) return null;
  const V = D.VIEW, I = D.INSET, c = geo.c, R = 100 * D.kmUnits;
  const lab = (pos, [x, y], gap = 12) => (
    pos === 'l' ? { x: x - gap, y: y + 6, a: 'end' } :
    pos === 't' ? { x, y: y - gap - 4, a: 'middle' } :
    pos === 'b' ? { x, y: y + gap + 18, a: 'middle' } :
                  { x: x + gap, y: y + 6, a: 'start' });
  const ringLab = [c[0] - R * Math.cos(0.35) , c[1] + R * Math.sin(0.35) + 26];
  return (
    <svg className="dm-svg" viewBox={(V.crop || [0, 0, V.w, V.h]).join(' ')} role="img"
         aria-label={`Mapa obszaru dowozu z ${D.CENTER.name}: ${D.TOWNS.map(t => t.name).join(', ')}`}>
      <rect className="dm-bg" width={V.w} height={V.h} />
      <path className="dm-river" d={D.RIVERS} />
      <circle className="dm-ring" cx={c[0]} cy={c[1]} r={R} />
      <text className="dm-ring-t" x={ringLab[0]} y={ringLab[1]} textAnchor="middle">100 km</text>
      <path className="dm-area" d={geo.area} />
      {geo.refs.map(r => {
        const L = lab(r.label, r.xy, 10);
        return (
          <g key={r.name} className="dm-ref">
            <rect x={r.xy[0] - 5} y={r.xy[1] - 5} width="10" height="10" rx="2" />
            <text x={L.x} y={L.y} textAnchor={L.a}>{r.name}</text>
          </g>
        );
      })}
      {geo.towns.map(t => {
        const L = lab(t.label, t.xy);
        const on = hl === t.name;
        return (
          <g key={t.name} className={'dm-town' + (on ? ' on' : '')} onMouseEnter={() => onPick(t.name)} onMouseLeave={() => onPick(null)}>
            <circle cx={t.xy[0]} cy={t.xy[1]} r={on ? 10 : 7} />
            <text x={L.x} y={L.y} textAnchor={L.a}>{t.name}</text>
          </g>
        );
      })}
      <circle className="dm-pulse" cx={c[0]} cy={c[1]} r="13" />
      <circle className="dm-c" cx={c[0]} cy={c[1]} r="13" />
      <text className="dm-c-t" x={c[0] + 22} y={c[1] + 9}>{D.CENTER.name}</text>
      <g transform={`translate(24 ${(V.crop ? V.crop[1] : 0) + 24})`} aria-hidden="true">
        <rect className="dm-inset-bg" x="-10" y="-10" width={I.w + 20} height={I.h + 20} rx="14" />
        <path className="dm-pl" d={D.POLAND} />
        <path className="dm-inset-area" d={geo.inArea} />
        <circle className="dm-c" cx={geo.inC[0]} cy={geo.inC[1]} r="3.5" strokeWidth="1.5" />
      </g>
    </svg>
  );
}

  const items = [
    ['Ile kartonów Langera muszę kupić?',
      'Nie ma sztywnego progu. Zasada jest prosta: bierzesz Langera — zyskujesz. Im większa część Langera w zamówieniu, tym lepsze warunki na resztę. Konkretne liczby policzymy na Twoim koszyku.'],
    ['Jak duży jest rabat na pozostałe marki?',
      `Nawet ${t.discount}. Dokładna wysokość zależy od wielkości zamówienia i udziału Langera — zobaczysz ją czarno na białym w ofercie, zanim cokolwiek zamówisz.`],
    [`Na czym polega pistolet ${t.pistol}?`,
      `Do zamówionych kartonów Langera dokładamy pistolet teflonowy ${t.pistol}. Zaznacz go w zapytaniu, a dopiszemy go do oferty.`],
    ['Czy mogę zamówić same inne marki, bez Langera?',
      `Tak, cały katalog jest dostępny. Rabat na resztę i pistolet ${t.pistol} działają jednak przy zamówieniu z Langerem — dlatego opłaca się go dorzucić.`],
    ['Co, jeśli Langer nie zejdzie z półki?',
      'Przyjmiemy zwrot. Pierwsze zamówienie nic nie ryzykuje.'],
    ['Kto może liczyć na współpracę marketingową?',
      'Punkty, które spełnią odpowiednie warunki współpracy. Zakres i warunki ustalamy indywidualnie — zaznacz „Współpraca marketingowa" w formularzu, a przedstawiciel omówi je przy ofercie.'],
    ['Jak szybko dostanę ofertę?',
      'Przedstawiciel z Twojego regionu odezwie się w ciągu jednego dnia roboczego.'],
    ['Dowozicie do mojej miejscowości?',
      `Z Płońska dojeżdżamy własnym transportem m.in. do: ${(window.LangerDelivery ? window.LangerDelivery.TOWNS.map(x => x.name) : []).join(', ')} — i wszędzie w obszarze zaznaczonym na mapie. Dalej wysyłamy spedycją w całej Polsce.`],
  ];
  return (
    <section className="sec sec-paper" id="faq">
      <div className="wrap faq-grid">
        <div className="faq-side">
          <span className="eyebrow">Pytania</span>
          <h2 className="h2">Zanim zapytasz</h2>
          <p className="lead" style={{ fontSize: 16.5 }}>
            Najczęstsze pytania właścicieli sklepów i hurtowni. Nie ma tu Twojego? Zadzwoń — odpowiemy od ręki.
          </p>
          {t.phone && <a href={t.tel} className="faq-phone"><IPhone s={20}/> {t.phone}</a>}
        </div>
        <div className="faq-list">
          {items.map(([q, a], i) => (
            <details key={q} className="faq" open={i === 0}>
              <summary>{q}<span className="faq-ic"><IPlus s={16}/></span></summary>
              <p className="faq-a">{a}</p>
            </details>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   KONTAKT — „Poproś o ofertę z możliwymi rabatami"
   ============================================================
   Formularz nie ma jeszcze własnego serwera do wysyłki. Zamiast udawać
   wysyłkę, składa gotową wiadomość i otwiera ją w poczcie klienta — adres
   docelowy to e-mail z panelu (Ustawienia → Oferta dla punktów handlowych,
   a gdy pusty: Dane kontaktowe). */
function buildMessage(f, picked, t) {
  const chosen = INTERESTS.filter(([k]) => picked.includes(k)).map(([k, label]) => '- ' + interestLabel(k, label, t));
  const subject = `Zapytanie o ofertę dla punktu — ${f.name}${f.city ? ', ' + f.city : ''}`;
  const body = [
    'Dzień dobry,',
    '',
    'proszę o ofertę dla mojego punktu z możliwymi rabatami.',
    '',
    `Punkt: ${f.name}`,
    `Miejscowość: ${f.city}`,
    `Telefon: ${f.phone}`,
    `E-mail: ${f.email || '—'}`,
    '',
    'Interesuje mnie:',
    ...(chosen.length ? chosen : ['- (nie zaznaczono)']),
    '',
    'Marki, które zamawiam najczęściej:',
    f.brands.trim() || '—',
    '',
    'Pozdrawiam',
  ].join('\r\n');
  return { subject, body };
}

function Contact({ t, picked, toggle }) {
  const [f, setF] = useState({ name: '', city: '', phone: '', email: '', brands: '' });
  const [sent, setSent] = useState(null);       // { href, text } po wysłaniu
  const [copied, setCopied] = useState(false);
  const set = k => e => setF(v => ({ ...v, [k]: e.target.value }));

  function submit(e) {
    e.preventDefault();
    const { subject, body } = buildMessage(f, picked, t);
    const href = t.email ? `mailto:${t.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}` : '';
    const text = (t.email ? `Do: ${t.email}\r\n` : '') + `Temat: ${subject}\r\n\r\n${body}`;
    setSent({ href, text });
    setCopied(false);
    if (href) window.location.href = href;
  }

  async function copy() {
    try { await navigator.clipboard.writeText(sent.text); setCopied(true); }
    catch (e) { window.prompt('Skopiuj treść zapytania:', sent.text); }
  }

  const contactInfo = (
    <div className="direct">
      <span className="direct-k">Wolisz od razu porozmawiać?</span>
      {t.phone && <a href={t.tel} className="contact-phone">{t.phone}</a>}
      {t.email && <a href={'mailto:' + t.email} className="direct-row"><IMail s={17}/> {t.email}</a>}
      {t.person && <span className="direct-row"><IUser s={17}/> {t.person}</span>}
      {t.hours && <span className="direct-row direct-meta"><IClock s={17}/> {t.hours}</span>}
    </div>
  );

  return (
    <section className="sec sec-dark" id="kontakt">
      <div className="wrap contact-grid">
        <Reveal className="contact-intro">
          <span className="eyebrow">Ostatni krok</span>
          <h2 className="h2" style={{ marginTop: 14 }}>Poproś o{'\u00a0'}ofertę z{'\u00a0'}możliwymi rabatami</h2>
          <p className="lead lead-dark" style={{ marginTop: 16, maxWidth: '48ch' }}>
            Napisz, co sprzedajesz — przygotujemy ofertę z rabatem na pozostałe marki
            i pistoletem {t.pistol} do kartonów Langera.
          </p>
          <ol className="next">
            <li><b>Wysyłasz zapytanie</b><span>Minuta, bez zobowiązań.</span></li>
            <li><b>Oddzwaniamy</b><span>Przedstawiciel z Twojego regionu — w ciągu jednego dnia roboczego.</span></li>
            <li><b>Dostajesz ofertę z rabatami</b><span>Czarno na białym. Ty decydujesz, co zamawiasz.</span></li>
          </ol>
        </Reveal>

        <Reveal className="contact-direct">{contactInfo}</Reveal>

        <Reveal className="contact-form">
          {sent ? (
            <div className="form-done" role="status">
              <span className="form-done-ic"><ICheck s={32}/></span>
              <h3 className="form-done-t">{sent.href ? 'Wiadomość jest gotowa' : 'Prawie gotowe'}</h3>
              <p className="lead lead-dark" style={{ fontSize: 16, maxWidth: '42ch' }}>
                {sent.href
                  ? <>Otworzyliśmy Twoją pocztę z gotowym zapytaniem do <b style={{ color: '#fff' }}>{t.email}</b> — wystarczy kliknąć „Wyślij". Poczta się nie otworzyła? Skopiuj treść albo zadzwoń.</>
                  : <>Skopiuj treść zapytania i wyślij ją nam albo po prostu zadzwoń — przygotujemy ofertę.</>}
              </p>
              <div className="form-done-acts">
                {sent.href && <a href={sent.href} className="btn btn-flame"><IMail s={17}/> Otwórz ponownie</a>}
                <button type="button" className="btn btn-outline" onClick={copy}><ICopy s={17}/> {copied ? 'Skopiowano' : 'Kopiuj treść'}</button>
              </div>
              {t.phone && <a href={t.tel} className="contact-phone" style={{ fontSize: 22, marginTop: 8 }}>{t.phone}</a>}
              <button type="button" className="link-btn" onClick={() => setSent(null)}>← Popraw dane</button>
            </div>
          ) : (
            <form className="form" onSubmit={submit}>
              <div className="form-h">
                <span className="form-title">Zapytanie o ofertę</span>
                <span className="form-time">ok. 1 minuty</span>
              </div>
              <div className="form-row">
                <label className="field"><span>Nazwa punktu</span>
                  <input required value={f.name} onChange={set('name')} placeholder="np. Bud-Mat" autoComplete="organization"/>
                </label>
                <label className="field"><span>Miejscowość</span>
                  <input required value={f.city} onChange={set('city')} placeholder="np. Kielce" autoComplete="address-level2"/>
                </label>
              </div>
              <div className="form-row">
                <label className="field"><span>Telefon</span>
                  <input required type="tel" value={f.phone} onChange={set('phone')} placeholder="+48 000 000 000" inputMode="tel" autoComplete="tel"/>
                </label>
                <label className="field"><span>E-mail (opcjonalnie)</span>
                  <input type="email" value={f.email} onChange={set('email')} placeholder="sklep@firma.pl" autoComplete="email"/>
                </label>
              </div>
              <fieldset className="picks">
                <legend>Co Cię interesuje?</legend>
                <div className="picks-in">
                  {INTERESTS.map(([k, label]) => {
                    const on = picked.includes(k);
                    return (
                      <button key={k} type="button" className={'pick' + (on ? ' on' : '')} aria-pressed={on} onClick={() => toggle(k)}>
                        <span className="pick-box"><ICheck s={13}/></span>
                        {interestLabel(k, label, t)}
                      </button>
                    );
                  })}
                </div>
              </fieldset>
              <label className="field">
                <span>Jakie marki zamawiasz najczęściej? (opcjonalnie)</span>
                <textarea rows="3" value={f.brands} onChange={set('brands')} placeholder="np. Soudal, Tytan — pomoże nam policzyć rabat na Twoim koszyku"></textarea>
              </label>
              <button className="btn btn-flame" type="submit" style={{ width: '100%' }}>Wyślij zapytanie o ofertę <IArrow/></button>
              <p className="form-note">
                {t.email && <>Otworzy się Twoja poczta z gotową wiadomością do <b>{t.email}</b> — wystarczy kliknąć „Wyślij". </>}
                Kontakt wyłącznie w sprawie współpracy handlowej.
              </p>
            </form>
          )}
        </Reveal>
      </div>
    </section>
  );
}

/* ============================================================
   STOPKA + PRZYKLEJONY PASEK
   ============================================================ */
function Footer({ offer = {}, t }) {
  return (
    <footer className="footer">
      <div className="wrap footer-in">
        <a href="/" className="logo" style={{ color: '#fff' }}>
          <BrandMark cfg={offer} size={30} onDark />
          {showLogoText(offer) && (
            <span className="logo-words">
              <span className="logo-name" style={{ fontSize: 17 }}>LANGER</span>
            </span>
          )}
        </a>
        <div className="footer-c">
          {t.phone && <a href={t.tel}>{t.phone}</a>}
          {t.email && <a href={'mailto:' + t.email}>{t.email}</a>}
        </div>
        <a href="/">← Wróć na stronę główną</a>
      </div>
    </footer>
  );
}

function StickyCta({ t, hidden }) {
  return (
    <>
      <div className="sticky-pad" />
      <div className={'sticky-cta' + (hidden ? ' off' : '')}>
        <span className="sticky-cta-t">
          <strong>Pistolet {t.pistol}</strong><br/>+ rabat na resztę
        </span>
        <div className="sticky-acts">
          {t.tel && <a href={t.tel} className="sticky-call" aria-label={'Zadzwoń: ' + t.phone}><IPhone s={18}/></a>}
          <a href="#kontakt" className="btn btn-light" style={{ padding: '12px 16px', fontSize: 15 }}>Poproś o ofertę</a>
        </div>
      </div>
    </>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const offer = useOffer();
  const brands = useBrands();
  const t = terms(offer);
  const active = useActiveSection(['oferta', ...NAV.map(([id]) => id), 'bez-ryzyka', 'kontakt']);
  const atContact = useInView('kontakt');

  // Zaznaczenia w formularzu żyją tutaj, bo zmieniają je też przyciski
  // w innych sekcjach („Zapytaj o współpracę marketingową" itd.).
  const [picked, setPicked] = useState(INTEREST_DEFAULT);
  const want = k => setPicked(p => (p.includes(k) ? p : [...p, k]));
  const toggle = k => setPicked(p => (p.includes(k) ? p.filter(x => x !== k) : [...p, k]));

  // Kolor akcentu z panelu — podmienia --flame i odcienie pochodne na całej
  // podstronie (przyciski, odznaki, kafle).
  useEffect(() => { applyAccent(offer.brand_accent); }, [offer.brand_accent]);

  return (
    <div id="top">
      <Header offer={offer} active={active} />
      <main>
        <Hero t={t} />
        <HowItWorks t={t} brands={brands} />
        <Products want={want} offer={offer} />
        <PistolBand t={t} want={want} />
        <Marketing want={want} />
        <Safe t={t} />
        <DeliverySection cta={<a href="#kontakt" className="btn btn-flame">Zapytaj o dowóz <IArrow s={17}/></a>} />
        <Faq t={t} />
        <Contact t={t} picked={picked} toggle={toggle} />
      </main>
      <Footer offer={offer} t={t} />
      <StickyCta t={t} hidden={atContact} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
