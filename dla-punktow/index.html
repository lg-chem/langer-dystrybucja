<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bierzesz Langera — zyskujesz | Oferta dla punktów handlowych | Langer Dystrybucja</title>
  <link rel="icon" href="/api/favicon" />
  <link rel="apple-touch-icon" href="/api/favicon" />
  <meta name="description" content="Oferta dla sklepów i hurtowni: do zamówionych kartonów Langera pistolet za 1 zł, a pozostałe marki nawet kilka procent taniej. Bez sztywnego progu, ze zwrotami bez ryzyka i możliwą współpracą marketingową." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
/* ===== BRAND TOKENS — te same co w index.html ===== */
:root {
  --flame:        #F04E23;
  --flame-600:    #D63F18;
  --flame-700:    #B63411;
  --flame-tint:   #FBE7DF;
  --flame-glow:   #FF6A3D;
  --cobalt:       #1E3FB5;
  --cobalt-600:   #182F95;
  --cobalt-tint:  #E5E9F8;
  --navy:         #0E1533;
  --navy-800:     #161E45;
  --navy-700:     #232C5E;
  --navy-900:     #080C22;
  --ash:          #8B9199;
  --ash-700:      #565D67;
  --light:        #EEF0F3;
  --paper:        #F6F7F9;
  --white:        #FFFFFF;
  --line:         #E2E5EA;
  --line-2:       #CFD4DC;
  --font-display: 'Space Grotesk', 'Hanken Grotesk', system-ui, sans-serif;
  --font-text:    'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, Menlo, monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px; --r-full:999px;
  --e1: 0 1px 2px rgb(14 21 51 / 0.06), 0 1px 1px rgb(14 21 51 / 0.04);
  --e2: 0 18px 48px -16px rgb(14 21 51 / 0.22), 0 6px 16px -8px rgb(14 21 51 / 0.10);
  --header-h: 76px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 16px); }
body {
  margin: 0; background: var(--white); color: var(--navy);
  font-family: var(--font-text); font-size: 17px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--flame); outline-offset: 3px; }

.wrap { width: min(1240px, 100% - 96px); margin-inline: auto; }
@media (max-width: 760px) { .wrap { width: min(1240px, 100% - 40px); } }

.eyebrow {
  display: inline-block; font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--flame);
}
.h1 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; margin: 0; }
.h2 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; margin: 0; font-size: clamp(28px, 3.4vw, 42px); text-wrap: balance; }
.lead { font-size: 18px; line-height: 1.55; color: var(--ash-700); margin: 0; text-wrap: pretty; }
.lead-dark { color: rgba(255,255,255,.72); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font-text); font-size: 16px; font-weight: 700; cursor: pointer;
  border: none; padding: 15px 26px; border-radius: var(--r-sm); text-align: center;
  transition: transform .12s, background .15s, box-shadow .15s, color .15s, border-color .15s;
}
.btn-flame { background: var(--flame); color: #fff; }
.btn-flame:hover { background: var(--flame-600); transform: translateY(-2px); }
.btn-flame:active { background: var(--flame-700); transform: translateY(0); }
.btn-dark { background: var(--navy); color: #fff; }
.btn-dark:hover { background: var(--navy-800); transform: translateY(-2px); }
.btn-light { background: #fff; color: var(--navy); }
.btn-light:hover { transform: translateY(-2px); box-shadow: var(--e2); }
.btn-outline { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.28); }
.btn-outline:hover { border-color: #fff; background: rgba(255,255,255,.06); }

/* ===== HEADER ===== */
.hdr {
  position: sticky; top: 0; z-index: 60; background: rgba(255,255,255,.92);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
}
.hdr-in { display: flex; align-items: center; gap: var(--s6); height: var(--header-h); }
.logo { display: inline-flex; align-items: center; gap: 10px; color: var(--navy); }
.logo-words { display: flex; flex-direction: column; line-height: 1; }
.logo-name { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.logo-sub { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.22em; color: var(--ash-700); margin-top: 3px; }
.hdr-nav { display: flex; align-items: center; gap: var(--s5); margin-left: auto; }
.hdr-link { position: relative; font-size: 15px; font-weight: 600; color: var(--ash-700); transition: color .15s; }
.hdr-link:hover, .hdr-link.on { color: var(--navy); }
/* podkreślenie sekcji, w której jesteś — strona „wie", gdzie jest klient */
.hdr-link.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -8px; height: 2px; border-radius: 2px; background: var(--flame); }
.hdr-back { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ash); }
.hdr-back:hover { color: var(--flame); }
.cta-short { display: none; }
@media (max-width: 1140px) { .hdr-back { display: none; } }
/* Poniżej 980 px chowamy linki, ale CTA zostaje — bez niego nagłówek
   na telefonie byłby samym logo i nie prowadziłby nigdzie. */
@media (max-width: 980px) {
  .hdr-nav { display: none; }
  .hdr-in { justify-content: space-between; }
  .hdr-cta { margin-left: auto; }
}
@media (max-width: 420px) {
  .logo-sub { display: none; }
  .cta-long { display: none; } .cta-short { display: inline; }
}

/* ===== HERO ===== */
.hero {
  padding: 88px 0 72px; text-align: center; border-bottom: 1px solid var(--line);
  background: radial-gradient(900px 420px at 50% -140px, var(--flame-tint), transparent 70%), var(--white);
}
.hero-in { display: flex; flex-direction: column; align-items: center; gap: var(--s5); }
.hero h1 { font-size: clamp(38px, 6vw, 76px); max-width: 16ch; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--flame); }
.hero .lead { max-width: 60ch; font-size: 19px; }
.hero-cta { display: flex; gap: var(--s3); flex-wrap: wrap; justify-content: center; padding-top: var(--s2); }
.hero-trust { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; font-size: 14.5px; color: var(--ash-700); }
.hero-trust span { display: inline-flex; align-items: center; gap: 7px; }
.hero-trust svg { color: var(--flame); }
@media (max-width: 560px) {
  .hero { padding: 56px 0 48px; }
  .hero .lead { font-size: 17px; }
  .hero-cta { width: 100%; flex-direction: column; } .hero-cta .btn { width: 100%; }
  .hero-trust { flex-direction: column; align-items: center; }
}

/* cztery kafle: bierzesz → dostajesz → oszczędzasz → rośniesz */
.deal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; width: 100%; max-width: 1120px; margin-top: var(--s5); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--e2); }
.deal-cell { padding: 26px 28px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.deal-k { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; }
.deal-v { font-family: var(--font-display); font-size: clamp(22px, 2.1vw, 28px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.deal-d { font-size: 14.5px; line-height: 1.45; }
.deal-1 { background: var(--light); color: var(--navy); }
.deal-1 .deal-k { color: var(--ash); } .deal-1 .deal-d { color: var(--ash-700); }
.deal-2 { background: var(--cobalt); color: #fff; }
.deal-2 .deal-k { color: var(--cobalt-tint); } .deal-2 .deal-d { color: rgba(255,255,255,.85); }
.deal-3 { background: var(--flame); color: #fff; }
.deal-3 .deal-k { color: var(--flame-tint); } .deal-3 .deal-d { color: rgba(255,255,255,.88); }
.deal-4 { background: var(--navy); color: #fff; }
.deal-4 .deal-k { color: rgba(255,255,255,.55); } .deal-4 .deal-d { color: rgba(255,255,255,.75); }
@media (max-width: 1040px) { .deal { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px)  { .deal { grid-template-columns: 1fr; } .deal-cell { padding: 18px 20px; } }

/* ===== SEKCJE ===== */
.sec { padding: var(--s9) 0; }
.sec-tight { padding: var(--s8) 0; }
.sec-paper { background: var(--paper); }
.sec-dark { background: var(--navy); color: #fff; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s6); margin-bottom: var(--s7); }
.sec-head-l { display: flex; flex-direction: column; gap: var(--s3); max-width: 720px; }
.sec-head-r { max-width: 380px; font-size: 16px; }
@media (max-width: 760px) {
  .sec { padding: var(--s8) 0; } .sec-tight { padding: var(--s7) 0; }
  .sec-head { flex-direction: column; align-items: flex-start; margin-bottom: var(--s6); gap: var(--s4); }
}

/* ===== JAK TO DZIAŁA ===== */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s5); }
.step { position: relative; display: flex; flex-direction: column; gap: 10px; padding-top: 64px; }
/* linia łącząca kroki — od kółka do następnego kółka */
.step::before { content: ''; position: absolute; top: 21px; left: 52px; right: calc(8px - var(--s5)); height: 2px; background: var(--line-2); }
.step:last-child::before { display: none; }
.step-n {
  position: absolute; top: 0; left: 0; width: 44px; height: 44px; border-radius: 50%;
  background: var(--navy); color: #fff; font-family: var(--font-mono); font-weight: 600; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.step:first-child .step-n { background: var(--flame); }
.step-t { font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; margin: 0; }
.step-d { font-size: 15.5px; line-height: 1.5; color: var(--ash-700); margin: 0; }
.step-a { margin-top: auto; padding-top: 4px; font-weight: 700; font-size: 15px; color: var(--flame); display: inline-flex; gap: 6px; align-items: center; }
.step-a:hover { color: var(--flame-600); }
@media (max-width: 980px) {
  .steps { grid-template-columns: 1fr 1fr; row-gap: var(--s7); }
  .step:nth-child(2)::before { display: none; }
}
@media (max-width: 620px) {
  .steps { grid-template-columns: 1fr; gap: 0; }
  .step { padding: 0 0 30px 62px; }
  .step:last-child { padding-bottom: 0; }
  .step::before, .step:nth-child(2)::before { display: block; top: 50px; bottom: 6px; left: 21px; right: auto; width: 2px; height: auto; }
  .step:last-child::before { display: none; }
  .step-n { width: 44px; }
}

/* Schemat zamówienia: Langer + reszta → co z tego masz */
.basket {
  margin-top: var(--s8); background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: var(--s6); box-shadow: var(--e1);
  display: grid; grid-template-columns: 2fr 3fr; gap: 12px 6px;
}
.basket-k { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ash); margin-bottom: 4px; }
.bseg { border-radius: var(--r-md); padding: 18px 22px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 96px; color: #fff; }
.bseg-l { grid-column: 1; grid-row: 2; background: var(--flame); }
.bseg-o { grid-column: 2; grid-row: 2; background: var(--navy); }
.bseg-k { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
.bseg-d { font-size: 14px; opacity: .82; }
.bgain { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16.5px; color: var(--navy); padding: 6px 4px 0; }
.bgain-l { grid-column: 1; grid-row: 3; }
.bgain-o { grid-column: 2; grid-row: 3; }
.bgain-ic { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--flame-tint); color: var(--flame); display: inline-flex; align-items: center; justify-content: center; }
.basket-f { grid-column: 1 / -1; grid-row: 4; margin: 10px 0 0; padding-top: 18px; border-top: 1px dashed var(--line-2); font-size: 15.5px; color: var(--ash-700); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.basket-f strong { color: var(--navy); }
.basket-scale { flex: none; display: inline-block; width: 120px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--line), var(--flame)); }
@media (max-width: 700px) {
  .basket { grid-template-columns: 1fr; padding: 20px; gap: 10px; }
  .bseg-l, .bseg-o, .bgain-l, .bgain-o, .basket-f { grid-column: auto; grid-row: auto; }
  .bgain { padding: 0 2px 8px; }
  .bseg { min-height: 0; }
}

/* ===== SLIDER PRODUKTÓW (desktop) ===== */
.slider-nav { display: flex; gap: var(--s2); }
.snav {
  width: 52px; height: 52px; border-radius: 50%; background: var(--white); color: var(--navy);
  border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: var(--e1); transition: background .15s, color .15s, border-color .15s, transform .15s;
}
.snav:hover { background: var(--flame); color: #fff; border-color: var(--flame); transform: translateY(-2px); }

.pshow { display: grid; grid-template-columns: 0.85fr 1.15fr; background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--e1); }
.pshow-img { position: relative; background: var(--navy); display: flex; align-items: center; justify-content: center; padding: var(--s7); min-height: 520px; }
.pshow-img img { height: 420px; max-height: 46vh; width: auto; object-fit: contain; filter: drop-shadow(0 24px 40px rgb(0 0 0 / .45)); }
.pshow-badge { position: absolute; top: 24px; left: 24px; background: var(--flame); color: #fff; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; padding: 8px 14px; border-radius: var(--r-sm); }
.pshow-count { position: absolute; bottom: 24px; right: 24px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; color: rgba(255,255,255,.55); }
.pshow-body { padding: var(--s7); display: flex; flex-direction: column; gap: var(--s5); }
.pshow-cat { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--ash); }
.pshow-name { font-family: var(--font-display); font-size: clamp(28px, 3.2vw, 44px); font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin: 0; }
.pshow-sub { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--flame); margin-top: 8px; }
.pshow-desc { font-size: 16.5px; line-height: 1.55; color: var(--ash-700); max-width: 60ch; text-wrap: pretty; margin: 0; }

.specs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.spec { background: var(--white); padding: 16px 14px; display: flex; flex-direction: column; gap: 5px; }
.spec-k { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ash); }
.spec-v { font-size: 19px; font-weight: 700; color: var(--navy); line-height: 1.15; }
@media (max-width: 1080px) { .specs { grid-template-columns: repeat(2, 1fr); } }

.uses { display: flex; gap: var(--s2); flex-wrap: wrap; }
.use { border: 1px solid var(--line-2); border-radius: var(--r-full); color: var(--navy); font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 8px 14px; }

.thumbs { display: flex; gap: var(--s2); margin-top: auto; padding-top: var(--s4); border-top: 1px solid var(--line); flex-wrap: wrap; }
.thumb { width: 70px; height: 84px; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--paper); display: flex; align-items: center; justify-content: center; padding: 7px; cursor: pointer; transition: border-color .15s, opacity .15s, transform .15s; opacity: .55; }
.thumb:hover { opacity: .85; transform: translateY(-2px); }
.thumb.on { border-color: var(--flame); opacity: 1; }
.thumb img { height: 100%; width: auto; object-fit: contain; }

/* ===== KARUZELA PRODUKTÓW (mobile) ===== */
.pscroll { display: flex; gap: var(--s3); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: var(--s3); margin-inline: calc(-1 * var(--s4)); padding-inline: var(--s4); }
.pcard { flex: 0 0 254px; background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; scroll-snap-align: start; display: flex; flex-direction: column; }
.pcard-img { position: relative; height: 210px; background: var(--light); display: flex; align-items: center; justify-content: center; padding: var(--s4); }
.pcard-img img { height: 100%; width: auto; object-fit: contain; }
.pcard-badge { position: absolute; top: 10px; left: 10px; background: var(--flame); color: #fff; font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding: 6px 10px; border-radius: var(--r-sm); }
.pcard-body { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); flex: 1; }
.pcard-name { font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin: 0; }
.pcard-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; padding-top: var(--s3); border-top: 1px solid var(--line); }
.pscroll-hint { font-size: 13.5px; color: var(--ash); }

/* „Nie wiesz, od czego zacząć?" pod produktami */
.prod-cta { margin-top: var(--s5); display: flex; align-items: center; justify-content: space-between; gap: var(--s5); padding: 22px 28px; background: var(--white); border: 1.5px dashed var(--line-2); border-radius: var(--r-lg); }
.prod-cta p { margin: 0; font-size: 16.5px; line-height: 1.5; color: var(--ash-700); }
.prod-cta strong { color: var(--navy); }
@media (max-width: 760px) { .prod-cta { flex-direction: column; align-items: stretch; padding: 20px; } }

/* ===== PASEK PISTOLETU ===== */
.pistol { background: var(--cobalt); color: #fff; }
.pistol-in { display: flex; align-items: center; justify-content: space-between; gap: var(--s6); padding: var(--s6) 0; }
.pistol-l { display: flex; align-items: center; gap: var(--s5); }
.pistol-price { font-family: var(--font-display); font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; flex: none; }
.pistol-d { font-size: 17px; line-height: 1.45; max-width: 62ch; margin: 0; }
.pistol-d strong { font-weight: 700; }
@media (max-width: 860px) { .pistol-in { flex-direction: column; align-items: flex-start; gap: var(--s4); } }

/* ===== WSPÓŁPRACA MARKETINGOWA ===== */
.pill-note { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--r-full); border: 1px solid var(--navy-700); background: var(--navy-800); color: rgba(255,255,255,.8); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.pill-note svg { color: var(--flame-glow); }
.mkt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s4); }
.mkt {
  background: var(--navy-800); border: 1px solid var(--navy-700); border-radius: var(--r-lg);
  padding: 28px; display: flex; flex-direction: column; gap: 12px; transition: border-color .15s, transform .15s;
}
.mkt:hover { border-color: rgba(255,255,255,.22); transform: translateY(-2px); }
.mkt-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mkt-ic { width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,.06); color: var(--flame-glow); display: inline-flex; align-items: center; justify-content: center; }
.mkt-tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.45); }

const trim = v => String(v ?? '').trim();

   rozstrzygamy fallbacki, żeby żadna sekcja nie pokazała pustego „za  zł". */
function terms(o) {
  const price = trim(o.landing_pistol_price) || '1';
  const free = Number(price.replace(',', '.')) === 0;
  const phone = trim(o.landing_phone) || trim(o.contact_phone);
  const email = trim(o.landing_email) || trim(o.contact_email);
  return {
    discount: trim(o.landing_discount_text) || 'kilka procent',
    pistol: free ? 'gratis' : `za ${price} zł`,      // „pistolet za 1 zł" / „pistolet gratis"

/* Odcień koloru: mix z bielą (t>0) albo czernią (t<0). Jeden wybrany kolor
   akcentu daje komplet odcieni — hover, wciśnięcie, jasne tło ikon. */
function shade(hex, t) {
  const m = /^#?([\da-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  const mix = (c) => Math.round(t >= 0 ? c + (255 - c) * t : c * (1 + t));
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(mix);
  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');
}

function applyAccent(hex) {
  if (!/^#?[\da-f]{6}$/i.test(String(hex || '').trim())) return;
  const root = document.documentElement.style;
  root.setProperty('--flame', hex);
  root.setProperty('--flame-600', shade(hex, -0.14));
  root.setProperty('--flame-700', shade(hex, -0.28));
  root.setProperty('--flame-tint', shade(hex, 0.86));
  root.setProperty('--flame-glow', shade(hex, 0.14));
}

    fetch('/api/settings' + (/[?&]fresh\b/.test(location.search) ? '?fresh=1' : ''))
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (alive && d && typeof d === 'object') setOffer(o => ({ ...o, ...d })); })
      .catch(() => {});
    return () => { alive = false; };
  }, []);
  return offer;
}

/* Marki z panelu (Ustawienia → Marki) — w schemacie zamówienia pokazujemy
   konkretne nazwy zamiast „innych marek". Bez API zostaje opis ogólny. */
function useBrands() {
  const [list, setList] = useState([]);
  useEffect(() => {
    let alive = true;
    fetch('/api/brands')
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (alive && Array.isArray(d)) setList(d.filter(b => typeof b === 'string' && b.trim())); })
      .catch(() => {});
    return () => { alive = false; };
  }, []);
  return list;
}

/* Desktop dostaje duży slider, telefon — przesuwaną karuzelę kafli.
   Renderujemy tylko jeden z nich, żeby nie ładować zdjęć produktów dwa razy. */
function useIsMobile(query = '(max-width: 860px)') {
  const [match, setMatch] = useState(() => window.matchMedia(query).matches);
  useEffect(() => {
    const mq = window.matchMedia(query);
    const on = e => setMatch(e.matches);
    setMatch(mq.matches);
    mq.addEventListener('change', on);
    return () => mq.removeEventListener('change', on);
  }, [query]);
  return match;
}

/* Która sekcja jest teraz na środku ekranu — podświetla link w nagłówku. */
function useActiveSection(ids) {
  const [active, setActive] = useState('');
  const key = ids.join();
  useEffect(() => {
    if (!('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-40% 0px -55% 0px' });
    ids.map(id => document.getElementById(id)).filter(Boolean).forEach(el => io.observe(el));
    return () => io.disconnect();
  }, [key]);
  return active;
}

/* Czy element o danym id jest choć trochę widoczny. */
function useInView(id) {
  const [v, setV] = useState(false);
  useEffect(() => {
    const el = document.getElementById(id);
    if (!el || !('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(([e]) => setV(e.isIntersecting));
    io.observe(el);
    return () => io.disconnect();
  }, [id]);
  return v;
}

/* Odsłanianie sekcji przy przewijaniu. Klasę „in" trzyma stan Reacta, a nie
   ręczna zmiana classList — inaczej pierwsze przerysowanie (np. gdy dojdą
   ustawienia z /api/settings) nadpisałoby className i sekcja zostałaby
   przezroczysta na stałe. */
function Reveal({ as: Tag = 'div', className = '', children, ...rest }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el || !('IntersectionObserver' in window)) { setShown(true); return; }
    const io = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setShown(true); io.disconnect(); }
    }, { rootMargin: '0px 0px -10% 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const cls = [className, 'reveal', shown ? 'in' : ''].filter(Boolean).join(' ');
  return <Tag ref={ref} className={cls} {...rest}>{children}</Tag>;
}

  [IVideo,   'Wideo',          'Filmy wideo',                      'Tworzenie i edycja filmów: prezentacja punktu, produktów i realizacji. Także krótkie formy na Facebooka, Instagram i YouTube.'],
  [IMega,    'Reklama płatna', 'Google Ads i Meta Ads',            'Pomoc w ustawieniu i prowadzeniu kampanii w Google oraz na Facebooku i Instagramie — tak, żeby budżet trafiał do kupujących.'],
  [IPin,     'Lokalnie',       'Wizytówka Google',                 'Profil firmy w Mapach Google: zdjęcia, godziny otwarcia, opinie i wpisy. Klienci z okolicy łatwiej Cię znajdą.'],
  [ISearch,  'Widoczność',     'SEO i GEO',                        'Widoczność w wyszukiwarce i w odpowiedziach asystentów AI (ChatGPT, Gemini), gdy ktoś szuka chemii budowlanej w Twojej okolicy.'],
  [ICompass, 'Plan',           'Strategia marketingowa',           'Plan dopasowany do Twojego punktu i budżetu: do kogo mówić, gdzie i z jaką ofertą.'],
  [ITarget,  'Zasięg',         'Klienci lokalni i ogólnopolscy',   'Docieramy do wykonawców i klientów z Twojej okolicy, a przy sprzedaży wysyłkowej — w całej Polsce.'],
];

  return (
    <section className="sec sec-dark" id="marketing">
      <div className="wrap">
        <div className="sec-head">
          <div className="sec-head-l">
            <span className="eyebrow">Współpraca marketingowa</span>
            <h2 className="h2">Pomożemy Ci sprzedawać więcej{'\u00a0'}— także w{'\u00a0'}internecie</h2>
          </div>
          <div className="sec-head-r" style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 14 }}>
            <span className="pill-note"><IStar s={15}/> Po spełnieniu warunków współpracy</span>
            <p className="lead lead-dark" style={{ fontSize: 16 }}>
              Wspieramy punkt marketingowo: od filmów i reklam po widoczność w Google
              i w asystentach AI. Robimy to, co zwykle zleca się agencji.
            </p>
          </div>
        </div>

        <Reveal className="mkt-grid">
          {MARKETING.map(([Icon, tag, title, desc]) => (
            <article key={title} className="mkt">

                <span className="mkt-ic"><Icon s={24}/></span>

              <h3 className="mkt-t">{title}</h3>

        <div className="mkt-cta">
          <p><strong>Zakres i warunki ustalamy indywidualnie.</strong> Zapytaj przy okazji oferty — przedstawiciel powie, co jest możliwe dla Twojego punktu.</p>
          <a href="#kontakt" className="btn btn-flame" style={{ flex: 'none' }} onClick={() => want('marketing')}>
            Zapytaj o współpracę marketingową <IArrow s={17}/>
          </a>
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   BEZ RYZYKA — ostatnie wątpliwości przed formularzem
   ============================================================ */
function Safe({ t }) {
  const items = [
    [IShield, 'Zwroty bez ryzyka', 'Jeśli towar nie schodzi z półek, przyjmiemy zwrot. Pierwsze zamówienie nic nie ryzykuje.'],
    [IUser,   'Opiekun z Twojego regionu', 'Jedna osoba od oferty, zamówień i uzupełnień — zna Twój punkt i asortyment.'],
    [ILayers, 'Elastyczne ilości', 'Zamawiasz tyle, ile realnie sprzedasz — bez sztywnych minimów.'],
  ];
  // „Średni czas realizacji" z panelu (Ustawienia → Liczby w hero). Puste = kafel znika.
  if (t.delivery) items.push([ITruck, `Dostawa średnio w ${t.delivery}`, 'Prosto do Twojego punktu — od paczki po paletę.']);

  return (
    <section className="sec sec-tight" id="bez-ryzyka">
      <div className="wrap">
        <div className="sec-head" style={{ marginBottom: 'var(--s6)' }}>
          <div className="sec-head-l">
            <span className="eyebrow">Bez ryzyka</span>
            <h2 className="h2">Spróbuj Langera bez obaw</h2>
          </div>
        </div>
        <Reveal className="safe-grid">
          {items.map(([Icon, title, desc]) => (
            <div key={title} className="safe-item">
              <span className="safe-ic"><Icon s={22}/></span>
              <div>
                <h3 className="safe-t">{title}</h3>
                <p className="safe-d">{desc}</p>

/* ============================================================
   PYTANIA
   ============================================================ */
function Faq({ t }) {
  const items = [
    ['Ile kartonów Langera muszę kupić?',
      'Nie ma sztywnego progu. Zasada jest prosta: bierzesz Langera — zyskujesz. Im większa część Langera w zamówieniu, tym lepsze warunki na resztę. Konkretne liczby policzymy na Twoim koszyku.'],
    ['Jak duży jest rabat na pozostałe marki?',
      `Nawet ${t.discount}. Dokładna wysokość zależy od wielkości zamówienia i udziału Langera — zobaczysz ją czarno na białym w ofercie, zanim cokolwiek zamówisz.`],
    [`Na czym polega pistolet ${t.pistol}?`,
      `Do zamówionych kartonów Langera dokładamy pistolet teflonowy ${t.pistol}. Zaznacz go w zapytaniu, a dopiszemy go do oferty.`],
    ['Czy mogę zamówić same inne marki, bez Langera?',
      `Tak, cały katalog jest dostępny. Rabat na resztę i pistolet ${t.pistol} działają jednak przy zamówieniu z Langerem — dlatego opłaca się go dorzucić.`],
    ['Co, jeśli Langer nie zejdzie z półki?',
      'Przyjmiemy zwrot. Pierwsze zamówienie nic nie ryzykuje.'],
    ['Kto może liczyć na współpracę marketingową?',
      'Punkty, które spełnią odpowiednie warunki współpracy. Zakres i warunki ustalamy indywidualnie — zaznacz „Współpraca marketingowa" w formularzu, a przedstawiciel omówi je przy ofercie.'],
    ['Jak szybko dostanę ofertę?',
      'Przedstawiciel z Twojego regionu odezwie się w ciągu jednego dnia roboczego.'],
  ];
  return (
    <section className="sec sec-paper" id="faq">
      <div className="wrap faq-grid">
        <div className="faq-side">
          <span className="eyebrow">Pytania</span>
          <h2 className="h2">Zanim zapytasz</h2>
          <p className="lead" style={{ fontSize: 16.5 }}>
            Najczęstsze pytania właścicieli sklepów i hurtowni. Nie ma tu Twojego? Zadzwoń — odpowiemy od ręki.
          </p>
          {t.phone && <a href={t.tel} className="faq-phone"><IPhone s={20}/> {t.phone}</a>}
        </div>
        <div className="faq-list">
          {items.map(([q, a], i) => (
            <details key={q} className="faq" open={i === 0}>
              <summary>{q}<span className="faq-ic"><IPlus s={16}/></span></summary>
              <p className="faq-a">{a}</p>

/* ============================================================
   KONTAKT — „Poproś o ofertę z możliwymi rabatami"
   ============================================================
   Formularz nie ma jeszcze własnego serwera do wysyłki. Zamiast udawać
   wysyłkę, składa gotową wiadomość i otwiera ją w poczcie klienta — adres
   docelowy to e-mail z panelu (Ustawienia → Oferta dla punktów handlowych,
   a gdy pusty: Dane kontaktowe). */
function buildMessage(f, picked, t) {
  const chosen = INTERESTS.filter(([k]) => picked.includes(k)).map(([k, label]) => '- ' + interestLabel(k, label, t));
  const subject = `Zapytanie o ofertę dla punktu — ${f.name}${f.city ? ', ' + f.city : ''}`;
  const body = [
    'Dzień dobry,',
    '',
    'proszę o ofertę dla mojego punktu z możliwymi rabatami.',
    '',
    `Punkt: ${f.name}`,
    `Miejscowość: ${f.city}`,
    `Telefon: ${f.phone}`,
    `E-mail: ${f.email || '—'}`,
    '',
    'Interesuje mnie:',
    ...(chosen.length ? chosen : ['- (nie zaznaczono)']),
    '',
    'Marki, które zamawiam najczęściej:',
    f.brands.trim() || '—',
    '',
    'Pozdrawiam',
  ].join('\r\n');
  return { subject, body };
}

function Contact({ t, picked, toggle }) {
  const [f, setF] = useState({ name: '', city: '', phone: '', email: '', brands: '' });
  const [sent, setSent] = useState(null);       // { href, text } po wysłaniu
  const [copied, setCopied] = useState(false);
  const set = k => e => setF(v => ({ ...v, [k]: e.target.value }));

  function submit(e) {
    e.preventDefault();
    const { subject, body } = buildMessage(f, picked, t);
    const href = t.email ? `mailto:${t.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}` : '';
    const text = (t.email ? `Do: ${t.email}\r\n` : '') + `Temat: ${subject}\r\n\r\n${body}`;
    setSent({ href, text });
    setCopied(false);
    if (href) window.location.href = href;
  }

  async function copy() {
    try { await navigator.clipboard.writeText(sent.text); setCopied(true); }
    catch (e) { window.prompt('Skopiuj treść zapytania:', sent.text); }
  }

  const contactInfo = (
    <div className="direct">
      <span className="direct-k">Wolisz od razu porozmawiać?</span>
      {t.phone && <a href={t.tel} className="contact-phone">{t.phone}</a>}
      {t.email && <a href={'mailto:' + t.email} className="direct-row"><IMail s={17}/> {t.email}</a>}
      {t.person && <span className="direct-row"><IUser s={17}/> {t.person}</span>}
      {t.hours && <span className="direct-row direct-meta"><IClock s={17}/> {t.hours}</span>}
    </div>
  );

  return (
    <section className="sec sec-dark" id="kontakt">
      <div className="wrap contact-grid">
        <Reveal className="contact-intro">
          <span className="eyebrow">Ostatni krok</span>
          <h2 className="h2" style={{ marginTop: 14 }}>Poproś o{'\u00a0'}ofertę z{'\u00a0'}możliwymi rabatami</h2>
          <p className="lead lead-dark" style={{ marginTop: 16, maxWidth: '48ch' }}>
            Napisz, co sprzedajesz — przygotujemy ofertę z rabatem na pozostałe marki
            i pistoletem {t.pistol} do kartonów Langera.
          </p>
          <ol className="next">
            <li><b>Wysyłasz zapytanie</b><span>Minuta, bez zobowiązań.</span></li>
            <li><b>Oddzwaniamy</b><span>Przedstawiciel z Twojego regionu — w ciągu jednego dnia roboczego.</span></li>
            <li><b>Dostajesz ofertę z rabatami</b><span>Czarno na białym. Ty decydujesz, co zamawiasz.</span></li>
          </ol>
        </Reveal>

        <Reveal className="contact-direct">{contactInfo}</Reveal>

        <Reveal className="contact-form">
          {sent ? (
            <div className="form-done" role="status">
              <span className="form-done-ic"><ICheck s={32}/></span>
              <h3 className="form-done-t">{sent.href ? 'Wiadomość jest gotowa' : 'Prawie gotowe'}</h3>
              <p className="lead lead-dark" style={{ fontSize: 16, maxWidth: '42ch' }}>
                {sent.href
                  ? <>Otworzyliśmy Twoją pocztę z gotowym zapytaniem do <b style={{ color: '#fff' }}>{t.email}</b> — wystarczy kliknąć „Wyślij". Poczta się nie otworzyła? Skopiuj treść albo zadzwoń.</>
                  : <>Skopiuj treść zapytania i wyślij ją nam albo po prostu zadzwoń — przygotujemy ofertę.</>}
              </p>
              <div className="form-done-acts">
                {sent.href && <a href={sent.href} className="btn btn-flame"><IMail s={17}/> Otwórz ponownie</a>}
                <button type="button" className="btn btn-outline" onClick={copy}><ICopy s={17}/> {copied ? 'Skopiowano' : 'Kopiuj treść'}</button>
              </div>
              {t.phone && <a href={t.tel} className="contact-phone" style={{ fontSize: 22, marginTop: 8 }}>{t.phone}</a>}
              <button type="button" className="link-btn" onClick={() => setSent(null)}>← Popraw dane</button>
            </div>
          ) : (
            <form className="form" onSubmit={submit}>
              <div className="form-h">
                <span className="form-title">Zapytanie o ofertę</span>
                <span className="form-time">ok. 1 minuty</span>
              </div>
              <div className="form-row">
                <label className="field"><span>Nazwa punktu</span>
                  <input required value={f.name} onChange={set('name')} placeholder="np. Bud-Mat" autoComplete="organization"/>
                </label>
                <label className="field"><span>Miejscowość</span>
                  <input required value={f.city} onChange={set('city')} placeholder="np. Kielce" autoComplete="address-level2"/>
                </label>
              </div>
              <div className="form-row">
                <label className="field"><span>Telefon</span>
                  <input required type="tel" value={f.phone} onChange={set('phone')} placeholder="+48 000 000 000" inputMode="tel" autoComplete="tel"/>
                </label>
                <label className="field"><span>E-mail (opcjonalnie)</span>
                  <input type="email" value={f.email} onChange={set('email')} placeholder="sklep@firma.pl" autoComplete="email"/>
                </label>
              </div>
              <fieldset className="picks">
                <legend>Co Cię interesuje?</legend>
                <div className="picks-in">
                  {INTERESTS.map(([k, label]) => {
                    const on = picked.includes(k);
                    return (
                      <button key={k} type="button" className={'pick' + (on ? ' on' : '')} aria-pressed={on} onClick={() => toggle(k)}>
                        <span className="pick-box"><ICheck s={13}/></span>
                        {interestLabel(k, label, t)}
                      </button>
                    );
                  })}
                </div>
              </fieldset>
              <label className="field">
                <span>Jakie marki zamawiasz najczęściej? (opcjonalnie)</span>
                <textarea rows="3" value={f.brands} onChange={set('brands')} placeholder="np. Soudal, Tytan — pomoże nam policzyć rabat na Twoim koszyku"></textarea>
              </label>
              <button className="btn btn-flame" type="submit" style={{ width: '100%' }}>Wyślij zapytanie o ofertę <IArrow/></button>
              <p className="form-note">
                {t.email && <>Otworzy się Twoja poczta z gotową wiadomością do <b>{t.email}</b> — wystarczy kliknąć „Wyślij". </>}
                Kontakt wyłącznie w sprawie współpracy handlowej.
              </p>
            </form>
          )}
        </Reveal>
      </div>
    </section>
  );
}

/* ============================================================
   STOPKA + PRZYKLEJONY PASEK
   ============================================================ */
function Footer({ offer = {}, t }) {
  return (
    <footer className="footer">
      <div className="wrap footer-in">
        <a href="/" className="logo" style={{ color: '#fff' }}>
          <BrandMark cfg={offer} size={30} onDark />
          {showLogoText(offer) && (
            <span className="logo-words">
              <span className="logo-name" style={{ fontSize: 17 }}>LANGER</span>
              <span className="logo-sub" style={{ color: 'rgba(255,255,255,.5)' }}>DYSTRYBUCJA</span>
            </span>
          )}
        </a>
        <div className="footer-c">
          {t.phone && <a href={t.tel}>{t.phone}</a>}
          {t.email && <a href={'mailto:' + t.email}>{t.email}</a>}
        </div>
        <a href="/">← Wróć na stronę główną</a>
      </div>
    </footer>
  );
}

function StickyCta({ t, hidden }) {
  return (
    <>
      <div className="sticky-pad" />
      <div className={'sticky-cta' + (hidden ? ' off' : '')}>
        <span className="sticky-cta-t">
          <strong>Pistolet {t.pistol}</strong><br/>+ rabat na resztę
        </span>
        <div className="sticky-acts">
          {t.tel && <a href={t.tel} className="sticky-call" aria-label={'Zadzwoń: ' + t.phone}><IPhone s={18}/></a>}
          <a href="#kontakt" className="btn btn-light" style={{ padding: '12px 16px', fontSize: 15 }}>Poproś o ofertę</a>
        </div>
      </div>
    </>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const offer = useOffer();
  const brands = useBrands();
  const t = terms(offer);
  const active = useActiveSection(['oferta', ...NAV.map(([id]) => id), 'bez-ryzyka', 'kontakt']);
  const atContact = useInView('kontakt');

  // Zaznaczenia w formularzu żyją tutaj, bo zmieniają je też przyciski
  // w innych sekcjach („Zapytaj o współpracę marketingową" itd.).
  const [picked, setPicked] = useState(INTEREST_DEFAULT);
  const want = k => setPicked(p => (p.includes(k) ? p : [...p, k]));
  const toggle = k => setPicked(p => (p.includes(k) ? p.filter(x => x !== k) : [...p, k]));

  // Kolor akcentu z panelu — podmienia --flame i odcienie pochodne na całej
  // podstronie (przyciski, odznaki, kafle).
  useEffect(() => { applyAccent(offer.brand_accent); }, [offer.brand_accent]);

  return (
    <div id="top">
      <Header offer={offer} active={active} />
      <main>
        <Hero t={t} />
        <HowItWorks t={t} brands={brands} />
        <Products want={want} />
        <PistolBand t={t} want={want} />
        <Marketing want={want} />
        <Safe t={t} />
        <Faq t={t} />
        <Contact t={t} picked={picked} toggle={toggle} />
      </main>
      <Footer offer={offer} t={t} />
      <StickyCta t={t} hidden={atContact} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
