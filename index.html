<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Langer Dystrybucja — hurtowa dystrybucja chemii budowlanej</title>
  <link rel="icon" href="/api/favicon" />
  <link rel="apple-touch-icon" href="/api/favicon" />
  <meta name="description" content="Hurtowa dystrybucja chemii budowlanej: piany montażowe, silikony, akryle, kleje i akcesoria dla sklepów, hurtowni i ekip wykonawczych." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script>
  /* Dane z API pobieramy od razu, równolegle z ładowaniem Reacta i fontów.
     Wcześniej szły jedna runda po drugiej: najpierw skrypty, potem ustawienia,
     dopiero po wyświetleniu strony produkty. Błąd albo brak API (strona
     otwarta z dysku) = null, a aplikacja zostaje przy wartościach domyślnych.
     ?fresh w adresie strony (link „Zobacz stronę" z panelu) omija cache CDN,
     żeby zmiany zapisane przed chwilą były widać od razu. */
  window.__BOOT = (function () {
    var q = /[?&]fresh\b/.test(location.search) ? '?fresh=1' : '';
    function get(path) {
      return fetch(path + q)
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    }
    return {
      categories: get('/api/categories'),
      brands:     get('/api/brands'),
      settings:   get('/api/settings'),
      products:   get('/api/products'),
    };
  })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
/* ===== BRAND TOKENS ===== */
:root {
  --flame:        #F04E23;
  --flame-600:    #D63F18;
  --flame-700:    #B63411;
  --flame-tint:   #FBE7DF;
  --flame-glow:   #FF6A3D;
  --cobalt:       #1E3FB5;
  --cobalt-600:   #182F95;
  --cobalt-tint:  #E5E9F8;
  --navy:         #0E1533;
  --navy-800:     #161E45;
  --navy-700:     #232C5E;
  --navy-900:     #080C22;
  --ash:          #8B9199;
  --ash-700:      #565D67;
  --light:        #EEF0F3;
  --paper:        #F6F7F9;
  --white:        #FFFFFF;
  --line:         #E2E5EA;
  --line-2:       #CFD4DC;
  --font-display: 'Space Grotesk', 'Hanken Grotesk', system-ui, sans-serif;
  --font-text:    'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, Menlo, monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px; --s10:128px;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px; --r-full:999px;
  --e1: 0 1px 2px rgb(14 21 51 / 0.06), 0 1px 1px rgb(14 21 51 / 0.04);
  --e2: 0 18px 48px -16px rgb(14 21 51 / 0.22), 0 6px 16px -8px rgb(14 21 51 / 0.10);
  --e-flame: 0 16px 40px -12px rgb(240 78 35 / 0.45);
  --max: 1240px;
  --header-h: 76px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 16px); }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--navy);
  font-family: var(--font-text);
  font-size: 17px;
  line-height: 1.6;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
img { max-width: 100%; display: block; }

/* Ekran startowy — widać go, zanim React narysuje stronę (zamiast białej
   kartki). Granat jak hero, więc przejście w gotową stronę jest płynne. */
.boot { min-height: 100vh; background: var(--navy); position: relative; overflow: hidden; }
.boot::before { content: ''; position: absolute; top: 0; left: 0; height: 3px; width: 40%;
  background: var(--flame); animation: boot-bar 1.1s ease-in-out infinite; }
@keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .boot::before { animation: none; width: 100%; opacity: .5; } }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
::selection { background: var(--flame); color: #fff; }

.wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding-inline: 32px; }
@media (max-width: 760px){ .wrap { padding-inline: 20px; } }

.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--flame);
  display: inline-flex; align-items: center; gap: 10px;
}
.eyebrow::before { content:''; width: 22px; height: 2px; background: var(--flame); display:inline-block; }
.eyebrow.on-dark { color: var(--flame-glow); }

h1,h2,h3,h4 { font-family: var(--font-display); margin: 0; line-height: 1.02; letter-spacing: -0.03em; font-weight: 700; }
.display { font-size: clamp(44px, 7vw, 92px); line-height: 0.94; letter-spacing: -0.04em; }
.h-sec   { font-size: clamp(29px, 3.5vw, 46px); letter-spacing: -0.035em; text-wrap: balance; }
.lead { font-size: clamp(17px, 2vw, 21px); line-height: 1.55; color: var(--ash-700); font-weight: 400; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:10px;
  font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing:-0.01em;
  padding: 15px 26px; border-radius: var(--r-sm); transition: transform .12s, background .15s, box-shadow .15s, color .15s;
  white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn-flame { background: var(--flame); color:#fff; box-shadow: var(--e-flame); }
.btn-flame:hover { background: var(--flame-600); transform: translateY(-2px); }
.btn-flame:active { background: var(--flame-700); transform: translateY(0); }
.btn-dark { background: var(--navy); color:#fff; }
.btn-dark:hover { background: var(--navy-800); transform: translateY(-2px); }
.btn-ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--line-2); }
.btn-ghost:hover { border-color: var(--navy); background: var(--white); }
.btn-ghost.on-dark { color:#fff; border-color: rgb(255 255 255 / 0.28); }
.btn-ghost.on-dark:hover { border-color:#fff; background: rgb(255 255 255 / 0.08); }

.chip { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600;
  padding: 7px 14px; border-radius: var(--r-full); border:1px solid var(--line-2); color: var(--ash-700);
  background: var(--white); transition: all .12s; cursor:pointer; }
.chip:hover { border-color: var(--navy); color: var(--navy); }
.chip.active { background: var(--navy); color:#fff; border-color: var(--navy); }
.chip-n { font-family: var(--font-mono); font-size: 11px; opacity: .55; }

.reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s cubic-bezier(.2,0,0,1), transform .7s cubic-bezier(.2,0,0,1); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce){ .reveal { opacity:1; transform:none; transition:none; } html{scroll-behavior:auto;} }

/* ===== HEADER ===== */
/* Nagłówek zawsze jasny — strona zaczyna się od jasnego hero, więc nie ma
   przeskoku z białych napisów na ciemne w trakcie przewijania. */
.hdr { position: fixed; inset: 0 0 auto 0; height: var(--header-h); z-index: 100; color: var(--navy);
  display: flex; align-items: center; transition: box-shadow .25s;
  background: rgb(255 255 255 / 0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.hdr-solid { box-shadow: 0 10px 30px -18px rgb(14 21 51 / 0.35); }
.hdr-in { display: flex; align-items: center; gap: 24px; width: 100%; }
.logo { display: inline-flex; align-items: center; gap: 12px; }
.logo-words { display: flex; flex-direction: column; line-height: 1; }
.logo-name { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -0.02em; }
.hdr-nav { display: flex; gap: 4px; margin-left: auto; }
.hdr-link { font-weight: 600; font-size: 15px; padding: 9px 14px; border-radius: var(--r-sm); color: inherit; transition: background .12s, color .12s; }
.hdr-link:hover { color: var(--flame); }
.hdr-cta { display: flex; }
.hdr-burger { display: none; color: inherit; padding: 6px; }
/* Menu na telefonie — renderowane w <body> (portal), nie w nagłówku: nagłówek
   po przewinięciu ma backdrop-filter, a wtedy position: fixed w jego środku
   liczy się względem nagłówka (76 px), nie ekranu. */
.mobile-menu { position: fixed; inset: 0; z-index: 200; }
.mm-bg { position: absolute; inset: 0; background: rgb(8 12 34 / 0.55); animation: sheet-fade .2s ease-out; }
.mobile-sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(340px, 88vw); background: var(--white); color: var(--navy);
  display: flex; flex-direction: column; box-shadow: var(--e2); overflow-y: auto; overscroll-behavior: contain;
  padding: 12px 20px calc(20px + env(safe-area-inset-bottom)); animation: mm-in .26s cubic-bezier(.2,.8,.2,1); }
.mm-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.mm-close { flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--navy); }
.mm-close:active { background: var(--light); }
.mm-links { display: flex; flex-direction: column; padding: 6px 0; }
.mm-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: var(--font-display); font-weight: 600; font-size: 20px; padding: 14px 4px; border-bottom: 1px solid var(--line); color: var(--navy); }
.mm-link svg { color: var(--ash); flex: none; }
.mm-link:hover, .mm-link:active { color: var(--flame); }
.mm-foot { margin-top: auto; padding-top: 20px; display: flex; flex-direction: column; gap: 12px; }
.mm-contact { display: inline-flex; align-items: center; gap: 10px; font-size: 15.5px; font-weight: 600; color: var(--ash-700); word-break: break-word; }
.mm-contact svg { flex: none; color: var(--flame); }
@keyframes mm-in { from { transform: translateX(100%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .mobile-sheet, .mm-bg { animation: none; } }

/* ===== HERO =====
   Jasne tło i prawdziwy towar zamiast granatowego „kosmosu": od pierwszego
   ekranu widać, co sprzedajemy (Langer i reszta chemii), co z tego ma klient
   i jaki jest następny krok. Katalog jest jeden — niżej; hero go nie dubluje. */
.hero { position: relative; overflow: hidden; padding: calc(var(--header-h) + 56px) 0 0;
  background: radial-gradient(1000px 520px at 88% -10%, var(--flame-tint), transparent 62%), var(--white); }
.hero-in { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: 32px 48px; align-items: center; }
.hero-copy { min-width: 0; }
.hero-h { font-size: clamp(32px, 3.7vw, 50px); line-height: 1.04; letter-spacing: -0.035em; margin: 16px 0 0; color: var(--navy); text-wrap: balance; }
.hero-h em { font-style: normal; color: var(--flame); }
.hero-lead { font-size: clamp(16.5px, 1.5vw, 19px); line-height: 1.55; color: var(--ash-700); max-width: 600px; margin: 18px 0 0; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }

/* Lista korzyści z „ptaszkami" — w hero i w kartach „Dla kogo" */
.ticks { list-style: none; padding: 0; margin: 22px 0 0; display: flex; flex-direction: column; gap: 12px; }
.ticks li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 16px; line-height: 1.45; color: var(--ash-700); }
.ticks li b { color: var(--navy); font-weight: 700; }
.tick { width: 24px; height: 24px; border-radius: 50%; background: var(--flame); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
.tick svg { stroke-width: 3px; }

/* Puszki Langera: środkowa z przodu, boczne lekko z tyłu i pod kątem */
.hero-vis { position: relative; min-width: 0; }
.hero-stage { --hv-gap: clamp(64px, 7vw, 100px); position: relative; height: clamp(340px, 36vw, 500px); }
.hero-stage::before { content: ''; position: absolute; left: 16%; right: 16%; bottom: 3%; height: 46px; border-radius: 50%;
  background: radial-gradient(closest-side, rgb(14 21 51 / 0.2), transparent); }
.hv { position: absolute; left: 50%; top: 50%; height: 88%; width: auto; pointer-events: none;
  transform: translate(-50%, -50%); filter: drop-shadow(0 18px 22px rgb(14 21 51 / 0.2)); z-index: 2; }
.hv-l { transform: translate(calc(-50% - var(--hv-gap)), -46%) scale(.86) rotate(-7deg); z-index: 1; }
.hv-r { transform: translate(calc(-50% + var(--hv-gap)), -46%) scale(.86) rotate(7deg); z-index: 1; }
.hv-tag { position: absolute; z-index: 3; display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: var(--r-md);
  background: var(--white); box-shadow: var(--e2); font-size: 12.5px; color: var(--ash-700); line-height: 1.25; max-width: 170px; }
.hv-tag b { font-family: var(--font-display); font-size: 22px; line-height: 1; color: var(--navy); letter-spacing: -.02em; }
.hv-tag-1 { left: 0; top: 4%; }
.hv-tag-2 { right: 0; bottom: 6%; }

/* Pasek zaufania pod hero: liczby z bazy/panelu i marki w ofercie */
.trust { margin-top: 44px; border-top: 1px solid var(--line); background: rgb(255 255 255 / 0.75); }
.trust-in { display: flex; align-items: center; justify-content: space-between; gap: 14px 40px; flex-wrap: wrap; padding-block: 18px; }
.trust-facts { display: flex; flex-wrap: wrap; gap: 8px 30px; }
.tf { display: inline-flex; align-items: baseline; gap: 7px; font-size: 14.5px; color: var(--ash-700); white-space: nowrap; }
.tf b { font-family: var(--font-display); font-size: 22px; letter-spacing: -.02em; color: var(--navy); }
.trust-brands { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
.trust-k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); font-weight: 600; }
.tb { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--ash-700); letter-spacing: -.01em; }
.tb-l { color: var(--flame); }

/* ===== DLA SKLEPÓW ===== */
.shop { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 36px 56px; align-items: center;
  padding: 56px; border-radius: var(--r-xl); background: var(--navy); color: #fff; }
.shop::before { content: ''; position: absolute; right: -160px; top: -180px; width: 480px; height: 480px; border-radius: 50%;
  background: radial-gradient(circle, rgb(240 78 35 / 0.32), transparent 65%); pointer-events: none; }
.shop > * { position: relative; min-width: 0; }
.shop .h-sec { color: #fff; margin-top: 18px; }
.shop-lead { color: rgb(255 255 255 / 0.72); font-size: 17.5px; line-height: 1.55; margin: 16px 0 0; max-width: 54ch; }
.shop-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.perks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-radius: var(--r-lg);
  background: rgb(255 255 255 / 0.05); border: 1px solid rgb(255 255 255 / 0.12); }
.perk { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 16px; align-items: center; padding: 20px 22px; }
.perk + .perk { border-top: 1px solid rgb(255 255 255 / 0.1); }
.perk-ic { width: 52px; height: 52px; border-radius: 14px; background: var(--flame); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
.perk b { display: block; font-family: var(--font-display); font-size: 21px; letter-spacing: -.02em; line-height: 1.15; }
.perk b + span { display: block; margin-top: 3px; font-size: 14.5px; color: rgb(255 255 255 / 0.65); line-height: 1.4; }
@media (max-width: 900px) { .shop { grid-template-columns: 1fr; padding: 40px 32px; } }
@media (max-width: 680px) {
  .shop { padding: 30px 20px; border-radius: var(--r-lg); }
  .perk { padding: 16px; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; }
  .perk-ic { width: 44px; height: 44px; border-radius: 12px; }
  .perk b { font-size: 18px; }
}

/* ===== SECTIONS ===== */
.sec { padding: 104px 0; }
.sec-head { max-width: 820px; margin-bottom: 48px; }
.sec-head .eyebrow { margin-bottom: 20px; }
.sec-dark { background: var(--navy); }
.sec-base { background: var(--light); }

.why-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.why-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 32px; transition: transform .2s, box-shadow .2s, border-color .2s; }
.why-card:hover { transform: translateY(-4px); box-shadow: var(--e2); border-color: transparent; }
.why-ic { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: var(--r-md); background: var(--flame-tint); color: var(--flame); margin-bottom: 20px; }
.why-t { font-size: 20px; margin-bottom: 10px; letter-spacing: -0.02em; }
.why-d { color: var(--ash-700); font-size: 15.5px; line-height: 1.55; }

.proc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.proc-step { position: relative; padding-top: 28px; border-top: 2px solid rgba(255,255,255,.16); }
.proc-step::before { content:''; position:absolute; top:-2px; left:0; width: 64px; height: 2px; background: var(--flame); }
.proc-n { font-family: var(--font-display); font-weight: 700; font-size: 40px; color: var(--flame); letter-spacing: -0.03em; line-height: 1; margin-bottom: 16px; }
.proc-t { color: #fff; font-size: 21px; margin-bottom: 10px; letter-spacing: -0.02em; }
.proc-d { color: rgba(255,255,255,.65); font-size: 15px; line-height: 1.55; }


/* ===== LANGER ===== */
.sec-langer { background: var(--white); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.lhead { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px 56px; align-items: end; margin-bottom: 36px; }
.lhead .h-sec { margin-top: 20px; }
.lhead .lead { margin: 0; max-width: 540px; }
.lfoot { display: flex; align-items: center; gap: 14px 24px; flex-wrap: wrap; margin-top: 28px; }
.lfoot:empty { display: none; }
.tlink { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15.5px; color: var(--flame); }
.tlink:hover { color: var(--flame-600); }

/* ===== KARUZELA LANGER =====
   Ten sam wygląd na stronie głównej i na /dla-punktow/ (kopia stylów i
   komponentu jest w obu plikach — zmieniając jeden, popraw drugi).
   Komputer: duży kadr + szczegóły + miniatury z nazwami.
   Telefon: przesuwane karty z kropkami i strzałkami. */
.lc-show { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--e1); }
.lc-media { position: relative; display: flex; align-items: center; justify-content: center; padding: 56px 76px; min-height: 520px;
  background: radial-gradient(58% 52% at 50% 46%, rgb(255 255 255 / 0.10), transparent 72%), var(--navy); }
.lc-photo { display: block; width: 100%; height: 400px; object-fit: contain; filter: drop-shadow(0 24px 30px rgb(0 0 0 / 0.42)); }
.lc-noimg { display: flex; align-items: center; justify-content: center; filter: none; color: rgb(255 255 255 / 0.45);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.lc-badge { position: absolute; top: 22px; left: 22px; z-index: 2; background: var(--flame); color: #fff; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; padding: 7px 12px; border-radius: var(--r-sm); }
.lc-count { position: absolute; bottom: 22px; left: 24px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; color: rgb(255 255 255 / 0.55); }
.lc-nav { position: absolute; top: 50%; z-index: 2; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; color: #fff; background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.2);
  transition: background .15s, border-color .15s; }
.lc-nav:hover { background: var(--flame); border-color: var(--flame); }
.lc-prev { left: 16px; } .lc-next { right: 16px; }
.lc-body { padding: 44px 48px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.lc-cat { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--ash); }
.lc-name { font-family: var(--font-display); font-size: clamp(30px, 3vw, 42px); font-weight: 700; letter-spacing: -.03em; line-height: 1.02; margin: 0; color: var(--navy); }
.lc-sub { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--flame); margin-top: 8px; }
.lc-desc { font-size: 16.5px; line-height: 1.55; color: var(--ash-700); margin: 0; max-width: 60ch; }
.lc-specs { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.lc-spec { background: var(--white); padding: 14px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.lc-spec-k { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
.lc-spec-v { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--navy); line-height: 1.15; overflow-wrap: anywhere; }
.lc-uses { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.lc-use { border: 1px solid var(--line-2); border-radius: var(--r-full); font-size: 13.5px; font-weight: 600; color: var(--navy); padding: 6px 12px; line-height: 1.3; }
.lc-acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 6px; }
.lc-thumbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; margin-top: 14px; }
.lc-thumb { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 8px 12px 8px 8px; border: 1.5px solid var(--line); border-radius: var(--r-md);
  background: var(--white); cursor: pointer; text-align: left; font: inherit; color: var(--navy); transition: border-color .15s, box-shadow .15s; }
.lc-thumb:hover { border-color: var(--line-2); }
.lc-thumb.on { border-color: var(--flame); box-shadow: 0 0 0 3px rgb(240 78 35 / 0.12); }
.lc-thumb-img { flex: none; display: block; width: 34px; height: 50px; object-fit: contain; }
.lc-thumb-img.lc-noimg { background: var(--light); border-radius: 4px; }
.lc-thumb-t { min-width: 0; font-size: 13px; font-weight: 700; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.lc-anim { animation: lc-in .35s ease both; }
@keyframes lc-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.lc-nav:focus-visible, .lc-thumb:focus-visible, .lc-dot:focus-visible, .lc-mnav:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
@media (max-width: 1080px) { .lc-specs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lc-media { padding: 48px 64px; } .lc-body { padding: 36px; } }

/* telefon: przesuwane karty */
.lc-track { display: grid; grid-auto-flow: column; grid-auto-columns: 84%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
  scroll-padding-inline: 20px; margin-inline: -20px; padding: 2px 20px 6px; scrollbar-width: none; overscroll-behavior-x: contain; }
.lc-track::-webkit-scrollbar { display: none; }
.lc-card { scroll-snap-align: start; display: flex; flex-direction: column; min-width: 0; background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.lc-card-media { position: relative; height: 260px; padding: 24px; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(60% 55% at 50% 46%, rgb(255 255 255 / 0.10), transparent 72%), var(--navy); }
.lc-card-media .lc-photo { height: 100%; }
.lc-card-media .lc-badge { top: 12px; left: 12px; font-size: 9.5px; padding: 6px 10px; }
.lc-card-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.lc-card-name { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin: 0; color: var(--navy); }
.lc-card .lc-sub { margin-top: 4px; font-size: 11.5px; }
.lc-card .lc-desc { font-size: 14.5px; line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.lc-card .lc-specs { grid-template-columns: 1fr 1fr; }
.lc-card .lc-spec { padding: 10px 12px; }
.lc-card .lc-spec-v { font-size: 16px; }
.lc-card .lc-uses { margin-top: 0; gap: 6px; }
.lc-card .lc-use { font-size: 12.5px; padding: 5px 10px; }
.lc-card .lc-acts { flex-direction: column; padding-top: 4px; }
.lc-card .lc-acts .btn { width: 100%; padding: 13px 16px; font-size: 15px; }
.lc-mbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.lc-dots { display: flex; flex-wrap: wrap; justify-content: center; min-width: 0; }
.lc-dot { width: 24px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.lc-dot::before { content: ''; width: 8px; height: 8px; border-radius: 4px; background: var(--line-2); transition: width .2s, background .2s; }
.lc-dot.on::before { width: 20px; background: var(--flame); }
.lc-mnav { flex: none; width: 42px; height: 42px; padding: 0; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--white); color: var(--navy);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.lc-mnav:disabled { opacity: .35; cursor: default; }
@media (prefers-reduced-motion: reduce) { .lc-anim { animation: none; } }

/* ===== CONTACT ===== */
/* ===== GDZIE DOWOZIMY =====
   Mapa obszaru dowozu (dane: shared/delivery-area.js). Ta sama sekcja jest na
   stronie głównej i na /dla-punktow/ — kopia stylów i komponentu w obu plikach. */
.dm-sec { background: var(--white); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.dm-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr); gap: 32px 40px; align-items: center; }
.dm-card { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); background: #F3F5F8; box-shadow: var(--e1); }
.dm-svg { display: block; width: 100%; height: auto; }
.dm-bg { fill: #F3F5F8; }
.dm-river { fill: #B9D1EA; }
.dm-ring { fill: none; stroke: var(--ash); stroke-opacity: .55; stroke-width: 1.5; stroke-dasharray: 6 7; }
.dm-ring-t { font: 600 15px var(--font-mono); fill: var(--ash); letter-spacing: .04em; }
.dm-area { fill: rgb(240 78 35 / 0.13); stroke: var(--flame); stroke-width: 3; stroke-linejoin: round; }
.dm-town circle { fill: var(--navy); stroke: #fff; stroke-width: 3; transition: fill .15s; }
.dm-town text, .dm-ref text, .dm-c-t { paint-order: stroke; stroke: #F3F5F8; stroke-linejoin: round; }
.dm-town text { font: 600 19px var(--font-text); fill: var(--navy); stroke-width: 5px; transition: fill .15s; }
.dm-town.on circle { fill: var(--flame); }
.dm-town.on text { fill: var(--flame-600); font-weight: 700; }
.dm-ref rect, .dm-ref circle { fill: var(--ash); }
.dm-ref text { font: 500 16px var(--font-text); fill: var(--ash-700); stroke-width: 5px; }
.dm-c { fill: var(--flame); stroke: #fff; stroke-width: 4; }
.dm-pulse { fill: var(--flame); transform-box: fill-box; transform-origin: center; animation: dm-pulse 2.4s ease-out infinite; }
@keyframes dm-pulse { from { transform: scale(1); opacity: .45; } to { transform: scale(3.4); opacity: 0; } }
.dm-c-t { font: 700 27px var(--font-display); fill: var(--navy); stroke-width: 6px; letter-spacing: -.01em; }
.dm-inset-bg { fill: #fff; stroke: var(--line); }
.dm-pl { fill: var(--light); stroke: var(--line-2); stroke-width: 1; }
.dm-inset-area { fill: var(--flame); opacity: .85; }
.dm-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.dm-k { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ash-700); }
.dm-towns { display: flex; flex-wrap: wrap; gap: 6px; }
.dm-chip { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: var(--r-full); border: 1.5px solid var(--line-2); background: var(--white);
  font: inherit; font-size: 14px; font-weight: 600; color: var(--navy); cursor: pointer; transition: border-color .12s, background .12s, color .12s; }
.dm-chip:hover, .dm-chip.on { border-color: var(--flame); color: var(--flame-600); }
.dm-chip.on { background: var(--flame-tint); }
.dm-chip:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
.dm-note { margin: 0; padding: 16px 18px; border-radius: var(--r-md); background: var(--paper); border: 1px solid var(--line); font-size: 15px; line-height: 1.5; color: var(--ash-700); }
.dm-note b { color: var(--navy); }
.dm-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ash-700); }
.dm-legend span { display: inline-flex; align-items: center; gap: 7px; }
.dm-legend i { display: inline-block; flex: none; }
.dm-li-area { width: 16px; height: 12px; border-radius: 3px; background: rgb(240 78 35 / 0.18); border: 2px solid var(--flame); }
.dm-li-base { width: 12px; height: 12px; border-radius: 50%; background: var(--flame); box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--flame); }
.dm-li-ring { width: 16px; height: 0; border-top: 2px dashed var(--ash); }
@media (max-width: 900px) { .dm-grid { grid-template-columns: 1fr; } }
/* Telefon: podpisy miast nachodziłyby na siebie — zostaje Płońsk, punkty
   orientacyjne i miasto wybrane na liście pod mapą. */
@media (max-width: 680px) {
  .dm-town text { display: none; }
  .dm-town.on text { display: block; font-size: 30px; stroke-width: 7px; }
  .dm-town circle { r: 9px; }
  .dm-c-t { font-size: 36px; }
  .dm-ref text { font-size: 24px; }
  .dm-ring-t { font-size: 22px; }
  .dm-chip { font-size: 13.5px; padding: 6px 11px; }
}
@media (prefers-reduced-motion: reduce) { .dm-pulse { animation: none; opacity: 0; } }

.dm-head { max-width: 760px; margin-bottom: 36px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.dm-h { font-family: var(--font-display); font-weight: 700; letter-spacing: -.03em; line-height: 1.06; margin: 0; font-size: clamp(28px, 3.4vw, 44px); color: var(--navy); text-wrap: balance; }
.dm-lead { margin: 0; font-size: 17.5px; line-height: 1.55; color: var(--ash-700); max-width: 62ch; }
.dm-side .btn { align-self: flex-start; }

.sec-contact { background: var(--white); border-top: 1px solid var(--line); }
.contact-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 72px; align-items: start; }
.form-row > * { min-width: 0; }
.contact-list { list-style: none; padding: 0; margin: 36px 0 0; display: flex; flex-direction: column; gap: 18px; }
.contact-list li { display: flex; align-items: center; gap: 16px; }
.ci { flex: none; width: 48px; height: 48px; border-radius: var(--r-md); background: var(--navy); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
.ci-k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
.ci-v { font-size: 17px; font-weight: 600; color: var(--navy); }
.form { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 32px; display: flex; flex-direction: column; gap: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ash-700); font-weight: 600; }
.field input, .field textarea { width: 100%; min-width: 0; font-family: var(--font-text); font-size: 16px; color: var(--navy); background: var(--white); border: 1.5px solid var(--line-2); border-radius: var(--r-sm); padding: 13px 15px; transition: border-color .15s, box-shadow .15s; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(14,21,51,.08); }
.field input::placeholder, .field textarea::placeholder { color: var(--ash); }
.form-note { font-size: 12.5px; color: var(--ash); text-align: center; margin: 4px 0 0; line-height: 1.5; }
.form-note b { color: var(--ash-700); }
.form-done { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 48px 32px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.form-done-ic { width: 64px; height: 64px; border-radius: 50%; background: var(--flame-tint); color: var(--flame); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.form-done-acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }
.who { display: flex; flex-wrap: wrap; gap: 8px; }
.who-o { display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: var(--r-full); border: 1.5px solid var(--line-2);
  background: var(--white); font-size: 14.5px; font-weight: 600; color: var(--ash-700); cursor: pointer; transition: border-color .12s, background .12s, color .12s; }
.who-o:hover { border-color: var(--navy); color: var(--navy); }
.who-o.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.contact-alt { margin-top: 28px; padding: 18px 20px; border-radius: var(--r-md); background: var(--flame-tint); color: var(--navy); font-size: 15px; line-height: 1.5; }
.contact-alt a { font-weight: 700; color: var(--flame-600); }

/* ===== FOOTER ===== */
.footer { background: var(--navy-900); color: #fff; padding: 72px 0 32px; }
.footer-in { display: grid; grid-template-columns: 1.3fr 2fr; gap: 56px; padding-bottom: 48px; border-bottom: 1px solid rgba(255,255,255,.12); }
.footer-tag { color: rgba(255,255,255,.6); font-size: 15px; max-width: 360px; margin-top: 20px; line-height: 1.6; }
.footer-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.footer-col { display: flex; flex-direction: column; gap: 11px; }
.footer-h { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--flame-glow); margin-bottom: 6px; }
.footer-col a, .footer-col span { color: rgba(255,255,255,.7); font-size: 15px; transition: color .12s; }
.footer-col a:hover { color: #fff; }
.footer-bottom { display: flex; justify-content: space-between; padding-top: 28px; color: rgba(255,255,255,.45); font-size: 13px; }

/* ===== CATALOG ===== */
/* Kategoria = nawigacja: zakładki, zawsze dokładnie jedna aktywna.
   Rodzaj i marka = filtry wewnątrz kategorii.
   Zaznaczenie to wypełnienie, najechanie to tylko ramka — nic nie podskakuje,
   więc najechanego nie da się pomylić z wybranym. */
/* Wiersz wyboru: etykieta (KATEGORIA / RODZAJ) + pigułki. Na komputerze
   etykieta po lewej, na telefonie nad pigułkami. */
.frow { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: baseline; gap: 16px; margin-bottom: 14px; }
.frow-k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ash-700); font-weight: 600; }
.frow .chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.ctabs { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.ctab { flex: none; display: inline-flex; align-items: center; gap: 9px; height: 44px; padding: 0 18px;
  border: 1.5px solid var(--line-2); border-radius: var(--r-full); background: var(--white); color: var(--navy);
  font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: -.01em; white-space: nowrap;
  transition: border-color .12s, background .12s, color .12s; }
.ctab:hover { border-color: var(--navy); }
.ctab.on { background: var(--navy); border-color: var(--navy); color: #fff; cursor: default; }
.ctab-n { font-size: 11.5px; color: var(--ash); font-weight: 500; }
.ctab.on .ctab-n { color: rgb(255 255 255 / 0.62); }
.ctab.zero:not(.on) { color: var(--ash-700); }
.ctab:focus-visible, .chip:focus-visible, .tbtn:focus-visible, .tback:focus-visible, .fchip:focus-visible, .fclear:focus-visible,
.sheet-x:focus-visible, .bmenu-ok:focus-visible, .bmenu-clear:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }

/* Pasek narzędzi: marka, wybrane marki, licznik, sortowanie */
.tools-sentinel { height: 1px; margin-bottom: -1px; }
.tools { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; padding-top: 16px;
  border-top: 1px solid var(--line-2); }
.tools-r { margin-left: auto; display: flex; align-items: center; gap: 20px; }
.res-count { font-size: 15px; color: var(--ash-700); font-weight: 600; white-space: nowrap; }
.res-count .num { color: var(--navy); font-size: 18px; }
.tbtn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; flex: none;
  border: 1.5px solid var(--line-2); border-radius: var(--r-sm); background: var(--white); color: var(--navy);
  font-size: 14.5px; font-weight: 700; transition: border-color .12s; }
.tbtn:hover, .tbtn.on, .tbtn[aria-expanded="true"] { border-color: var(--navy); }
.tbtn-n { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: var(--r-full); background: var(--flame); color: #fff; font-family: var(--font-mono); font-size: 11px; font-weight: 700; }

.bmenu { position: relative; }
.bmenu-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: 290px; padding: 6px;
  background: var(--white); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--e2); }
.bmenu-pop .olist { max-height: 340px; overflow-y: auto; }
.bmenu-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 4px 2px; margin-top: 4px;
  border-top: 1px solid var(--line); }
.bmenu-clear { font-size: 13.5px; font-weight: 600; color: var(--ash-700); padding: 7px 8px; border-radius: var(--r-sm); }
.bmenu-clear:hover:not(:disabled) { color: var(--navy); }
.bmenu-clear:disabled { opacity: .4; cursor: default; }
.bmenu-ok { font-size: 13.5px; font-weight: 700; color: #fff; background: var(--navy); border-radius: var(--r-sm); padding: 8px 16px; }
.bmenu-ok:hover { background: var(--navy-800); }

/* Wiersze opcji (pole wyboru / jednokrotny wybór) — wspólne dla menu i panelu */
.olist { display: flex; flex-direction: column; }
.orow { position: relative; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 8px 10px;
  border-radius: var(--r-sm); cursor: pointer; font-size: 15px; font-weight: 600; color: var(--navy); line-height: 1.25; }
.orow:hover { background: var(--light); }
.orow input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.orow-mark { flex: none; width: 21px; height: 21px; display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--line-2); border-radius: 50%; background: var(--white); color: #fff; transition: background .12s, border-color .12s; }
.orow.multi .orow-mark { border-radius: 5px; }
.orow-mark svg { opacity: 0; stroke-width: 3px; }
.orow.on .orow-mark { border-color: var(--navy); }
.orow.multi.on .orow-mark { background: var(--navy); }
.orow.multi.on .orow-mark svg { opacity: 1; }
.orow:not(.multi).on .orow-mark::after { content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--navy); }
.orow input:focus-visible + .orow-mark { outline: 2px solid var(--flame); outline-offset: 2px; }
.orow-t { flex: 1; min-width: 0; }
.orow-n { flex: none; font-size: 12px; color: var(--ash); }
.orow.off { opacity: .4; cursor: default; }
.orow.off:hover { background: none; }

/* Wybrane filtry jako chipy z ✕ */
.applied { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 14px; flex: none;
  border-radius: var(--r-full); background: var(--cobalt-tint); color: var(--navy); font-size: 14px; font-weight: 600; }
.fchip svg { opacity: .55; }
.fchip:hover { background: #D7DDF4; }
.fchip:hover svg { opacity: 1; }
.fclear { font-size: 14px; font-weight: 600; color: var(--flame-600); padding: 6px 6px; }
.fclear:hover { text-decoration: underline; }

/* Panel filtrów (telefon) — od dołu, na całą szerokość */
.sheet-wrap { position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-bg { position: absolute; inset: 0; background: rgb(8 12 34 / 0.5); animation: sheet-fade .2s ease-out; }
.sheet { position: relative; display: flex; flex-direction: column; max-height: 86vh; max-height: 86dvh;
  background: var(--white); border-radius: 18px 18px 0 0; box-shadow: 0 -12px 40px -12px rgb(8 12 34 / 0.4);
  animation: sheet-up .26s cubic-bezier(.2,.8,.2,1); }

   Dzięki temu wybór jednego koloru w panelu daje komplet: hover, wciśnięcie
   i jasne tło ikon — bez ręcznego dobierania czterech hexów. */
function shade(hex, t) {
  const m = /^#?([\da-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  const mix = (c) => Math.round(t >= 0 ? c + (255 - c) * t : c * (1 + t));

  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      panel.style.right = offsetRef.current.x + 'px';
      panel.style.bottom = offsetRef.current.y + 'px';
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) {
  return <div className="twk-sect">{label}</div>;
}

function TweakRow({ label, children }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      {children}
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row" style={{ flexDirection:'row', alignItems:'center', justifyContent:'space-between', gap:10 }}>
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const idx = Math.max(0, options.indexOf(value));
  const n = options.length;
  return (
    <TweakRow label={label}>
      <div role="radiogroup" className="twk-seg">
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {options.map((o) => (
          <button key={o} type="button" role="radio" aria-checked={o === value} onClick={() => onChange(o)}>{o}</button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakColor({ label, value, options, onChange }) {
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">

          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" data-on={on ? '1' : '0'}

          );
        })}
      </div>
    </TweakRow>
  );
}

/* Menu na telefonie — panel z prawej na całą wysokość ekranu. Przewijanie
   strony pod spodem jest zablokowane; zamyka ✕, tapnięcie w tło, Esc albo
   wybór linku. */
function MobileMenu({ links, onClose }) {
  const closeRef = useRef(null);
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    if (closeRef.current) closeRef.current.focus();
    return () => { document.body.style.overflow = prev; document.removeEventListener('keydown', onKey); };
  }, []);
  return (
    <div className="mobile-menu" role="dialog" aria-modal="true" aria-label="Menu">
      <div className="mm-bg" onClick={onClose} />
      <nav className="mobile-sheet">
        <div className="mm-head">

   Pierwszy ekran odpowiada na trzy pytania: co tu jest (chemia budowlana,

   wezwanie). Do katalogu prowadzi nawigacja i dalsza część strony — hero nie
   dubluje go własnym paskiem kategorii. */
const LANGER_IMG = (name) => `dla-punktow/assets/${name}.webp`;

/* Odmiana: 1 marka, 2–4 marki, 5+ marek. Wartość nieliczbowa (np. „400+")
   dostaje formę „wielu". */
function plural(n, one, few, many) {
  const num = Number(String(n).replace(/\s/g, ''));
  if (!Number.isInteger(num)) return many;
  if (num === 1) return one;
  const t = num % 10, h = num % 100;
  return (t >= 2 && t <= 4 && !(h >= 12 && h <= 14)) ? few : many;
}

/* Pasek zaufania pod hero. Produkty, kategorie i marki liczymy z bazy (panel
   może nadpisać), czas realizacji i liczbę punktów bierzemy z panelu
   (Ustawienia → „Liczby w hero"). Pusta wartość = fakt się nie pokazuje. */
function TrustBar({ products = [] }) {
  const catCount = CATEGORIES.filter(c => products.some(p => p.category === c.id)).length;
  const nProd = String(SITE.stat_products || (products.length ? products.length : '')).trim();
  const nBrands = String(SITE.stat_brands || (BRANDS.length ? BRANDS.length : '')).trim();
  const points = String(SITE.stat_points || '').trim();
  const facts = [
    [nProd, plural(nProd, 'produkt', 'produkty', 'produktów') + ' w katalogu'],
    [catCount ? String(catCount) : '', plural(catCount, 'kategoria', 'kategorie', 'kategorii')],
    [nBrands, plural(nBrands, 'marka', 'marki', 'marek')],
    [String(SITE.stat_delivery || '').trim(), 'średni czas realizacji'],
    [points, plural(points, 'zaopatrywany punkt', 'zaopatrywane punkty', 'zaopatrywanych punktów')],
  ].filter(([n]) => n);
  const brands = [...BRANDS].sort((a, b) => isLangerName(b) - isLangerName(a));

  if (!facts.length && !brands.length) return null;
  return (
    <div className="trust">
      <div className="wrap trust-in">
        {facts.length > 0 && (
          <div className="trust-facts">
            {facts.map(([n, l]) => <span className="tf" key={l}><b>{n}</b>{l}</span>)}

        {brands.length > 0 && (

          </div>
        )}
      </div>
    </div>
  );
}

/* ===== ZDJĘCIA PRODUKTÓW: JEDNA WIELKOŚĆ =====
   Wiele zdjęć ma szerokie, puste marginesy (przezroczyste albo jednolite
   tło), przez co produkt wygląda na mniejszy od sąsiada. Po wczytaniu
   liczymy na małej kopii, gdzie naprawdę jest produkt, i pokazujemy tylko
   ten fragment — SVG z viewBox skaluje go jak object-fit: contain, więc
   każdy produkt wypełnia kadr tak samo. Zdjęcie z obcej domeny bez CORS
   (canvas go nie odczyta) zostaje pokazane tak, jak jest. */
function contentBox(img) {
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !nh) return null;
  const k = Math.min(1, 160 / Math.max(nw, nh));
  const w = Math.max(1, Math.round(nw * k)), h = Math.max(1, Math.round(nh * k));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;       // rzuca błąd przy braku CORS
  const at = (x, y) => (y * w + x) * 4;
  // Tło: kolor nieprzezroczystych rogów. Przezroczyste rogi = tło przezroczyste.
  let r = 0, g = 0, b = 0, n = 0;
  for (const i of [at(0, 0), at(w - 1, 0), at(0, h - 1), at(w - 1, h - 1)]) {
    if (d[i + 3] > 200) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  }
  const solid = n >= 3;
  if (solid) { r /= n; g /= n; b /= n; }
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = at(x, y);
    if (d[i + 3] < 24) continue;
    if (solid && Math.abs(d[i] - r) + Math.abs(d[i + 1] - g) + Math.abs(d[i + 2] - b) < 40) continue;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) return null;
  const bx = x0 / k, by = y0 / k, bw = (x1 - x0 + 1) / k, bh = (y1 - y0 + 1) / k;
  if (bw > nw * 0.94 && bh > nh * 0.94) return null;  // produkt już wypełnia kadr
  const pad = Math.max(bw, bh) * 0.03;
  return { nw, nh, x: bx - pad, y: by - pad, w: bw + 2 * pad, h: bh + 2 * pad, bg: solid ? `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})` : null };
}

const sameOrigin = (src) => { try { return new URL(src, location.href).origin === location.origin; } catch (e) { return false; } };

/* Zdjęcie przycięte do produktu. onBg dostaje kolor tła zdjęcia (albo null),
   żeby kafel mógł się do niego dopasować. */
function FitImage({ src, alt = '', className = '', onBg, lazy = true, fallback }) {
  const [cors, setCors] = useState(true);
  const [box, setBox] = useState(null);
  const [failed, setFailed] = useState(false);
  useEffect(() => { setBox(null); setFailed(false); setCors(true); }, [src]);

  if (!src || failed) {
    if (fallback !== undefined) return fallback;
    return <span className={className + ' lc-noimg'} role="img" aria-label={alt}>{className.includes('thumb') ? '' : 'Zdjęcie wkrótce'}</span>;
  }
  if (box) return (
    <svg className={className} viewBox={`${box.x} ${box.y} ${box.w} ${box.h}`} preserveAspectRatio="xMidYMid meet" role="img" aria-label={alt}>
      <image href={src} width={box.nw} height={box.nh} />
    </svg>
  );
  return (
    <img key={cors ? 'c' : 'p'} src={src} alt={alt} className={className} decoding="async" loading={lazy ? 'lazy' : undefined}
      crossOrigin={cors ? 'anonymous' : undefined}
      onLoad={e => {
        try { const bx = contentBox(e.target); if (onBg) onBg(bx ? bx.bg : null); if (bx) setBox(bx); }
        catch (err) { if (onBg) onBg(null); }
      }}
      onError={() => { if (cors && !sameOrigin(src)) setCors(false); else setFailed(true); }} />
  );
}

/* ===== KARUZELA LANGER ===== */
/* Slajdy: lista z panelu (Karuzela Langer) albo domyślna z
   shared/langer-showcase.js. Brakujące pola uzupełnia produkt z bazy. */
function showcaseSlides(value, products = []) {
  const S = window.LangerShowcase;
  if (!S) return [];
  return S.items(value).map((it, i) => {
    const prod = S.findProduct(it, products);
    const sku = String(it.sku || (prod && prod.sku) || '');
    return {
      key: (sku || it.name || 'slajd') + ':' + i,
      sku,
      name: it.name || (prod && prod.name) || '',
      sub: it.sub || (prod && prod.variant) || '',
      cat: it.cat || '',
      badge: it.badge || '',
      desc: it.desc || '',
      specs: (it.specs || []).filter(s => s && (s.k || s.v)).slice(0, 4),
      uses: (it.uses || []).map(u => String(u).trim()).filter(Boolean),
      img: it.img || (prod ? (prod.image || prod.image_url || '') : (sku ? '/api/img?sku=' + encodeURIComponent(sku) : '')),
    };
  }).filter(s => s.name);
}

const pad2 = (x) => String(x).padStart(2, '0');

function LcSpecs({ specs }) {

function LcUses({ uses, label = true }) {

  return (

/* Komputer: duży kadr, szczegóły, miniatury z nazwami. Strzałki klawiatury
   przełączają produkty, gdy fokus jest w karuzeli. */
function LcShowcase({ slides, cta }) {
  const [i, setI] = useState(0);
  const n = slides.length;
  const k = Math.min(i, n - 1);
  const cur = slides[k];
  const go = (d) => setI(v => (Math.min(v, n - 1) + d + n) % n);
  const onKey = (e) => {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  };
  return (
    <div className="lc" onKeyDown={onKey}>
      <div className="lc-show">
        <div className="lc-media">
          <FitImage key={'m' + cur.key} src={cur.img} alt={cur.name} className="lc-photo lc-anim" lazy={false} />
          {cur.badge && <span className="lc-badge">{cur.badge}</span>}
          <span className="lc-count">{pad2(k + 1)} / {pad2(n)}</span>
          {n > 1 && (
            <>
              <button type="button" className="lc-nav lc-prev" onClick={() => go(-1)} aria-label="Poprzedni produkt"><IArrow s={20} style={{ transform: 'rotate(180deg)' }} /></button>
              <button type="button" className="lc-nav lc-next" onClick={() => go(1)} aria-label="Następny produkt"><IArrow s={20} /></button>
            </>
          )}
        </div>
        <div className="lc-body lc-anim" key={'b' + cur.key} aria-live="polite">
          {cur.cat && <span className="lc-cat">{cur.cat}</span>}
          <div>
            <h3 className="lc-name">{cur.name}</h3>
            {cur.sub && <div className="lc-sub">{cur.sub}</div>}
          </div>
          {cur.desc && <p className="lc-desc">{cur.desc}</p>}
          <LcSpecs specs={cur.specs} />
          <LcUses uses={cur.uses} />
          <div className="lc-acts">{cta(cur)}</div>
        </div>
      </div>
      {n > 1 && (
        <div className="lc-thumbs" role="tablist" aria-label="Produkty w karuzeli">
          {slides.map((s, j) => (
            <button key={s.key} type="button" role="tab" aria-selected={j === k}
                    className={'lc-thumb' + (j === k ? ' on' : '')} onClick={() => setI(j)}>
              <FitImage src={s.img} alt="" className="lc-thumb-img" />
              <span className="lc-thumb-t">{s.name}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* Telefon: przesuwane kciukiem karty. Kropki i strzałki pokazują, gdzie
   jesteś i ile jest jeszcze produktów. */
function LcScroller({ slides, cta }) {
  const ref = useRef(null);
  const [i, setI] = useState(0);
  const n = slides.length;
  useEffect(() => {
    const t = ref.current;
    if (!t) return;
    let raf = 0;
    const on = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const first = t.firstElementChild;
        if (!first) return;
        const step = first.getBoundingClientRect().width + 12;
        const atEnd = t.scrollLeft + t.clientWidth >= t.scrollWidth - 4;
        setI(atEnd ? n - 1 : Math.max(0, Math.min(n - 1, Math.round(t.scrollLeft / step))));
      });
    };
    t.addEventListener('scroll', on, { passive: true });
    return () => { t.removeEventListener('scroll', on); cancelAnimationFrame(raf); };
  }, [n]);
  const go = (j) => {
    const t = ref.current;
    const card = t && t.children[Math.max(0, Math.min(n - 1, j))];
    if (card) t.scrollTo({ left: card.offsetLeft - t.firstElementChild.offsetLeft, behavior: 'smooth' });
  };
  return (
    <div className="lc">
      <div className="lc-track" ref={ref} aria-label="Produkty w karuzeli">
        {slides.map(s => (
          <article className="lc-card" key={s.key}>
            <div className="lc-card-media">
              <FitImage src={s.img} alt={s.name} className="lc-photo" />
              {s.badge && <span className="lc-badge">{s.badge}</span>}
            </div>
            <div className="lc-card-body">
              {s.cat && <span className="lc-cat">{s.cat}</span>}
              <div>
                <h3 className="lc-card-name">{s.name}</h3>
                {s.sub && <div className="lc-sub">{s.sub}</div>}
              </div>
              {s.desc && <p className="lc-desc">{s.desc}</p>}
              <LcSpecs specs={s.specs} />
              <LcUses uses={s.uses} label={false} />
              <div className="lc-acts">{cta(s)}</div>
            </div>
          </article>
        ))}
      </div>
      {n > 1 && (
        <div className="lc-mbar">
          <button type="button" className="lc-mnav" onClick={() => go(i - 1)} disabled={i === 0} aria-label="Poprzedni produkt"><IArrow s={18} style={{ transform: 'rotate(180deg)' }} /></button>
          <div className="lc-dots">
            {slides.map((s, j) => (
              <button key={s.key} type="button" className={'lc-dot' + (j === i ? ' on' : '')} onClick={() => go(j)}
                      aria-label={`${s.name} (${j + 1} z ${n})`} aria-current={j === i ? 'true' : undefined} />
            ))}
          </div>
          <button type="button" className="lc-mnav" onClick={() => go(i + 1)} disabled={i === n - 1} aria-label="Następny produkt"><IArrow s={18} /></button>
        </div>
      )}
    </div>
  );
}

function LangerCarousel({ slides, cta }) {
  const narrow = useNarrow('(max-width: 860px)');
  if (!slides.length) return null;
  return narrow ? <LcScroller slides={slides} cta={cta} /> : <LcShowcase slides={slides} cta={cta} />;

/* ===== GDZIE DOWOZIMY =====
   Mapa obszaru dowozu z Płońska. Miasta, kolejność obwodu i punkty
   orientacyjne: shared/delivery-area.js. Ta sama sekcja jest na stronie
   głównej i na /dla-punktow/ (kopia komponentu w obu plikach). */
function DeliveryMap({ hl, onPick }) {
  const D = window.LangerDelivery;
  const geo = useMemo(() => {
    if (!D) return null;
    const towns = D.TOWNS.map(t => ({ ...t, xy: D.project(t.lat, t.lon) }));
    return {
      towns,
      area: D.smooth(towns.map(t => t.xy)),
      c: D.project(D.CENTER.lat, D.CENTER.lon),
      refs: D.REF.map(r => ({ ...r, xy: D.project(r.lat, r.lon) })),
      inArea: D.smooth(D.TOWNS.map(t => D.projectInset(t.lat, t.lon))),
      inC: D.projectInset(D.CENTER.lat, D.CENTER.lon),
    };
  }, []);
  if (!geo) return null;
  const V = D.VIEW, I = D.INSET, c = geo.c, R = 100 * D.kmUnits;
  const lab = (pos, [x, y], gap = 12) => (
    pos === 'l' ? { x: x - gap, y: y + 6, a: 'end' } :
    pos === 't' ? { x, y: y - gap - 4, a: 'middle' } :
    pos === 'b' ? { x, y: y + gap + 18, a: 'middle' } :
                  { x: x + gap, y: y + 6, a: 'start' });
  const ringLab = [c[0] - R * Math.cos(0.35) , c[1] + R * Math.sin(0.35) + 26];
  return (
    <svg className="dm-svg" viewBox={(V.crop || [0, 0, V.w, V.h]).join(' ')} role="img"
         aria-label={`Mapa obszaru dowozu z ${D.CENTER.name}: ${D.TOWNS.map(t => t.name).join(', ')}`}>
      <rect className="dm-bg" width={V.w} height={V.h} />
      <path className="dm-river" d={D.RIVERS} />
      <circle className="dm-ring" cx={c[0]} cy={c[1]} r={R} />
      <text className="dm-ring-t" x={ringLab[0]} y={ringLab[1]} textAnchor="middle">100 km</text>
      <path className="dm-area" d={geo.area} />
      {geo.refs.map(r => {
        const L = lab(r.label, r.xy, 10);
        return (
          <g key={r.name} className="dm-ref">
            <rect x={r.xy[0] - 5} y={r.xy[1] - 5} width="10" height="10" rx="2" />
            <text x={L.x} y={L.y} textAnchor={L.a}>{r.name}</text>
          </g>
        );
      })}
      {geo.towns.map(t => {
        const L = lab(t.label, t.xy);
        const on = hl === t.name;
        return (
          <g key={t.name} className={'dm-town' + (on ? ' on' : '')} onMouseEnter={() => onPick(t.name)} onMouseLeave={() => onPick(null)}>
            <circle cx={t.xy[0]} cy={t.xy[1]} r={on ? 10 : 7} />
            <text x={L.x} y={L.y} textAnchor={L.a}>{t.name}</text>
          </g>
        );
      })}
      <circle className="dm-pulse" cx={c[0]} cy={c[1]} r="13" />

/* Czy jesteśmy na wąskim ekranie (telefon). Tam filtry siedzą w panelu
   wysuwanym od dołu, a zakładki kategorii przewijają się w poziomie. */
function useNarrow(query = '(max-width: 680px)') {
  const [narrow, setNarrow] = useState(() => window.matchMedia(query).matches);
  useEffect(() => {
    const mq = window.matchMedia(query);
    const on = () => setNarrow(mq.matches);
    on();
    if (mq.addEventListener) { mq.addEventListener('change', on); return () => mq.removeEventListener('change', on); }
    mq.addListener(on); return () => mq.removeListener(on);
  }, [query]);
  return narrow;
}

/* Ile kart pokazujemy naraz — reszta dochodzi przyciskiem. Na telefonie
   renderowanie 300 kafli naraz potrafi zatkać przewijanie. */
const PAGE = 24;

/* Odmiana rzeczownika po liczbie: 1 produkt, 2–4 produkty, 5+ produktów. */
function plProducts(n) {
  if (n === 1) return 'produkt';
  const t = n % 10, h = n % 100;
  return (t >= 2 && t <= 4 && !(h >= 12 && h <= 14)) ? 'produkty' : 'produktów';
}

/* „Soudal", „Soudal i Tytan", „Soudal, Tytan i Penosil" */
const joinPl = (arr) => arr.length < 2 ? arr.join('') : arr.slice(0, -1).join(', ') + ' i ' + arr[arr.length - 1];

const subKey = (p) => String(p.subcategory || '').trim().toLowerCase();
const brandKey = (p) => String(p.brand || '').trim().toLowerCase();
/* Langer jest zawsze na początku: w wynikach katalogu (przy każdym
   sortowaniu), na liście marek i w wyszukiwaniu. */
const isLanger = (p) => brandKey(p) === 'langer';
const langerFirst = (a, b) => (isLanger(b) ? 1 : 0) - (isLanger(a) ? 1 : 0);
const sameList = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

/* STAN KATALOGU W ADRESIE STRONY
   ?kat=kleje&pod=kleje montażowe&marka=soudal&marka=den braven
   Odświeżenie niczego nie gubi, a handlowiec może wysłać klientowi link do
   „silikonów Soudal". Inne parametry (np. ?fresh z panelu) zostają nietknięte. */
function readFilterUrl() {
  const p = new URLSearchParams(location.search);
  const cat = (p.get('kat') || '').trim();
  const sub = (p.get('pod') || '').trim().toLowerCase();
  return {
    cat: cat || 'all',
    sub: cat && sub ? sub : 'all',
    brands: [...new Set(p.getAll('marka').map(s => s.trim().toLowerCase()).filter(Boolean))],
  };
}
function filterUrl({ cat, sub, brands }) {
  const p = new URLSearchParams(location.search);
  ['kat', 'pod', 'marka'].forEach(k => p.delete(k));
  if (cat !== 'all') p.set('kat', cat);
  if (cat !== 'all' && sub !== 'all') p.set('pod', sub);
  brands.forEach(b => p.append('marka', b));
  const qs = p.toString();
  return location.pathname + (qs ? '?' + qs : '') + location.hash;
}
function writeHistory(mode, state) {
  try { history[mode]({ langer: state }, '', filterUrl(state)); } catch (e) { /* np. strona z dysku */ }
}

/* KATEGORIE — pigułki, zawsze dokładnie jedna aktywna („Wszystkie" też jest
   pigułką), klik w aktywną nic nie robi. Zawijają się do kolejnych linii także
   na telefonie: nic nie chowa się poza krawędzią ekranu, bo poziomo przewijany
   pasek wygląda jak skończona lista i nikt go nie przesuwa. */
function CatTabs({ tabs, active, onPick }) {

        return (

            <span className="ctab-t">{t.label}</span>
