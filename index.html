<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Langer Dystrybucja — hurtowa dystrybucja chemii budowlanej</title>
  <link rel="icon" href="/api/favicon" />
  <link rel="apple-touch-icon" href="/api/favicon" />
  <meta name="description" content="Hurtowa dystrybucja chemii budowlanej: piany montażowe, silikony, akryle, kleje i akcesoria dla sklepów, hurtowni i ekip wykonawczych." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script>
  /* Dane z API pobieramy od razu, równolegle z ładowaniem Reacta i fontów.
     Wcześniej szły jedna runda po drugiej: najpierw skrypty, potem ustawienia,
     dopiero po wyświetleniu strony produkty. Błąd albo brak API (strona
     otwarta z dysku) = null, a aplikacja zostaje przy wartościach domyślnych.
     ?fresh w adresie strony (link „Zobacz stronę" z panelu) omija cache CDN,
     żeby zmiany zapisane przed chwilą były widać od razu. */
  window.__BOOT = (function () {
    var q = /[?&]fresh\b/.test(location.search) ? '?fresh=1' : '';
    function get(path) {
      return fetch(path + q)
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    }
    return {
      categories: get('/api/categories'),
      brands:     get('/api/brands'),
      settings:   get('/api/settings'),
      products:   get('/api/products'),
    };
  })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
/* ===== BRAND TOKENS ===== */
:root {
  --flame:        #F04E23;
  --flame-600:    #D63F18;
  --flame-700:    #B63411;
  --flame-tint:   #FBE7DF;
  --flame-glow:   #FF6A3D;
  --cobalt:       #1E3FB5;
  --cobalt-600:   #182F95;
  --cobalt-tint:  #E5E9F8;
  --navy:         #0E1533;
  --navy-800:     #161E45;
  --navy-700:     #232C5E;
  --navy-900:     #080C22;
  --ash:          #8B9199;
  --ash-700:      #565D67;
  --light:        #EEF0F3;
  --paper:        #F6F7F9;
  --white:        #FFFFFF;
  --line:         #E2E5EA;
  --line-2:       #CFD4DC;
  --font-display: 'Space Grotesk', 'Hanken Grotesk', system-ui, sans-serif;
  --font-text:    'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, Menlo, monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px; --s10:128px;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px; --r-full:999px;
  --e1: 0 1px 2px rgb(14 21 51 / 0.06), 0 1px 1px rgb(14 21 51 / 0.04);
  --e2: 0 18px 48px -16px rgb(14 21 51 / 0.22), 0 6px 16px -8px rgb(14 21 51 / 0.10);
  --e-flame: 0 16px 40px -12px rgb(240 78 35 / 0.45);
  --max: 1240px;
  --header-h: 76px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 16px); }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--navy);
  font-family: var(--font-text);
  font-size: 17px;
  line-height: 1.6;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
img { max-width: 100%; display: block; }

/* Ekran startowy — widać go, zanim React narysuje stronę (zamiast białej
   kartki). Granat jak hero, więc przejście w gotową stronę jest płynne. */
.boot { min-height: 100vh; background: var(--navy); position: relative; overflow: hidden; }
.boot::before { content: ''; position: absolute; top: 0; left: 0; height: 3px; width: 40%;
  background: var(--flame); animation: boot-bar 1.1s ease-in-out infinite; }
@keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .boot::before { animation: none; width: 100%; opacity: .5; } }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
::selection { background: var(--flame); color: #fff; }

.wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding-inline: 32px; }
@media (max-width: 760px){ .wrap { padding-inline: 20px; } }

.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--flame);
  display: inline-flex; align-items: center; gap: 10px;
}
.eyebrow::before { content:''; width: 22px; height: 2px; background: var(--flame); display:inline-block; }
.eyebrow.on-dark { color: var(--flame-glow); }

h1,h2,h3,h4 { font-family: var(--font-display); margin: 0; line-height: 1.02; letter-spacing: -0.03em; font-weight: 700; }
.display { font-size: clamp(44px, 7vw, 92px); line-height: 0.94; letter-spacing: -0.04em; }
.h-sec   { font-size: clamp(32px, 4.4vw, 56px); letter-spacing: -0.035em; }
.lead { font-size: clamp(17px, 2vw, 21px); line-height: 1.55; color: var(--ash-700); font-weight: 400; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:10px;
  font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing:-0.01em;
  padding: 15px 26px; border-radius: var(--r-sm); transition: transform .12s, background .15s, box-shadow .15s, color .15s;
  white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn-flame { background: var(--flame); color:#fff; box-shadow: var(--e-flame); }
.btn-flame:hover { background: var(--flame-600); transform: translateY(-2px); }
.btn-flame:active { background: var(--flame-700); transform: translateY(0); }
.btn-dark { background: var(--navy); color:#fff; }
.btn-dark:hover { background: var(--navy-800); transform: translateY(-2px); }
.btn-ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--line-2); }
.btn-ghost:hover { border-color: var(--navy); background: var(--white); }
.btn-ghost.on-dark { color:#fff; border-color: rgb(255 255 255 / 0.28); }
.btn-ghost.on-dark:hover { border-color:#fff; background: rgb(255 255 255 / 0.08); }

.chip { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600;
  padding: 7px 14px; border-radius: var(--r-full); border:1px solid var(--line-2); color: var(--ash-700);
  background: var(--white); transition: all .12s; cursor:pointer; }
.chip:hover { border-color: var(--navy); color: var(--navy); }
.chip.active { background: var(--navy); color:#fff; border-color: var(--navy); }
.chip-n { font-family: var(--font-mono); font-size: 11px; opacity: .55; }

.reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s cubic-bezier(.2,0,0,1), transform .7s cubic-bezier(.2,0,0,1); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce){ .reveal { opacity:1; transform:none; transition:none; } html{scroll-behavior:auto;} }

/* ===== HEADER ===== */
.hdr { position: fixed; inset: 0 0 auto 0; height: var(--header-h); z-index: 100;
  display: flex; align-items: center; transition: background .25s, box-shadow .25s, border-color .25s;
  border-bottom: 1px solid transparent; }
.hdr-solid { background: rgba(246,247,249,.86); backdrop-filter: blur(12px); border-bottom-color: var(--line); }
.hdr-in { display: flex; align-items: center; gap: 24px; width: 100%; }
.logo { display: inline-flex; align-items: center; gap: 12px; }
.logo-words { display: flex; flex-direction: column; line-height: 1; }
.logo-name { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -0.02em; }
.logo-sub { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.28em; margin-top: 3px; }
.hdr-nav { display: flex; gap: 4px; margin-left: auto; }
.hdr-link { font-weight: 600; font-size: 15px; padding: 9px 14px; border-radius: var(--r-sm); color: inherit; transition: background .12s, color .12s; }
.hdr:not(.hdr-solid) .hdr-link { color: #fff; }
.hdr:not(.hdr-solid) .logo { color: #fff !important; }
.hdr-link:hover { color: var(--flame); }
.hdr-cta { display: flex; }
.hdr-burger { display: none; color: inherit; padding: 6px; }
.hdr:not(.hdr-solid) .hdr-burger { color: #fff; }
/* Menu na telefonie — renderowane w <body> (portal), nie w nagłówku: nagłówek
   po przewinięciu ma backdrop-filter, a wtedy position: fixed w jego środku
   liczy się względem nagłówka (76 px), nie ekranu. */
.mobile-menu { position: fixed; inset: 0; z-index: 200; }
.mm-bg { position: absolute; inset: 0; background: rgb(8 12 34 / 0.55); animation: sheet-fade .2s ease-out; }
.mobile-sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(340px, 88vw); background: var(--white); color: var(--navy);
  display: flex; flex-direction: column; box-shadow: var(--e2); overflow-y: auto; overscroll-behavior: contain;
  padding: 12px 20px calc(20px + env(safe-area-inset-bottom)); animation: mm-in .26s cubic-bezier(.2,.8,.2,1); }
.mm-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.mm-close { flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--navy); }
.mm-close:active { background: var(--light); }
.mm-links { display: flex; flex-direction: column; padding: 6px 0; }
.mm-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: var(--font-display); font-weight: 600; font-size: 20px; padding: 14px 4px; border-bottom: 1px solid var(--line); color: var(--navy); }
.mm-link svg { color: var(--ash); flex: none; }
.mm-link:hover, .mm-link:active { color: var(--flame); }
.mm-foot { margin-top: auto; padding-top: 20px; display: flex; flex-direction: column; gap: 12px; }
.mm-contact { display: inline-flex; align-items: center; gap: 10px; font-size: 15.5px; font-weight: 600; color: var(--ash-700); word-break: break-word; }
.mm-contact svg { flex: none; color: var(--flame); }
@keyframes mm-in { from { transform: translateX(100%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .mobile-sheet, .mm-bg { animation: none; } }

/* ===== HERO (kompaktowy) =====
   Zamiast pełnoekranowego plakatu: jedno zdanie o tym, co sprzedajemy, twarde
   liczby z bazy i pasek kategorii — żeby od pierwszego ekranu było wiadomo,
   po co tu jesteś, i dało się jednym kliknięciem wejść w katalog. */
.hero { position: relative; overflow: hidden; }
.hero-navy { background: var(--navy); padding: calc(var(--header-h) + 44px) 0 44px; }
.hero-navy-in { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 20px 48px; align-items: center; }
.hero-copy { min-width: 0; }
.hero-h { color: #fff; font-size: clamp(31px, 3.9vw, 48px); line-height: 1.05; letter-spacing: -0.035em; max-width: 21ch; margin: 14px 0 0; }
.hero-lead { font-size: clamp(16px, 1.5vw, 19px); line-height: 1.5; color: rgb(255 255 255 / 0.72); max-width: 620px; margin: 14px 0 0; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }

/* Liczby jako panel po prawej — wypełniają kolumnę, której nagłówek nie potrzebuje,
   i od razu mówią, jaka jest skala oferty. */
.hero-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px;
  padding: 24px 26px; border-radius: var(--r-lg);
  background: rgb(255 255 255 / 0.05); border: 1px solid rgb(255 255 255 / 0.1); }
.hero-fact b { display: block; font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 2.4vw, 32px);
  line-height: 1; letter-spacing: -.03em; color: #fff; }
.hero-fact span { display: block; margin-top: 6px; font-size: 12.5px; line-height: 1.35; color: rgb(255 255 255 / 0.55); }

/* Pasek kategorii w hero — przewijalny w poziomie na telefonie */
.hero-cats-wrap { position: relative; z-index: 2; }
.hero-cats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; min-width: 0; }
.hero-cats::-webkit-scrollbar { display: none; }
.hcat { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: var(--r-full);
  border: 1px solid rgb(255 255 255 / 0.18); background: rgb(255 255 255 / 0.06); color: #fff;
  font-size: 13.5px; font-weight: 600; white-space: nowrap; transition: transform .14s, background .14s, border-color .14s; }
.hcat:hover { background: rgb(255 255 255 / 0.14); border-color: rgb(255 255 255 / 0.42); transform: translateY(-1px); }
.hcat:active { transform: translateY(0); }
.hcat-n { font-family: var(--font-mono); font-size: 11px; color: rgb(255 255 255 / 0.5); }
.hcat-all { background: var(--flame); border-color: var(--flame); }
.hcat-all:hover { background: var(--flame-600); border-color: var(--flame-600); }

.hero-grid-bg { position: absolute; inset: 0; opacity: .5;
  background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size: 56px 56px; -webkit-mask-image: radial-gradient(ellipse 80% 70% at 70% 0%, #000, transparent 75%); mask-image: radial-gradient(ellipse 80% 70% at 70% 0%, #000, transparent 75%); }
.hero-navy::after { content:''; position:absolute; top:-200px; right:-120px; width:480px; height:480px; border-radius:50%;
  background: radial-gradient(circle, rgba(240,78,35,.26), transparent 65%); filter: blur(20px); }

/* ===== MARQUEE ===== */
.marquee { background: var(--navy-900); color: #fff; overflow: hidden; padding: 18px 0; }
.marquee-track { display: flex; gap: 0; white-space: nowrap; width: max-content; animation: marq 34s linear infinite; }
.marquee-item { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.02em; padding: 0 6px; display: inline-flex; align-items: center; gap: 28px; color: rgba(255,255,255,.85); }
.marquee-dot { color: var(--flame); font-size: 22px; }
@keyframes marq { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce){ .marquee-track { animation: none; } }

/* ===== SECTIONS ===== */
.sec { padding: 104px 0; }
.sec-head { max-width: 760px; margin-bottom: 56px; }
.sec-head .eyebrow { margin-bottom: 20px; }
.sec-dark { background: var(--navy); }
.sec-base { background: var(--light); }

.why-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.why-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 32px; transition: transform .2s, box-shadow .2s, border-color .2s; }
.why-card:hover { transform: translateY(-4px); box-shadow: var(--e2); border-color: transparent; }
.why-ic { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: var(--r-md); background: var(--flame-tint); color: var(--flame); margin-bottom: 20px; }
.why-t { font-size: 20px; margin-bottom: 10px; letter-spacing: -0.02em; }
.why-d { color: var(--ash-700); font-size: 15.5px; line-height: 1.55; }

.proc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.proc-step { position: relative; padding-top: 28px; border-top: 2px solid rgba(255,255,255,.16); }
.proc-step::before { content:''; position:absolute; top:-2px; left:0; width: 64px; height: 2px; background: var(--flame); }
.proc-n { font-family: var(--font-display); font-weight: 700; font-size: 40px; color: var(--flame); letter-spacing: -0.03em; line-height: 1; margin-bottom: 16px; }
.proc-t { color: #fff; font-size: 21px; margin-bottom: 10px; letter-spacing: -0.02em; }
.proc-d { color: rgba(255,255,255,.65); font-size: 15px; line-height: 1.55; }


/* ===== LANGER SHOWCASE (karuzela marki własnej) ===== */
.sec-langer { background: var(--paper); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
.sec-langer::before { content:''; position:absolute; top:-180px; left:-120px; width:520px; height:520px; border-radius:50%;
  background: radial-gradient(circle, rgba(240,78,35,.10), transparent 65%); pointer-events:none; }
.sec-langer::after { content:''; position:absolute; bottom:-200px; right:-160px; width:540px; height:540px; border-radius:50%;
  background: radial-gradient(circle, rgba(30,63,181,.08), transparent 65%); pointer-events:none; }
.lshow-head { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: end; margin-bottom: 48px; position: relative; z-index: 2; }
.lshow-head .h-sec { margin-top: 20px; }
.lshow-lead { max-width: 480px; margin: 0; }
.lcarousel { position: relative; z-index: 2; }
.lcar-nav { position: absolute; top: 40%; transform: translateY(-50%); z-index: 3;
  width: 52px; height: 52px; border-radius: 50%; background: var(--white); color: var(--navy);
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); box-shadow: var(--e2); transition: background .15s, color .15s, transform .15s, opacity .15s; }
.lcar-nav:hover { background: var(--flame); color: #fff; border-color: var(--flame); }
.lcar-nav.disabled { opacity: .35; pointer-events: none; }
.lcar-prev { left: -22px; }
.lcar-next { right: -22px; }
.lcar-track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 300px);
  gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 8px 4px 24px; margin: -8px -4px 0;
  scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.lcar-track::-webkit-scrollbar { height: 8px; }
.lcar-track::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; }
.lcar-track::-webkit-scrollbar-track { background: transparent; }
.lcard { scroll-snap-align: start; background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg);
  overflow: hidden; display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s, border-color .2s; }
.lcard:hover { transform: translateY(-4px); box-shadow: var(--e2); border-color: transparent; }
.lcard-img { position: relative; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; padding: 16px; min-height: 0; overflow: hidden; border-bottom: 1px solid var(--line); }
.lcard-photo { width: 100%; height: 100%; object-fit: contain; object-position: center; }
.lcard-imgtag { position: absolute; bottom: 10px; right: 12px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: currentColor; opacity: .55; }
.lcard-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.lcard-brand { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--flame); font-weight: 600; }
.lcard-name { font-size: 18px; line-height: 1.2; letter-spacing: -0.02em; }
.lcard-variant { font-size: 13.5px; color: var(--ash-700); margin-top: -2px; }
.lcard-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.lcard-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lcard-pack { font-size: 13px; font-weight: 600; color: var(--navy); }
.lshow-foot { display: flex; align-items: center; gap: 20px; margin-top: 36px; position: relative; z-index: 2; flex-wrap: wrap; }
.lshow-count { color: var(--ash-700); font-size: 14px; font-weight: 600; }

/* ===== CONTACT ===== */
.sec-contact { background: var(--white); border-top: 1px solid var(--line); }
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: start; }
.contact-list { list-style: none; padding: 0; margin: 36px 0 0; display: flex; flex-direction: column; gap: 18px; }
.contact-list li { display: flex; align-items: center; gap: 16px; }
.ci { flex: none; width: 48px; height: 48px; border-radius: var(--r-md); background: var(--navy); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
.ci-k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
.ci-v { font-size: 17px; font-weight: 600; color: var(--navy); }
.form { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 32px; display: flex; flex-direction: column; gap: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ash-700); font-weight: 600; }
.field input, .field textarea { font-family: var(--font-text); font-size: 16px; color: var(--navy); background: var(--white); border: 1.5px solid var(--line-2); border-radius: var(--r-sm); padding: 13px 15px; transition: border-color .15s, box-shadow .15s; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(14,21,51,.08); }
.field input::placeholder, .field textarea::placeholder { color: var(--ash); }
.form-note { font-size: 12.5px; color: var(--ash); text-align: center; margin: 4px 0 0; }
.form-done { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 48px 32px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.form-done-ic { width: 64px; height: 64px; border-radius: 50%; background: var(--flame-tint); color: var(--flame); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px; }

/* ===== FOOTER ===== */
.footer { background: var(--navy-900); color: #fff; padding: 72px 0 32px; }
.footer-in { display: grid; grid-template-columns: 1.3fr 2fr; gap: 56px; padding-bottom: 48px; border-bottom: 1px solid rgba(255,255,255,.12); }
.footer-tag { color: rgba(255,255,255,.6); font-size: 15px; max-width: 360px; margin-top: 20px; line-height: 1.6; }
.footer-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.footer-col { display: flex; flex-direction: column; gap: 11px; }
.footer-h { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--flame-glow); margin-bottom: 6px; }
.footer-col a, .footer-col span { color: rgba(255,255,255,.7); font-size: 15px; transition: color .12s; }
.footer-col a:hover { color: #fff; }
.footer-bottom { display: flex; justify-content: space-between; padding-top: 28px; color: rgba(255,255,255,.45); font-size: 13px; }

/* ===== CATALOG ===== */
/* Kategoria = nawigacja: zakładki, zawsze dokładnie jedna aktywna.
   Rodzaj i marka = filtry wewnątrz kategorii.
   Zaznaczenie to wypełnienie, najechanie to tylko ramka — nic nie podskakuje,
   więc najechanego nie da się pomylić z wybranym. */
/* Wiersz wyboru: etykieta (KATEGORIA / RODZAJ) + pigułki. Na komputerze
   etykieta po lewej, na telefonie nad pigułkami. */
.frow { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: baseline; gap: 16px; margin-bottom: 14px; }
.frow-k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ash-700); font-weight: 600; }
.frow .chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.ctabs { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.ctab { flex: none; display: inline-flex; align-items: center; gap: 9px; height: 44px; padding: 0 18px;
  border: 1.5px solid var(--line-2); border-radius: var(--r-full); background: var(--white); color: var(--navy);
  font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: -.01em; white-space: nowrap;
  transition: border-color .12s, background .12s, color .12s; }
.ctab:hover { border-color: var(--navy); }
.ctab.on { background: var(--navy); border-color: var(--navy); color: #fff; cursor: default; }
.ctab-n { font-size: 11.5px; color: var(--ash); font-weight: 500; }
.ctab.on .ctab-n { color: rgb(255 255 255 / 0.62); }
.ctab.zero:not(.on) { color: var(--ash-700); }
.ctab:focus-visible, .chip:focus-visible, .tbtn:focus-visible, .tback:focus-visible, .fchip:focus-visible, .fclear:focus-visible,
.sheet-x:focus-visible, .bmenu-ok:focus-visible, .bmenu-clear:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }

/* Pasek narzędzi: marka, wybrane marki, licznik, sortowanie */
.tools-sentinel { height: 1px; margin-bottom: -1px; }
.tools { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; padding-top: 16px;
  border-top: 1px solid var(--line-2); }
.tools-r { margin-left: auto; display: flex; align-items: center; gap: 20px; }
.res-count { font-size: 15px; color: var(--ash-700); font-weight: 600; white-space: nowrap; }
.res-count .num { color: var(--navy); font-size: 18px; }
.tbtn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; flex: none;
  border: 1.5px solid var(--line-2); border-radius: var(--r-sm); background: var(--white); color: var(--navy);
  font-size: 14.5px; font-weight: 700; transition: border-color .12s; }
.tbtn:hover, .tbtn.on, .tbtn[aria-expanded="true"] { border-color: var(--navy); }
.tbtn-n { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: var(--r-full); background: var(--flame); color: #fff; font-family: var(--font-mono); font-size: 11px; font-weight: 700; }

.bmenu { position: relative; }
.bmenu-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: 290px; padding: 6px;
  background: var(--white); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--e2); }
.bmenu-pop .olist { max-height: 340px; overflow-y: auto; }
.bmenu-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 4px 2px; margin-top: 4px;
  border-top: 1px solid var(--line); }
.bmenu-clear { font-size: 13.5px; font-weight: 600; color: var(--ash-700); padding: 7px 8px; border-radius: var(--r-sm); }
.bmenu-clear:hover:not(:disabled) { color: var(--navy); }
.bmenu-clear:disabled { opacity: .4; cursor: default; }
.bmenu-ok { font-size: 13.5px; font-weight: 700; color: #fff; background: var(--navy); border-radius: var(--r-sm); padding: 8px 16px; }
.bmenu-ok:hover { background: var(--navy-800); }

/* Wiersze opcji (pole wyboru / jednokrotny wybór) — wspólne dla menu i panelu */
.olist { display: flex; flex-direction: column; }
.orow { position: relative; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 8px 10px;
  border-radius: var(--r-sm); cursor: pointer; font-size: 15px; font-weight: 600; color: var(--navy); line-height: 1.25; }
.orow:hover { background: var(--light); }
.orow input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.orow-mark { flex: none; width: 21px; height: 21px; display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--line-2); border-radius: 50%; background: var(--white); color: #fff; transition: background .12s, border-color .12s; }
.orow.multi .orow-mark { border-radius: 5px; }
.orow-mark svg { opacity: 0; stroke-width: 3px; }
.orow.on .orow-mark { border-color: var(--navy); }
.orow.multi.on .orow-mark { background: var(--navy); }
.orow.multi.on .orow-mark svg { opacity: 1; }
.orow:not(.multi).on .orow-mark::after { content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--navy); }
.orow input:focus-visible + .orow-mark { outline: 2px solid var(--flame); outline-offset: 2px; }
.orow-t { flex: 1; min-width: 0; }
.orow-n { flex: none; font-size: 12px; color: var(--ash); }
.orow.off { opacity: .4; cursor: default; }
.orow.off:hover { background: none; }

/* Wybrane filtry jako chipy z ✕ */
.applied { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 14px; flex: none;
  border-radius: var(--r-full); background: var(--cobalt-tint); color: var(--navy); font-size: 14px; font-weight: 600; }
.fchip svg { opacity: .55; }
.fchip:hover { background: #D7DDF4; }
.fchip:hover svg { opacity: 1; }
.fclear { font-size: 14px; font-weight: 600; color: var(--flame-600); padding: 6px 6px; }
.fclear:hover { text-decoration: underline; }

/* Panel filtrów (telefon) — od dołu, na całą szerokość */
.sheet-wrap { position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-bg { position: absolute; inset: 0; background: rgb(8 12 34 / 0.5); animation: sheet-fade .2s ease-out; }
.sheet { position: relative; display: flex; flex-direction: column; max-height: 86vh; max-height: 86dvh;
  background: var(--white); border-radius: 18px 18px 0 0; box-shadow: 0 -12px 40px -12px rgb(8 12 34 / 0.4);
  animation: sheet-up .26s cubic-bezier(.2,.8,.2,1); }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px 10px 20px; border-bottom: 1px solid var(--line); }
.sheet-h strong { font-family: var(--font-display); font-size: 19px; letter-spacing: -.02em; }
.sheet-x { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--navy); }
.sheet-x:active { background: var(--light); }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 6px 10px 14px; }
.sheet-sec + .sheet-sec { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.sheet-k { padding: 12px 10px 4px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ash-700); font-weight: 600; }
.sheet-empty { padding: 18px 10px; margin: 0; color: var(--ash-700); font-size: 15px; }
.sheet-f { display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.sheet-f .btn { padding: 14px 16px; font-size: 15px; }
.sheet-f .btn-dark { flex: 1; }
.sheet-f .btn:disabled { opacity: .4; cursor: default; }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheet-fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet-bg { animation: none; } }

.empty-act { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }

.load-more { display: flex; justify-content: center; margin-top: 30px; }

/* Nagłówek katalogu: tytuł i wyszukiwarka w jednym pasie — sekcja zaczyna się
   od rzeczy, po którą tu przyszedłeś, a nie od pół ekranu typografii. */
.base-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 460px); gap: 20px 32px;
  align-items: end; margin-bottom: 22px; }
.h-base { font-size: clamp(26px, 3vw, 38px); letter-spacing: -.03em; margin-top: 12px; }

.search { flex: 1; display: flex; align-items: center; gap: 12px; background: var(--white); border: 1.5px solid var(--line-2); border-radius: var(--r-sm); padding: 0 16px; transition: border-color .15s, box-shadow .15s; }
.search:focus-within { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(14,21,51,.08); }
.search svg { color: var(--ash); flex: none; }
.search input { flex: 1; border: none; outline: none; background: none; font-family: var(--font-text); font-size: 16px; padding: 15px 0; color: var(--navy); }
.search input::placeholder { color: var(--ash); }
.search-x { color: var(--ash); display: inline-flex; padding: 4px; }
.search-x:hover { color: var(--navy); }
.sortbox { display: flex; align-items: center; gap: 10px; flex: none; }
.sortbox label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ash-700); font-weight: 600; }
.sortbox select { font-family: var(--font-text); font-size: 15px; font-weight: 600; color: var(--navy); background: var(--white); border: 1.5px solid var(--line-2); border-radius: var(--r-sm); padding: 13px 14px; cursor: pointer; }
.sortbox select:focus { outline: none; border-color: var(--navy); }
.pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.pcard { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s, border-color .2s; }
.pcard:hover { transform: translateY(-4px); box-shadow: var(--e2); border-color: transparent; }
.pcard-img { position: relative; aspect-ratio: 16/11; display: flex; align-items: center; justify-content: center; padding: 14px; min-height: 0; overflow: hidden; border-bottom: 1px solid var(--line); }
.pcard-photo { width: 100%; height: 100%; object-fit: contain; object-position: center; }
.pcard-imgtag { position: absolute; bottom: 10px; right: 12px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: currentColor; opacity: .55; }
.pbadge { position: absolute; top: 12px; left: 12px; font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 5px 9px; border-radius: var(--r-full); color: #fff; }
.role-magnet { background: var(--flame); }
.role-margin { background: var(--cobalt); }
.role-premium { background: var(--navy); }
.pcard-body { padding: 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pcard-brand { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ash); font-weight: 600; }
.pcard-sub { color: var(--ash-700); }
.pcard-name { font-size: 17px; line-height: 1.2; letter-spacing: -0.02em; }
.pcard-variant { font-size: 13.5px; color: var(--ash-700); margin-top: -2px; }
.pcard-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.ptag { font-size: 11px; font-weight: 600; color: var(--ash-700); background: var(--light); border-radius: var(--r-full); padding: 3px 9px; }
.pcard-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.pcard-pack { font-size: 13px; font-weight: 600; color: var(--navy); }
.pcard-sku { font-size: 11.5px; color: var(--ash); margin-top: 2px; }
.pcard-ask { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--flame); white-space: nowrap; }
.pcard-ask:hover { color: var(--flame-600); }
.empty { text-align: center; padding: 72px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--white); border: 1px dashed var(--line-2); border-radius: var(--r-lg); }
.empty-ic { width: 64px; height: 64px; border-radius: 50%; background: var(--light); color: var(--ash); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 1080px){
  .why-grid { grid-template-columns: repeat(2, 1fr); }
  .proc-grid { grid-template-columns: repeat(2, 1fr); gap: 36px 24px; }
  .pgrid { grid-template-columns: repeat(3, 1fr); }
  .lshow-head { grid-template-columns: 1fr; gap: 20px; align-items: start; }
  .lcar-prev { left: 8px; }
  .lcar-next { right: 8px; }
}
@media (max-width: 900px){
  .hdr-nav, .hdr-cta { display: none; }
  .hdr-burger { display: inline-flex; }
  .hero-navy-in { grid-template-columns: 1fr; gap: 28px; }
  .hero-facts { padding: 18px 20px; gap: 16px; }
  .contact-grid, .footer-in { grid-template-columns: 1fr; gap: 40px; }
}
@media (max-width: 680px){
  .sec { padding: 72px 0; }
  .why-grid, .proc-grid { grid-template-columns: 1fr; }
  /* Dwie kolumny kart produktów zamiast jednej — mniej przewijania na telefonie */
  .pgrid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .pcard-body { padding: 13px; gap: 6px; }
  .pcard-name { font-size: 15px; }
  .pcard-variant, .pcard-pack { font-size: 12.5px; }
  .pcard-foot { flex-direction: column; align-items: flex-start; gap: 8px; padding-top: 10px; }
  .base-head { grid-template-columns: 1fr; gap: 14px; align-items: stretch; }
  .h-base { margin-top: 10px; }
  /* Katalog na telefonie: kategorie i rodzaje zawijają się do kolejnych linii —
     wszystko widać naraz, nic nie trzeba przesuwać. Etykieta nad pigułkami. */
  .frow { grid-template-columns: 1fr; gap: 8px; margin-bottom: 16px; }
  .ctabs { gap: 7px; }
  .ctab { height: 40px; padding: 0 14px; gap: 7px; font-size: 14px; }
  .chip { padding: 9px 13px; }
  /* Pasek narzędzi przykleja się pod nagłówkiem. Przyklejony dostaje białe tło
     i przycisk z bieżącą kategorią (powrót do wyboru). */
  .tools { position: sticky; top: var(--header-h); z-index: 20; flex-wrap: nowrap; gap: 8px; margin: 4px -20px 14px;
    padding: 10px 20px; background: var(--light); border-top: none; border-bottom: 1px solid transparent;
    transition: background .2s, box-shadow .2s, border-color .2s; }
  .tools.stuck { background: var(--white); border-bottom-color: var(--line); box-shadow: 0 10px 20px -16px rgb(14 21 51 / 0.5); }
  .tools .tbtn { height: 40px; padding: 0 12px; font-size: 14px; }
  .tools-r { gap: 10px; min-width: 0; }
  .tools .sortbox label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .tools .sortbox select { height: 40px; padding: 0 8px; font-size: 14px; }
  .tools .res-count { font-size: 13px; }
  .tools .res-count .num { font-size: 14px; }
  .tback { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 40px; padding: 0 10px 0 12px; border-radius: var(--r-sm); background: var(--navy); color: #fff; text-align: left; }
  .tback-txt { min-width: 0; display: flex; flex-direction: column; line-height: 1.1; }
  .tback-k { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: rgb(255 255 255 / 0.6); }
  .tback-v { font-family: var(--font-display); font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tools.stuck .tools-r { margin-left: 0; }
  .fchip { height: 34px; font-size: 13.5px; }
  .hero-navy { padding: calc(var(--header-h) + 28px) 0 32px; }
  .hero-cats { margin-top: 22px; gap: 7px; }
  .hcat { padding: 8px 13px; font-size: 13px; }
  .pcard-sub { display: none; }
  .lcar-track { grid-auto-columns: 78%; }
  .lcar-nav { display: none; }
  .form-row { grid-template-columns: 1fr; }
  .footer-cols { grid-template-columns: 1fr; }
  .footer-bottom { flex-direction: column; gap: 8px; }
  .marquee-item { font-size: 20px; }
}

<body>
  <div id="root"><div class="boot" aria-busy="true" aria-label="Ładowanie strony"></div></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ===== DATA =====
   Domyślne wartości = fallback. Rzeczywiste marki/kategorie pobieramy z bazy
   (/api/brands, /api/categories) w bootstrapie na końcu skryptu — zanim
   wyrenderujemy stronę. Zarządza nimi panel → zakładka „Ustawienia". */
let CATEGORIES = [
  { id: 'piany',     label: 'Piany montażowe', icon: 'piany',     blurb: 'Niskoprężne, pistoletowe, wężykowe, zimowe i ogniochronne.' },
  { id: 'silikony',  label: 'Silikony',        icon: 'silikony',  blurb: 'Sanitarne, uniwersalne, budowlane i wysokotemperaturowe.' },
  { id: 'akryle',    label: 'Akryle',          icon: 'akryle',    blurb: 'Malarskie, elastyczne i dekarskie — gotowe pod malowanie.' },
  { id: 'kleje',     label: 'Kleje',           icon: 'kleje',     blurb: 'Montażowe, hybrydowe i poliuretanowe — mocne łączenie.' },
  { id: 'akcesoria', label: 'Akcesoria',       icon: 'akcesoria', blurb: 'Pistolety, czyściki, taśmy i wszystko wokół chemii.' },
];

let BRANDS = ['Soudal', 'Tytan', 'Penosil', 'Langer', 'Den Braven'];

/* ===== USTAWIENIA Z PANELU =====
   Logo, kolor akcentu i dane kontaktowe pobierane z /api/settings (panel →
   Ustawienia). Poniższe wartości to fallback: gdy API nie odpowie albo strona
   jest oglądana z dysku, wszystko wygląda jak dotąd — wbudowany sygnet SVG. */
let SITE = {
  logo_light:      '',   // logo na ciemne tło (header u góry, stopka)
  logo_dark:       '',   // logo na jasne tło (header po przewinięciu)
  logo_mark:       '',   // sygnet — znak wodny w hero
  logo_height:     '38',
  logo_show_text:  '1',
  brand_accent:    '#F04E23',
  contact_phone:   '+48 000 000 000',
  contact_email:   'biuro@langerdystrybucja.pl',
  contact_street:  'ul. Przykładowa 00',
  contact_city:    '00-000 Miasto',
  contact_company: 'Langer Dystrybucja',
  stat_products:   '',   // puste = liczymy z bazy
  stat_brands:     '',   // puste = liczymy z bazy
  stat_delivery:   '48 h',
  stat_points:     '',   // puste = kafel się nie pokazuje
};

/* Logo dla danego tła. Gdy wgrano tylko jedną wersję — używamy jej wszędzie,
   lepsze to niż brak logo w połowie miejsc. */
function logoFor(onDark) {
  return onDark ? (SITE.logo_light || SITE.logo_dark) : (SITE.logo_dark || SITE.logo_light);
}

/* „+48 123 456 789" -> „+48123456789" (poprawny href dla tel:) */
function telHref(phone) {
  return 'tel:' + String(phone || '').replace(/[^\d+]/g, '');
}

/* Odcień akcentu: mix koloru z bielą (t>0) albo z czernią (t<0).
   Dzięki temu wybór jednego koloru w panelu daje komplet: hover, wciśnięcie
   i jasne tło ikon — bez ręcznego dobierania czterech hexów. */
function shade(hex, t) {
  const m = /^#?([\da-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  const mix = (c) => Math.round(t >= 0 ? c + (255 - c) * t : c * (1 + t));
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(mix);
  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');
}

/* Wpina kolor akcentu w zmienne CSS — podmienia się wszystko naraz:
   przyciski, odznaki, podkreślenia, wbudowany sygnet. */
function applyAccent(hex) {
  if (!/^#?[\da-f]{6}$/i.test(String(hex || '').trim())) return;
  const root = document.documentElement.style;
  root.setProperty('--flame', hex);
  root.setProperty('--flame-600', shade(hex, -0.14));
  root.setProperty('--flame-700', shade(hex, -0.28));
  root.setProperty('--flame-tint', shade(hex, 0.86));
  root.setProperty('--flame-glow', shade(hex, 0.14));
}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      panel.style.right = offsetRef.current.x + 'px';
      panel.style.bottom = offsetRef.current.y + 'px';
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakRadio({ label, value, options, onChange }) {

          <button key={o} type="button" role="radio" aria-checked={o === value} onClick={() => onChange(o)}>{o}</button>

function TweakColor({ label, value, options, onChange }) {

}

/* Menu na telefonie — panel z prawej na całą wysokość ekranu. Przewijanie
   strony pod spodem jest zablokowane; zamyka ✕, tapnięcie w tło, Esc albo
   wybór linku. */
function MobileMenu({ links, onClose }) {
  const closeRef = useRef(null);
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    if (closeRef.current) closeRef.current.focus();
    return () => { document.body.style.overflow = prev; document.removeEventListener('keydown', onKey); };
  }, []);
  return (
    <div className="mobile-menu" role="dialog" aria-modal="true" aria-label="Menu">
      <div className="mm-bg" onClick={onClose} />
      <nav className="mobile-sheet">
        <div className="mm-head">
          <div onClick={onClose}><LangerLogo onDark={false} size={34} /></div>
          <button type="button" ref={closeRef} className="mm-close" onClick={onClose} aria-label="Zamknij menu"><IX s={24}/></button>
        </div>
        <div className="mm-links">
          {links.map(([h,l]) => <a key={h} href={h} className="mm-link" onClick={onClose}>{l}<IArrow s={18}/></a>)}
        </div>
        <div className="mm-foot">
          <a href="#kontakt" className="btn btn-flame" onClick={onClose}>Zostań partnerem <IArrow/></a>
          {SITE.contact_phone && <a href={telHref(SITE.contact_phone)} className="mm-contact"><IPhone s={18}/> {SITE.contact_phone}</a>}
          {SITE.contact_email && <a href={'mailto:' + SITE.contact_email} className="mm-contact"><IMail s={18}/> {SITE.contact_email}</a>}
        </div>
      </nav>
    </div>
  );
}

/* ===== LANGER SHOWCASE (karuzela marki własnej) ===== */
function LangerShowcase({ products }) {
  const trackRef = useRef(null);
  const [canPrev, setCanPrev] = useState(false);
  const [canNext, setCanNext] = useState(true);

  const items = (products || []).filter(p => p.brand === 'Langer');

  const updateNav = () => {
    const t = trackRef.current;
    if (!t) return;
    setCanPrev(t.scrollLeft > 4);
    setCanNext(t.scrollLeft + t.clientWidth < t.scrollWidth - 4);
  };

  useEffect(() => {
    const t = trackRef.current;
    if (!t) return;
    updateNav();
    t.addEventListener('scroll', updateNav, { passive: true });
    window.addEventListener('resize', updateNav);
    return () => {
      t.removeEventListener('scroll', updateNav);
      window.removeEventListener('resize', updateNav);
    };
  }, [items.length]);

  const scrollByStep = (dir) => {
    const t = trackRef.current;
    if (!t) return;
    const card = t.querySelector('.lcard');
    const step = card ? card.offsetWidth + 20 : 320;
    t.scrollBy({ left: dir * step, behavior: 'smooth' });
  };

  if (!items.length) return null;

  return (
    <section id="langer" className="sec sec-langer">
      <div className="wrap">
        <div className="lshow-head reveal">
          <div>
            <span className="eyebrow">Marka własna</span>
            <h2 className="h-sec">Linia Langer —<br/>jakość pod własną marką.</h2>
          </div>
          <p className="lead lshow-lead">
            Pełna gama pian, klejów, silikonów i akcesoriów pod naszą marką. Jakość premium w hurtowej cenie, prosto z naszego magazynu.
          </p>
        </div>

        <div className="lcarousel reveal">
          <button className={'lcar-nav lcar-prev' + (canPrev ? '' : ' disabled')}
                  onClick={() => scrollByStep(-1)} aria-label="Poprzednie">
            <IArrow s={20} style={{ transform: 'rotate(180deg)' }} />
          </button>

          <div className="lcar-track" ref={trackRef}>
            {items.map(p => <LangerCard key={p.sku} p={p} />)}
          </div>

          <button className={'lcar-nav lcar-next' + (canNext ? '' : ' disabled')}
                  onClick={() => scrollByStep(1)} aria-label="Następne">
            <IArrow s={20} />
          </button>
        </div>

        <div className="lshow-foot reveal">
          <a href="#baza" className="btn btn-dark">Zobacz całą linię Langer <IArrow/></a>
          <span className="lshow-count num">{items.length} produktów</span>
        </div>
      </div>
    </section>
  );
}

/* Zdjęcie produktu z próbkowaniem koloru tła (rogi obrazka -> tło kafla).
   Gdy host nie wysyła nagłówków CORS, canvas jest "tainted" i próbkowanie
   się nie uda — wtedy onBg(null) i kafel zostaje biały (bez regresji). */
function ProductImage({ src, alt, className, onBg }) {
  const [cors, setCors] = useState(true);

  function sample(img) {
    try {
      const c = document.createElement('canvas');
      const w = c.width = 16, h = c.height = 16;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const corners = [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]];
      let r = 0, g = 0, b = 0, n = 0;
      for (const [x, y] of corners) {
        const d = ctx.getImageData(x, y, 1, 1).data;
        if (d[3] < 200) continue;             // róg przezroczysty -> pomiń
        r += d[0]; g += d[1]; b += d[2]; n++;
      }
      onBg(n ? `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})` : null);
    } catch (e) {
      onBg(null);                              // CORS taint -> biały kafel
    }
  }

  return (
    <img
      key={cors ? 'c' : 'p'}
      src={src}
      alt={alt}
      className={className}
      loading="lazy"
      decoding="async"
      crossOrigin={cors ? 'anonymous' : undefined}
      onLoad={e => sample(e.target)}
      onError={e => { if (cors) { setCors(false); onBg(null); } else { e.target.style.visibility = 'hidden'; } }}
    />
  );
}

/* Czy jesteśmy na wąskim ekranie (telefon). Tam filtry siedzą w panelu
   wysuwanym od dołu, a zakładki kategorii przewijają się w poziomie. */
function useNarrow(query = '(max-width: 680px)') {
  const [narrow, setNarrow] = useState(() => window.matchMedia(query).matches);
  useEffect(() => {
    const mq = window.matchMedia(query);
    const on = () => setNarrow(mq.matches);
    on();
    if (mq.addEventListener) { mq.addEventListener('change', on); return () => mq.removeEventListener('change', on); }
    mq.addListener(on); return () => mq.removeListener(on);
  }, [query]);
  return narrow;
}
