<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Langer Dystrybucja — hurtowa dystrybucja chemii budowlanej</title>
  <meta name="description" content="Hurtowa dystrybucja chemii budowlanej: piany montażowe, silikony, akryle, kleje i akcesoria dla sklepów, hurtowni i ekip wykonawczych." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
/* ===== BRAND TOKENS ===== */
:root {
  --flame:        #F04E23;
  --flame-600:    #D63F18;
  --flame-700:    #B63411;
  --flame-tint:   #FBE7DF;
  --flame-glow:   #FF6A3D;
  --cobalt:       #1E3FB5;
  --cobalt-600:   #182F95;
  --cobalt-tint:  #E5E9F8;
  --navy:         #0E1533;
  --navy-800:     #161E45;
  --navy-700:     #232C5E;
  --navy-900:     #080C22;
  --ash:          #8B9199;
  --ash-700:      #565D67;
  --light:        #EEF0F3;
  --paper:        #F6F7F9;
  --white:        #FFFFFF;
  --line:         #E2E5EA;
  --line-2:       #CFD4DC;
  --font-display: 'Space Grotesk', 'Hanken Grotesk', system-ui, sans-serif;
  --font-text:    'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, Menlo, monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px; --s10:128px;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px; --r-full:999px;
  --e1: 0 1px 2px rgb(14 21 51 / 0.06), 0 1px 1px rgb(14 21 51 / 0.04);
  --e2: 0 18px 48px -16px rgb(14 21 51 / 0.22), 0 6px 16px -8px rgb(14 21 51 / 0.10);
  --e-flame: 0 16px 40px -12px rgb(240 78 35 / 0.45);
  --max: 1240px;
  --header-h: 76px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 16px); }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--navy);
  font-family: var(--font-text);
  font-size: 17px;
  line-height: 1.6;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
::selection { background: var(--flame); color: #fff; }

.wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding-inline: 32px; }
@media (max-width: 760px){ .wrap { padding-inline: 20px; } }

.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--flame);
  display: inline-flex; align-items: center; gap: 10px;
}
.eyebrow::before { content:''; width: 22px; height: 2px; background: var(--flame); display:inline-block; }
.eyebrow.on-dark { color: var(--flame-glow); }

h1,h2,h3,h4 { font-family: var(--font-display); margin: 0; line-height: 1.02; letter-spacing: -0.03em; font-weight: 700; }
.display { font-size: clamp(44px, 7vw, 92px); line-height: 0.94; letter-spacing: -0.04em; }
.h-sec   { font-size: clamp(32px, 4.4vw, 56px); letter-spacing: -0.035em; }
.lead { font-size: clamp(17px, 2vw, 21px); line-height: 1.55; color: var(--ash-700); font-weight: 400; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:10px;
  font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing:-0.01em;
  padding: 15px 26px; border-radius: var(--r-sm); transition: transform .12s, background .15s, box-shadow .15s, color .15s;
  white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn-flame { background: var(--flame); color:#fff; box-shadow: var(--e-flame); }
.btn-flame:hover { background: var(--flame-600); transform: translateY(-2px); }
.btn-flame:active { background: var(--flame-700); transform: translateY(0); }
.btn-dark { background: var(--navy); color:#fff; }
.btn-dark:hover { background: var(--navy-800); transform: translateY(-2px); }
.btn-ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--line-2); }
.btn-ghost:hover { border-color: var(--navy); background: var(--white); }
.btn-ghost.on-dark { color:#fff; border-color: rgb(255 255 255 / 0.28); }
.btn-ghost.on-dark:hover { border-color:#fff; background: rgb(255 255 255 / 0.08); }

.chip { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600;
  padding: 7px 14px; border-radius: var(--r-full); border:1px solid var(--line-2); color: var(--ash-700);
  background: var(--white); transition: all .12s; cursor:pointer; }
.chip:hover { border-color: var(--navy); color: var(--navy); }
.chip.active { background: var(--navy); color:#fff; border-color: var(--navy); }
.chip-n { font-family: var(--font-mono); font-size: 11px; opacity: .55; }

.reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s cubic-bezier(.2,0,0,1), transform .7s cubic-bezier(.2,0,0,1); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce){ .reveal { opacity:1; transform:none; transition:none; } html{scroll-behavior:auto;} }

/* ===== HEADER ===== */
.hdr { position: fixed; inset: 0 0 auto 0; height: var(--header-h); z-index: 100;
  display: flex; align-items: center; transition: background .25s, box-shadow .25s, border-color .25s;
  border-bottom: 1px solid transparent; }
.hdr-solid { background: rgba(246,247,249,.86); backdrop-filter: blur(12px); border-bottom-color: var(--line); }
.hdr-in { display: flex; align-items: center; gap: 24px; width: 100%; }
.logo { display: inline-flex; align-items: center; gap: 12px; }
.logo-words { display: flex; flex-direction: column; line-height: 1; }
.logo-name { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -0.02em; }
.logo-sub { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.28em; margin-top: 3px; }
.hdr-nav { display: flex; gap: 4px; margin-left: auto; }
.hdr-link { font-weight: 600; font-size: 15px; padding: 9px 14px; border-radius: var(--r-sm); color: inherit; transition: background .12s, color .12s; }
.hdr:not(.hdr-solid) .hdr-link { color: #fff; }
.hdr:not(.hdr-solid) .logo { color: #fff !important; }
.hdr-link:hover { color: var(--flame); }
.hdr-cta { display: flex; }
.hdr-burger { display: none; color: inherit; padding: 6px; }
.hdr:not(.hdr-solid) .hdr-burger { color: #fff; }
.mobile-menu { position: fixed; inset: 0; background: rgba(8,12,34,.5); z-index: 200; }
.mobile-sheet { position: absolute; top: 0; right: 0; height: 100%; width: min(320px, 86vw); background: var(--white);
  padding: 24px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--e2); }
.mm-close { align-self: flex-end; padding: 8px; color: var(--navy); margin-bottom: 12px; }
.mm-link { font-family: var(--font-display); font-weight: 600; font-size: 20px; padding: 12px 4px; border-bottom: 1px solid var(--line); }

/* ===== HERO (kompaktowy) =====
   Zamiast pełnoekranowego plakatu: jedno zdanie o tym, co sprzedajemy, twarde
   liczby z bazy i pasek kategorii — żeby od pierwszego ekranu było wiadomo,
   po co tu jesteś, i dało się jednym kliknięciem wejść w katalog. */
.hero { position: relative; overflow: hidden; }
.hero-navy { background: var(--navy); padding: calc(var(--header-h) + 44px) 0 44px; }
.hero-navy-in { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 20px 48px; align-items: center; }
.hero-copy { min-width: 0; }
.hero-h { color: #fff; font-size: clamp(31px, 3.9vw, 48px); line-height: 1.05; letter-spacing: -0.035em; max-width: 21ch; margin: 14px 0 0; }
.hero-lead { font-size: clamp(16px, 1.5vw, 19px); line-height: 1.5; color: rgb(255 255 255 / 0.72); max-width: 620px; margin: 14px 0 0; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }

/* Liczby jako panel po prawej — wypełniają kolumnę, której nagłówek nie potrzebuje,
   i od razu mówią, jaka jest skala oferty. */
.hero-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px;
  padding: 24px 26px; border-radius: var(--r-lg);
  background: rgb(255 255 255 / 0.05); border: 1px solid rgb(255 255 255 / 0.1); }
.hero-fact b { display: block; font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 2.4vw, 32px);
  line-height: 1; letter-spacing: -.03em; color: #fff; }
.hero-fact span { display: block; margin-top: 6px; font-size: 12.5px; line-height: 1.35; color: rgb(255 255 255 / 0.55); }

/* Pasek kategorii w hero — przewijalny w poziomie na telefonie */
.hero-cats-wrap { position: relative; z-index: 2; }
.hero-cats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; min-width: 0; }
.hero-cats::-webkit-scrollbar { display: none; }
.hcat { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: var(--r-full);
  border: 1px solid rgb(255 255 255 / 0.18); background: rgb(255 255 255 / 0.06); color: #fff;
  font-size: 13.5px; font-weight: 600; white-space: nowrap; transition: transform .14s, background .14s, border-color .14s; }
.hcat:hover { background: rgb(255 255 255 / 0.14); border-color: rgb(255 255 255 / 0.42); transform: translateY(-1px); }
.hcat:active { transform: translateY(0); }
.hcat-n { font-family: var(--font-mono); font-size: 11px; color: rgb(255 255 255 / 0.5); }
.hcat-all { background: var(--flame); border-color: var(--flame); }
.hcat-all:hover { background: var(--flame-600); border-color: var(--flame-600); }

.hero-grid-bg { position: absolute; inset: 0; opacity: .5;
  background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size: 56px 56px; -webkit-mask-image: radial-gradient(ellipse 80% 70% at 70% 0%, #000, transparent 75%); mask-image: radial-gradient(ellipse 80% 70% at 70% 0%, #000, transparent 75%); }
.hero-navy::after { content:''; position:absolute; top:-200px; right:-120px; width:480px; height:480px; border-radius:50%;
  background: radial-gradient(circle, rgba(240,78,35,.26), transparent 65%); filter: blur(20px); }

/* ===== MARQUEE ===== */
.marquee { background: var(--navy-900); color: #fff; overflow: hidden; padding: 18px 0; }
.marquee-track { display: flex; gap: 0; white-space: nowrap; width: max-content; animation: marq 34s linear infinite; }
.marquee-item { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.02em; padding: 0 6px; display: inline-flex; align-items: center; gap: 28px; color: rgba(255,255,255,.85); }
.marquee-dot { color: var(--flame); font-size: 22px; }
@keyframes marq { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce){ .marquee-track { animation: none; } }

/* ===== SECTIONS ===== */
.sec { padding: 104px 0; }
.sec-head { max-width: 760px; margin-bottom: 56px; }
.sec-head .eyebrow { margin-bottom: 20px; }
.sec-dark { background: var(--navy); }
.sec-base { background: var(--light); }

.why-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.why-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 32px; transition: transform .2s, box-shadow .2s, border-color .2s; }
.why-card:hover { transform: translateY(-4px); box-shadow: var(--e2); border-color: transparent; }
.why-ic { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: var(--r-md); background: var(--flame-tint); color: var(--flame); margin-bottom: 20px; }
.why-t { font-size: 20px; margin-bottom: 10px; letter-spacing: -0.02em; }
.why-d { color: var(--ash-700); font-size: 15.5px; line-height: 1.55; }

.proc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.proc-step { position: relative; padding-top: 28px; border-top: 2px solid rgba(255,255,255,.16); }
.proc-step::before { content:''; position:absolute; top:-2px; left:0; width: 64px; height: 2px; background: var(--flame); }
.proc-n { font-family: var(--font-display); font-weight: 700; font-size: 40px; color: var(--flame); letter-spacing: -0.03em; line-height: 1; margin-bottom: 16px; }
.proc-t { color: #fff; font-size: 21px; margin-bottom: 10px; letter-spacing: -0.02em; }
.proc-d { color: rgba(255,255,255,.65); font-size: 15px; line-height: 1.55; }


/* ===== LANGER SHOWCASE (karuzela marki własnej) ===== */
.sec-langer { background: var(--paper); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
.sec-langer::before { content:''; position:absolute; top:-180px; left:-120px; width:520px; height:520px; border-radius:50%;
  background: radial-gradient(circle, rgba(240,78,35,.10), transparent 65%); pointer-events:none; }
.sec-langer::after { content:''; position:absolute; bottom:-200px; right:-160px; width:540px; height:540px; border-radius:50%;
  background: radial-gradient(circle, rgba(30,63,181,.08), transparent 65%); pointer-events:none; }
.lshow-head { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: end; margin-bottom: 48px; position: relative; z-index: 2; }
.lshow-head .h-sec { margin-top: 20px; }
.lshow-lead { max-width: 480px; margin: 0; }
.lcarousel { position: relative; z-index: 2; }
.lcar-nav { position: absolute; top: 40%; transform: translateY(-50%); z-index: 3;
  width: 52px; height: 52px; border-radius: 50%; background: var(--white); color: var(--navy);
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); box-shadow: var(--e2); transition: background .15s, color .15s, transform .15s, opacity .15s; }
.lcar-nav:hover { background: var(--flame); color: #fff; border-color: var(--flame); }
.lcar-nav.disabled { opacity: .35; pointer-events: none; }
.lcar-prev { left: -22px; }
.lcar-next { right: -22px; }
.lcar-track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 300px);
  gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 8px 4px 24px; margin: -8px -4px 0;
  scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.lcar-track::-webkit-scrollbar { height: 8px; }
.lcar-track::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; }
.lcar-track::-webkit-scrollbar-track { background: transparent; }
.lcard { scroll-snap-align: start; background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg);
  overflow: hidden; display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s, border-color .2s; }
.lcard:hover { transform: translateY(-4px); box-shadow: var(--e2); border-color: transparent; }
.lcard-img { position: relative; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; padding: 16px; min-height: 0; overflow: hidden; border-bottom: 1px solid var(--line); }
.lcard-photo { width: 100%; height: 100%; object-fit: contain; object-position: center; }
.lcard-imgtag { position: absolute; bottom: 10px; right: 12px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: currentColor; opacity: .55; }
.lcard-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.lcard-brand { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--flame); font-weight: 600; }
.lcard-name { font-size: 18px; line-height: 1.2; letter-spacing: -0.02em; }
.lcard-variant { font-size: 13.5px; color: var(--ash-700); margin-top: -2px; }
.lcard-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.lcard-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lcard-pack { font-size: 13px; font-weight: 600; color: var(--navy); }
.lshow-foot { display: flex; align-items: center; gap: 20px; margin-top: 36px; position: relative; z-index: 2; flex-wrap: wrap; }
.lshow-count { color: var(--ash-700); font-size: 14px; font-weight: 600; }

/* ===== CONTACT ===== */
.sec-contact { background: var(--white); border-top: 1px solid var(--line); }
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: start; }
.contact-list { list-style: none; padding: 0; margin: 36px 0 0; display: flex; flex-direction: column; gap: 18px; }
.contact-list li { display: flex; align-items: center; gap: 16px; }
.ci { flex: none; width: 48px; height: 48px; border-radius: var(--r-md); background: var(--navy); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
.ci-k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
.ci-v { font-size: 17px; font-weight: 600; color: var(--navy); }
.form { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 32px; display: flex; flex-direction: column; gap: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ash-700); font-weight: 600; }
.field input, .field textarea { font-family: var(--font-text); font-size: 16px; color: var(--navy); background: var(--white); border: 1.5px solid var(--line-2); border-radius: var(--r-sm); padding: 13px 15px; transition: border-color .15s, box-shadow .15s; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(14,21,51,.08); }
.field input::placeholder, .field textarea::placeholder { color: var(--ash); }
.form-note { font-size: 12.5px; color: var(--ash); text-align: center; margin: 4px 0 0; }
.form-done { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 48px 32px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.form-done-ic { width: 64px; height: 64px; border-radius: 50%; background: var(--flame-tint); color: var(--flame); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px; }

/* ===== FOOTER ===== */
.footer { background: var(--navy-900); color: #fff; padding: 72px 0 32px; }
.footer-in { display: grid; grid-template-columns: 1.3fr 2fr; gap: 56px; padding-bottom: 48px; border-bottom: 1px solid rgba(255,255,255,.12); }
.footer-tag { color: rgba(255,255,255,.6); font-size: 15px; max-width: 360px; margin-top: 20px; line-height: 1.6; }
.footer-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.footer-col { display: flex; flex-direction: column; gap: 11px; }
.footer-h { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--flame-glow); margin-bottom: 6px; }
.footer-col a, .footer-col span { color: rgba(255,255,255,.7); font-size: 15px; transition: color .12s; }
.footer-col a:hover { color: #fff; }
.footer-bottom { display: flex; justify-content: space-between; padding-top: 28px; color: rgba(255,255,255,.45); font-size: 13px; }

/* ===== CATALOG ===== */
/* Wybór idzie od góry do dołu: kategoria (kafelki) -> podkategoria -> marka.
   Każdy poziom pokazuje TYLKO to, co realnie jest w bieżącym zawężeniu, i ile
   tego jest — nie da się kliknąć w pustkę. */
.pick { margin-bottom: 20px; }
.pick-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.pick-k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ash-700); font-weight: 600; }
.pick-hint { font-size: 13px; color: var(--ash); }

.ctiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.ctile { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 108px; padding: 14px;
  border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--white); color: var(--navy); text-align: left;
  transition: transform .14s, box-shadow .14s, border-color .14s, background .14s, color .14s; }
.ctile:hover:not(:disabled) { transform: translateY(-3px); box-shadow: var(--e2); border-color: transparent; }
.ctile:active:not(:disabled) { transform: translateY(-1px); box-shadow: var(--e1); }
.ctile.on { background: var(--navy); border-color: var(--navy); color: #fff; box-shadow: var(--e2); }
.ctile:disabled { opacity: .38; cursor: not-allowed; }
.ctile-ic { color: var(--flame); display: block; }
.ctile.on .ctile-ic { color: var(--flame-glow); }

/* Logo dla danego tła. Gdy wgrano tylko jedną wersję — używamy jej wszędzie,
   lepsze to niż brak logo w połowie miejsc. */
function logoFor(onDark) {

/* „+48 123 456 789" -> „+48123456789" (poprawny href dla tel:) */
function telHref(phone) {
  return 'tel:' + String(phone || '').replace(/[^\d+]/g, '');
}

/* Odcień akcentu: mix koloru z bielą (t>0) albo z czernią (t<0).
   Dzięki temu wybór jednego koloru w panelu daje komplet: hover, wciśnięcie
   i jasne tło ikon — bez ręcznego dobierania czterech hexów. */
function shade(hex, t) {
  const m = /^#?([\da-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  const mix = (c) => Math.round(t >= 0 ? c + (255 - c) * t : c * (1 + t));
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(mix);
  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');
}

/* Wpina kolor akcentu w zmienne CSS — podmienia się wszystko naraz:
   przyciski, odznaki, podkreślenia, wbudowany sygnet. */
function applyAccent(hex) {
  if (!/^#?[\da-f]{6}$/i.test(String(hex || '').trim())) return;
  const root = document.documentElement.style;
  root.setProperty('--flame', hex);
  root.setProperty('--flame-600', shade(hex, -0.14));
  root.setProperty('--flame-700', shade(hex, -0.28));
  root.setProperty('--flame-tint', shade(hex, 0.86));
  root.setProperty('--flame-glow', shade(hex, 0.14));
}

/* ===== TWEAKS PANEL ===== */
const __TWEAKS_STYLE = `

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      panel.style.right = offsetRef.current.x + 'px';
      panel.style.bottom = offsetRef.current.y + 'px';
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) {
  return <div className="twk-sect">{label}</div>;
}

function TweakRow({ label, children }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      {children}
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row" style={{ flexDirection:'row', alignItems:'center', justifyContent:'space-between', gap:10 }}>
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const idx = Math.max(0, options.indexOf(value));
  const n = options.length;
  return (
    <TweakRow label={label}>
      <div role="radiogroup" className="twk-seg">
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {options.map((o) => (
          <button key={o} type="button" role="radio" aria-checked={o === value} onClick={() => onChange(o)}>{o}</button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakColor({ label, value, options, onChange }) {
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" data-on={on ? '1' : '0'}
              style={{ background: o }} onClick={() => onChange(o)}>
              {on && (
                <svg viewBox="0 0 14 14" aria-hidden="true">
                  <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" stroke="#fff" />
                </svg>
              )}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

/* ===== ICONS ===== */

const ITruck = (p) => <Svg {...p}><path d="M3 6h11v9H3zM14 9h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/></Svg>;
const IBox   = (p) => <Svg {...p}><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></Svg>;

const IHead  = (p) => <Svg {...p}><path d="M4 14v-2a8 8 0 0116 0v2M4 14a2 2 0 002 2h1v-5H6a2 2 0 00-2 2zM20 14a2 2 0 01-2 2h-1v-5h1a2 2 0 012 2zM18 16v1a3 3 0 01-3 3h-3"/></Svg>;
const IClock = (p) => <Svg {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></Svg>;

const IGrid  = (p) => <Svg {...p}><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></Svg>;
const IPhone = (p) => <Svg {...p}><path d="M5 4h4l2 5-3 2a11 11 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></Svg>;
const IMail  = (p) => <Svg {...p}><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></Svg>;
const IPin   = (p) => <Svg {...p}><path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></Svg>;
const ICheck = (p) => <Svg {...p}><path d="M20 6L9 17l-5-5"/></Svg>;
const IMenu  = (p) => <Svg {...p}><path d="M3 6h18M3 12h18M3 18h18"/></Svg>;

/* Category icon SVGs (inline, stroke-based, currentColor) */

    <svg {...props}>
      <rect x="14" y="14" width="14" height="26" rx="1.5"/>
      <rect x="16" y="10" width="10" height="4" rx="1"/>
      <line x1="21" y1="10" x2="21" y2="6"/>
      <line x1="21" y1="6" x2="32" y2="6"/>
      <path d="M34 5 L40 3 M34 7 L41 7 M34 9 L40 11"/>
      <line x1="14" y1="20" x2="28" y2="20"/>
      <text x="21" y="33" textAnchor="middle" fontFamily="monospace" fontWeight="700" fontSize="6" stroke="none" fill="currentColor" letterSpacing="0.08em">PUR</text>
    </svg>

  if (name === 'silikony') return (
    <svg {...props}>
      <path d="M12 14 L12 40 C12 41 13 42 14 42 L30 42 C31 42 32 41 32 40 L32 14"/>
      <rect x="10" y="10" width="24" height="4" rx="1"/>
      <path d="M32 16 L40 10 L40 8 L38 8"/>
      <line x1="12" y1="22" x2="32" y2="22"/>
      <line x1="12" y1="28" x2="32" y2="28"/>
    </svg>
  );
  if (name === 'akryle') return (
    <svg {...props}>
      <rect x="10" y="14" width="22" height="26" rx="1.5"/>
      <path d="M32 18 L40 14 L40 26 L32 22"/>
      <line x1="10" y1="22" x2="32" y2="22"/>
      <text x="21" y="34" textAnchor="middle" fontFamily="monospace" fontWeight="700" fontSize="6" stroke="none" fill="currentColor" letterSpacing="0.08em">ACR</text>
    </svg>
  );
  if (name === 'kleje') return (
    <svg {...props}>
      <path d="M10 16 L12 40 C12 41 13 42 14 42 L34 42 C35 42 36 41 36 40 L38 16"/>
      <ellipse cx="24" cy="16" rx="14" ry="3"/>
      <path d="M14 8 Q14 6 16 6 L32 6 Q34 6 34 8 L34 14"/>
      <line x1="16" y1="26" x2="32" y2="26"/>
    </svg>
  );
  if (name === 'akcesoria') return (
    <svg {...props}>
      <path d="M8 20 L32 20 L32 26 L8 26 Z"/>
      <path d="M16 26 L18 38 L24 38 L22 26"/>
      <line x1="32" y1="22" x2="42" y2="18"/>
      <line x1="32" y1="24" x2="42" y2="24"/>
      <circle cx="12" cy="16" r="3"/>
      <line x1="12" y1="13" x2="12" y2="8"/>

  return (
    <svg {...props}>

      <rect x="15" y="7" width="14" height="5" rx="1.5"/>
      <line x1="12" y1="20" x2="32" y2="20"/>

}

/* ===== BRAND MARK =====
   Sygnet: wgrany w panelu (Ustawienia → Logo i kolory marki) albo wbudowany
   rysunek SVG, gdy nic nie wgrano. Znak wodny w hero dziedziczy przezroczysty
   kolor przez `opacity`, bo obrazka nie da się pomalować `currentColor`. */
function LangerMark({ size = 40, className }) {
  if (SITE.logo_mark) {
    return (
      <img src={SITE.logo_mark} alt="" aria-hidden="true" className={className}
        style={{ width: size, height: size, objectFit: 'contain', display: 'block' }} />
    );
  }
  return (
    <svg width={size} height={size} viewBox="0 0 64 64" fill="none" className={className} aria-hidden="true">
      <rect x="13" y="7" width="11" height="35" rx="5.5" fill="currentColor" />
      <rect x="18.5" y="38" width="6" height="10" rx="3" fill="currentColor" />
      <rect x="13" y="46" width="42" height="13" rx="6.5" fill="var(--flame)" />
      <line x1="13" y1="52.5" x2="55" y2="52.5" stroke="#fff" strokeOpacity="0.35" strokeWidth="1.4" />
    </svg>
  );
}

/* Logo w nagłówku i stopce. Gdy w panelu wgrano plik — pokazujemy go w
   wysokości ustawionej w panelu; napis obok zostaje albo znika (logo z gotowym
   napisem nie potrzebuje dubla). Bez wgranego pliku: sygnet + napis, jak dotąd. */
function LangerLogo({ onDark, size = 40 }) {
  const src = logoFor(onDark);
  const height = parseInt(SITE.logo_height, 10) || size;
  const showText = !src || SITE.logo_show_text !== '0';
  return (
    <a href="#top" className="logo" style={{ color: onDark ? '#fff' : 'var(--navy)' }}>
      {src
        ? <img src={src} alt={SITE.contact_company || 'Langer Dystrybucja'} style={{ height, width: 'auto', display: 'block' }} />
        : <LangerMark size={size} />}
      {showText && (
        <span className="logo-words">
          <span className="logo-name">LANGER</span>
          <span className="logo-sub" style={{ color: onDark ? 'rgba(255,255,255,.6)' : 'var(--ash-700)' }}>DYSTRYBUCJA</span>
        </span>
      )}
    </a>
  );
}

/* ===== HERO =====
   Kompaktowy: nagłówek mówi wprost, czym handlujemy, liczby lecą z bazy,
   a pasek kategorii wrzuca prosto do katalogu. Bez pełnoekranowego plakatu —
   pierwszy ekran ma odpowiadać „co tu jest", nie robić wrażenie. */
const HERO = {
  eyebrow: 'Hurtowa dystrybucja chemii budowlanej',
  h1a: 'Piany, silikony, akryle, kleje',
  h1b: ' i cała reszta',
  h1c: ' — hurtowo.',
  lead: 'Zaopatrujemy sklepy, hurtownie i ekipy wykonawcze. Sprawdzone marki, własna linia Langer i zamówienia bez pełnych kartonów.',
};

/* Fakty w hero: produkty i marki liczymy z bazy, czas realizacji i liczbę
   punktów bierzemy z panelu (Ustawienia → „Liczby w hero"). Pusta wartość =
   fakt się nie pokazuje. Żadnej liczby nie wpisujemy „na oko" w kodzie. */
function HeroFacts({ products = [], catCount = 0 }) {
  const facts = [
    [SITE.stat_products || (products.length ? String(products.length) : ''), 'produktów'],
    [catCount ? String(catCount) : '', 'kategorii'],
    [SITE.stat_brands || (BRANDS.length ? String(BRANDS.length) : ''), 'marek'],
    [SITE.stat_delivery, 'średni czas realizacji'],
    [SITE.stat_points, 'zaopatrywanych punktów'],
  ].filter(([n]) => String(n || '').trim());

  if (!facts.length) return null;
  return (
    <div className="hero-facts">
      {facts.map(([n, l]) => (
        <div className="hero-fact" key={l}>
          <b className="num">{n}</b>
          <span>{l}</span>
        </div>
      ))}
    </div>
  );
}

function Hero({ products, onPick }) {
  /* Kategorie w pasku układamy wg liczby produktów — na wierzchu to, czego
     realnie mamy najwięcej. Puste kategorie się nie pokazują. */
  const cats = useMemo(() => {
    const counts = new Map();
    for (const p of products) if (p.category) counts.set(p.category, (counts.get(p.category) || 0) + 1);
    return CATEGORIES
      .map(c => ({ ...c, count: counts.get(c.id) || 0 }))
      .filter(c => c.count > 0)
      .sort((a, b) => b.count - a.count);
  }, [products]);

  return (
    <section id="top" className="hero hero-navy">
      <div className="hero-grid-bg" />
      <div className="wrap hero-navy-in">
        <div className="hero-copy">
          <span className="eyebrow on-dark">{HERO.eyebrow}</span>
          <h1 className="hero-h">
            {HERO.h1a}<span style={{ color: 'var(--flame)' }}>{HERO.h1b}</span>{HERO.h1c}
          </h1>
          <p className="hero-lead">{HERO.lead}</p>
          <div className="hero-cta">
            <a href="#baza" className="btn btn-flame">Przeglądaj produkty <IArrow/></a>
            <a href="#kontakt" className="btn btn-ghost on-dark">Zostań partnerem</a>
          </div>
        </div>
        <HeroFacts products={products} catCount={cats.length} />
      </div>
      {cats.length > 0 && (
        <div className="wrap hero-cats-wrap">
          <div className="hero-cats">
            {cats.map(c => (
              <a key={c.id} href="#baza" className="hcat" onClick={() => onPick && onPick(c.id)}>
                {c.label} <span className="hcat-n">{c.count}</span>
              </a>
            ))}
            <a href="#baza" className="hcat hcat-all" onClick={() => onPick && onPick('all')}>Cała baza <IArrow s={15}/></a>
          </div>
        </div>
      )}
    </section>
  );
}

/* ===== MARQUEE ===== */
function Marquee() {
  // Marki bierzemy z bazy — pasek nie może obiecywać marek, których nie mamy.
  const base = (BRANDS.length ? BRANDS : ['Langer']).map(b => b.toUpperCase());
  const items = base.length >= 5 ? base : [...base, ...base, ...base].slice(0, 10);
  return (
    <div className="marquee" aria-hidden="true">
      <div className="marquee-track">
        {items.concat(items).map((b,i) => (
          <span className="marquee-item" key={i}>{b}<span className="marquee-dot">/</span></span>
        ))}
      </div>
    </div>
  );
}

/* ===== LANGER SHOWCASE (karuzela marki własnej) ===== */
function LangerShowcase({ products }) {
  const trackRef = useRef(null);
  const [canPrev, setCanPrev] = useState(false);
  const [canNext, setCanNext] = useState(true);

  const items = (products || []).filter(p => p.brand === 'Langer');

  const updateNav = () => {
    const t = trackRef.current;
    if (!t) return;
    setCanPrev(t.scrollLeft > 4);
    setCanNext(t.scrollLeft + t.clientWidth < t.scrollWidth - 4);
  };

  useEffect(() => {
    const t = trackRef.current;
    if (!t) return;
    updateNav();
    t.addEventListener('scroll', updateNav, { passive: true });
    window.addEventListener('resize', updateNav);
    return () => {
      t.removeEventListener('scroll', updateNav);
      window.removeEventListener('resize', updateNav);
    };
  }, [items.length]);

  const scrollByStep = (dir) => {
    const t = trackRef.current;
    if (!t) return;
    const card = t.querySelector('.lcard');
    const step = card ? card.offsetWidth + 20 : 320;
    t.scrollBy({ left: dir * step, behavior: 'smooth' });
  };

  if (!items.length) return null;

  return (
    <section id="langer" className="sec sec-langer">
      <div className="wrap">
        <div className="lshow-head reveal">
          <div>
            <span className="eyebrow">Marka własna</span>
            <h2 className="h-sec">Linia Langer —<br/>jakość pod własną marką.</h2>
          </div>
          <p className="lead lshow-lead">
            Pełna gama pian, klejów, silikonów i akcesoriów pod naszą marką. Jakość premium w hurtowej cenie, prosto z naszego magazynu.
          </p>
        </div>

const CAT_TINT = {
  piany:     ['#FBE7DF', 'var(--flame)'],
  silikony:  ['#E5E9F8', 'var(--cobalt)'],
  akryle:    ['#E7EAEF', 'var(--ash-700)'],

/* Zdjęcie produktu z próbkowaniem koloru tła (rogi obrazka -> tło kafla).
   Gdy host nie wysyła nagłówków CORS, canvas jest "tainted" i próbkowanie
   się nie uda — wtedy onBg(null) i kafel zostaje biały (bez regresji). */
function ProductImage({ src, alt, className, onBg }) {
  const [cors, setCors] = useState(true);

  function sample(img) {
    try {
      const c = document.createElement('canvas');
      const w = c.width = 16, h = c.height = 16;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const corners = [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]];
      let r = 0, g = 0, b = 0, n = 0;
      for (const [x, y] of corners) {
        const d = ctx.getImageData(x, y, 1, 1).data;
        if (d[3] < 200) continue;             // róg przezroczysty -> pomiń
        r += d[0]; g += d[1]; b += d[2]; n++;
      }
      onBg(n ? `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})` : null);
    } catch (e) {
      onBg(null);                              // CORS taint -> biały kafel
    }
  }

  return (
    <img
      key={cors ? 'c' : 'p'}
      src={src}
      alt={alt}
      className={className}
      loading="lazy"
      crossOrigin={cors ? 'anonymous' : undefined}
      onLoad={e => sample(e.target)}
      onError={e => { if (cors) { setCors(false); onBg(null); } else { e.target.style.visibility = 'hidden'; } }}
    />
  );
}

/* Ile kart pokazujemy naraz — reszta dochodzi przyciskiem. Na telefonie
   renderowanie 300 kafli naraz potrafi zatkać przewijanie. */
const PAGE = 24;

/* Odmiana rzeczownika po liczbie: 1 produkt, 2–4 produkty, 5+ produktów. */
function plProducts(n) {
  if (n === 1) return 'produkt';
  const t = n % 10, h = n % 100;
  return (t >= 2 && t <= 4 && !(h >= 12 && h <= 14)) ? 'produkty' : 'produktów';
}

const subKey = (p) => String(p.subcategory || '').trim().toLowerCase();

/* ===== BAZA PRODUKTÓW =====
   Zawężanie schodkowe: kategoria -> podkategoria -> marka. Liczniki na każdym
   poziomie liczymy z produktów, które przeszły POZOSTAŁE filtry — dlatego pod
   „Akryle" widać tylko te marki, które w akrylach faktycznie są, i od razu
   wiadomo ile. Wybór, po którym nic by nie zostało, jest nieklikalny. */
function ProductDatabase({ products, initialCatRef }) {
  const [q, setQ] = useState('');
  const [cat, setCat] = useState('all');
  const [sub, setSub] = useState('all');
  const [brand, setBrand] = useState('all');
  const [sort, setSort] = useState('name');
  const [shown, setShown] = useState(PAGE);
  const resultsRef = useRef(null);

  React.useEffect(() => {
    if (initialCatRef) initialCatRef.current = (c) => { setCat(c === 'all' ? 'all' : c); setSub('all'); };
  }, [initialCatRef]);

  const term = q.trim().toLowerCase();
  const searched = useMemo(() => {
    if (!term) return products;
    return products.filter(p => {
      const hay = [p.name, p.brand, p.sku, p.variant, p.subcategory, (p.tags || []).join(' ')]
        .filter(Boolean).join(' ').toLowerCase();
      return hay.includes(term);
    });
  }, [products, term]);

  // KATEGORIE — liczone po wyszukiwaniu i wybranej marce
  const catOptions = useMemo(() => {
    const base = searched.filter(p => brand === 'all' || p.brand === brand);
    const counts = new Map();
    for (const p of base) if (p.category) counts.set(p.category, (counts.get(p.category) || 0) + 1);
    return CATEGORIES.map(c => ({ ...c, count: counts.get(c.id) || 0 }));
  }, [searched, brand]);

  const totalInScope = useMemo(
    () => searched.filter(p => brand === 'all' || p.brand === brand).length,
    [searched, brand]);

  // PODKATEGORIE — tylko z wybranej kategorii, tylko niepuste
  const subOptions = useMemo(() => {
    if (cat === 'all') return [];
    const base = searched.filter(p => p.category === cat && (brand === 'all' || p.brand === brand));
    const acc = new Map();
    for (const p of base) {
      const key = subKey(p);
      if (!key) continue;
      const cur = acc.get(key) || { key, label: String(p.subcategory).trim(), count: 0 };
      cur.count++;
      acc.set(key, cur);
    }
    return [...acc.values()].sort((a, b) => a.label.localeCompare(b.label, 'pl'));
  }, [searched, cat, brand]);

  // MARKI — tylko te obecne w bieżącym zawężeniu (kategoria + podkategoria)
  const brandOptions = useMemo(() => {
    const base = searched.filter(p =>
      (cat === 'all' || p.category === cat) && (sub === 'all' || subKey(p) === sub));
    const counts = new Map();
    for (const p of base) if (p.brand) counts.set(p.brand, (counts.get(p.brand) || 0) + 1);
    return BRANDS.map(b => ({ name: b, count: counts.get(b) || 0 })).filter(b => b.count > 0);
  }, [searched, cat, sub]);

  // Zawężenie mogło wyciąć wybraną wcześniej podkategorię albo markę — wracamy
  // do „wszystkich" zamiast pokazywać pustą listę z aktywnym filtrem.
  useEffect(() => {
    if (sub !== 'all' && !subOptions.some(o => o.key === sub)) setSub('all');
  }, [subOptions, sub]);
  useEffect(() => {
    if (brand !== 'all' && !brandOptions.some(o => o.name === brand)) setBrand('all');
  }, [brandOptions, brand]);
  useEffect(() => { setShown(PAGE); }, [q, cat, sub, brand, sort]);

  const results = useMemo(() => {
    let r = searched.filter(p => {
      if (cat !== 'all' && p.category !== cat) return false;
      if (sub !== 'all' && subKey(p) !== sub) return false;
      if (brand !== 'all' && p.brand !== brand) return false;
      return true;
    });
    if (sort === 'name') r = [...r].sort((a,b) => (a.name || '').localeCompare(b.name || '','pl'));
    if (sort === 'brand') r = [...r].sort((a,b) => (a.brand || '').localeCompare(b.brand || '','pl') || (a.name || '').localeCompare(b.name || '','pl'));
    return r;
  }, [searched, cat, sub, brand, sort]);

  const catObj = CATEGORIES.find(c => c.id === cat);
  const subObj = subOptions.find(o => o.key === sub);
  const active = q || cat !== 'all' || sub !== 'all' || brand !== 'all';
  const clear = () => { setQ(''); setCat('all'); setSub('all'); setBrand('all'); };

  /* Po wyborze kategorii na telefonie zjeżdżamy do filtrów i wyników — inaczej
     trzeba by przewinąć przez całą siatkę kafelków. Na dużym ekranie wszystko
     jest widoczne naraz, więc nie ruszamy stroną pod palcem użytkownika. */
  const pickCategory = (id) => {
    setCat(prev => (prev === id ? 'all' : id));
    setSub('all');
    if (window.innerWidth <= 680 && resultsRef.current) {
      requestAnimationFrame(() => {
        const el = resultsRef.current;
        if (!el) return;
        window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' });
      });
    }
  };

  return (
    <section id="baza" className="sec sec-base">
      <div className="wrap">
        <div className="base-head">
          <div>
            <span className="eyebrow">Baza produktów</span>
            <h2 className="h-base">Wybierz kategorię.</h2>
          </div>
          <div className="search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder={'Szukaj: nazwa, marka, SKU…'} />
            {q && <button className="search-x" onClick={() => setQ('')} aria-label="Wyczyść"><IX s={18}/></button>}
          </div>
        </div>

        {/* Ścieżka wyboru — widać, gdzie się jest, i wychodzi się jednym kliknięciem */}
        {(cat !== 'all' || sub !== 'all' || brand !== 'all') && (
          <div className="crumbs">
            <button className="crumb-home" onClick={clear}>Wszystkie produkty</button>
            {catObj && <><span className="crumb-sep">/</span>
              <button className="crumb" onClick={() => { setCat('all'); setSub('all'); }}>
                {catObj.label} <span className="crumb-x"><IX s={13}/></span>
              </button></>}
            {subObj && <><span className="crumb-sep">/</span>
              <button className="crumb" onClick={() => setSub('all')}>
                {subObj.label} <span className="crumb-x"><IX s={13}/></span>
              </button></>}
            {brand !== 'all' && <><span className="crumb-sep">/</span>
              <button className="crumb" onClick={() => setBrand('all')}>
                {brand} <span className="crumb-x"><IX s={13}/></span>
              </button></>}
          </div>
        )}

        {/* KROK 1 — kategoria */}
        <div className="pick">
          <div className="pick-h">
            <span className="pick-k">Kategoria</span>
            <span className="pick-hint">Kliknij kafelek, żeby zawęzić. Drugi klik cofa wybór.</span>

          </div>
          <div className="ctiles">
            <button className={'ctile ctile-all' + (cat === 'all' ? ' on' : '')} onClick={() => pickCategory('all')}>
              <span className="ctile-ic"><IGrid s={26}/></span>
              <span className="ctile-t">Wszystkie</span>
              <span className="ctile-n">{totalInScope}</span>
            </button>
            {catOptions.map(c => (
              <button key={c.id}
                      className={'ctile' + (cat === c.id ? ' on' : '')}
                      disabled={!c.count && cat !== c.id}
                      onClick={() => pickCategory(c.id)}>
                <span className="ctile-ic"><CatIcon name={c.icon} size={26}/></span>
                <span className="ctile-t">{c.label}</span>
                <span className="ctile-n">{c.count}</span>
              </button>
            ))}
          </div>
        </div>

        {/* KROK 2 i 3 — podkategoria i marka, wyłącznie dostępne wartości */}
        <div ref={resultsRef} />
        {(subOptions.length > 0 || brandOptions.length > 1) && (
          <div className="filters">
            {subOptions.length > 0 && (
              <div className="filter-line">
                <span className="filter-k">Podkategoria</span>
                <div className="chips">
                  <button className={'chip' + (sub === 'all' ? ' active' : '')} onClick={() => setSub('all')}>Wszystkie</button>
                  {subOptions.map(o => (
                    <button key={o.key} className={'chip' + (sub === o.key ? ' active' : '')} onClick={() => setSub(o.key)}>
                      {o.label} <span className="chip-n">{o.count}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}
            {brandOptions.length > 1 && (
              <div className="filter-line">
                <span className="filter-k">Marka</span>
                <div className="chips">
                  <button className={'chip' + (brand === 'all' ? ' active' : '')} onClick={() => setBrand('all')}>Wszystkie</button>
                  {brandOptions.map(b => (
                    <button key={b.name} className={'chip' + (brand === b.name ? ' active' : '')} onClick={() => setBrand(b.name)}>
                      {b.name} <span className="chip-n">{b.count}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        <div className="base-meta">
          <span><span className="num">{results.length}</span> {plProducts(results.length)}</span>
          {active && <button className="base-clear" onClick={clear}>Wyczyść filtry <IX s={15}/></button>}
          <div className="sortbox">
            <label>Sortuj</label>
            <select value={sort} onChange={e => setSort(e.target.value)}>
              <option value="name">Nazwa A–Z</option>
              <option value="brand">Marka</option>
            </select>
          </div>
        </div>

        {results.length ? (
          <>
            <div className="pgrid">
              {results.slice(0, shown).map(p => <ProductTile key={p.sku} p={p} />)}
            </div>
            {results.length > shown && (
              <div className="load-more">
                <button className="btn btn-ghost" onClick={() => setShown(n => n + PAGE)}>
                  Pokaż kolejne {Math.min(PAGE, results.length - shown)} z {results.length}
                </button>
              </div>
            )}
          </>
        ) : (
          <div className="empty">
            <span className="empty-ic"><IGrid s={30}/></span>
            <h3 className="why-t">Brak wyników</h3>
            <p className="why-d">Nie znaleźliśmy produktów dla tych filtrów. Zmień zapytanie lub wyczyść filtry.</p>
            <button className="btn btn-ghost" onClick={clear}>Wyczyść filtry</button>
          </div>
        )}
      </div>
    </section>
  );
}

/* ===== APP ===== */
const TWEAK_DEFAULTS = { accent: '#F04E23', marquee: true };

function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((ents) => {
      ents.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  });
}

function App() {
  // Kolor akcentu startuje z panelu (SITE), a suwak w „Tweaks" może go jeszcze
  // podmienić na czas oglądania — bez zapisu.
  const [t, setTweak] = useTweaks({ ...TWEAK_DEFAULTS, accent: SITE.brand_accent || TWEAK_DEFAULTS.accent });
  const catRef = useRef(null);
  const [products, setProducts] = useState([]);

  useEffect(() => {
    fetch('/api/products', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(d => setProducts(Array.isArray(d) ? d : []))
      .catch(err => console.error('Nie udało się załadować produktów:', err));
  }, []);

  useEffect(() => { applyAccent(t.accent); }, [t.accent]);

  useReveal();

  const pickCat = (c) => {
    if (catRef.current) catRef.current(c);
    requestAnimationFrame(() => {
      const el = document.getElementById('baza');
      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 60, behavior: 'smooth' });
    });
  };

  return (
    <React.Fragment>
      <Header />
      {/* Kolejność sekcji: najpierw towar (hero -> katalog), dopiero potem
          argumenty sprzedażowe. Kto wchodzi po produkt, ma go od razu. */}
      <Hero products={products} onPick={pickCat} />
      {t.marquee && <Marquee />}
      <ProductDatabase products={products} initialCatRef={catRef} />
      <LangerShowcase products={products} />
      <WhyUs />
      <Process />
      <Contact />
      <Footer />

      <TweaksPanel>
        <TweakSection label="Strona główna" />
        <TweakColor label="Kolor akcentu" value={t.accent} options={['#F04E23', '#E5421A', '#1E3FB5', '#0E1533']} onChange={(v) => setTweak('accent', v)} />
        <TweakToggle label="Pasek marek (marquee)" value={t.marquee} onChange={(v) => setTweak('marquee', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

// Bootstrap: pobierz marki/kategorie z bazy (z krótkim timeoutem), potem renderuj.
// Gdy API nie odpowie na czas albo zwróci błąd — renderujemy z wartościami domyślnymi.
(async function bootstrap() {
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  try {
    const [cats, brs, cfg] = await withTimeout(Promise.all([
      fetch('/api/categories', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(r.status)),
      fetch('/api/brands',     { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(r.status)),
      // ustawienia (logo, kolor, kontakt) — brak odpowiedzi nie może wywrócić strony
      fetch('/api/settings',   { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
    ]), 3000);
    if (Array.isArray(cats) && cats.length) CATEGORIES = cats;
    if (Array.isArray(brs)  && brs.length)  BRANDS = brs;
    if (cfg && typeof cfg === 'object') SITE = { ...SITE, ...cfg };
  } catch (e) {
    console.warn('Konfiguracja z API niedostępna — używam wartości domyślnych.', e);
  }
  applyAccent(SITE.brand_accent);
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
  </script>
</body>
