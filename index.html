/* Lista opcji z licznikami — pola wyboru (marka, można kilka) albo jednokrotny
   wybór (rodzaj). Ta sama lista siedzi w rozwijanym menu na komputerze i w
   panelu filtrów na telefonie. Marka bez produktów w bieżącym widoku jest
   nieaktywna (chyba że już zaznaczona — wtedy da się ją odznaczyć). */
function OptionRows({ name, options, isOn, onPick, multi }) {
  return (
    <div className="olist" role={multi ? 'group' : 'radiogroup'}>
      {options.map(o => {
        const on = isOn(o.key);
        const off = multi && !on && !o.count;
        return (
          <label key={o.key} className={'orow' + (multi ? ' multi' : '') + (on ? ' on' : '') + (off ? ' off' : '')}>
            <input type={multi ? 'checkbox' : 'radio'} name={name} checked={on} disabled={off}
                   onChange={() => onPick(o.key)} />
            <span className="orow-mark" aria-hidden="true">{multi && <ICheck s={14}/>}</span>
            <span className="orow-t">{o.label}</span>
            <span className="orow-n num">{o.count}</span>
          </label>
        );
      })}
    </div>
  );
}

/* MARKA na komputerze — przycisk z rozwijaną listą pól wyboru. Zmiany działają
   od razu (wyniki pod spodem odświeżają się na żywo), „Gotowe" tylko zamyka. */
function BrandMenu({ options, selected, onToggle, onClear }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => {
      if (e.key !== 'Escape') return;
      setOpen(false);
      const b = ref.current && ref.current.querySelector('.tbtn');
      if (b) b.focus();
    };
    document.addEventListener('pointerdown', onDown);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('pointerdown', onDown); document.removeEventListener('keydown', onKey); };
  }, [open]);
  const n = selected.length;
  return (
    <div className="bmenu" ref={ref}>
      <button type="button" className={'tbtn' + (n ? ' on' : '')} aria-expanded={open} onClick={() => setOpen(o => !o)}>
        Marka {n > 0 && <span className="tbtn-n">{n}</span>}
        <IChevron s={16} style={{ transform: open ? 'rotate(180deg)' : undefined, transition: 'transform .15s' }}/>
      </button>
      {open && (
        <div className="bmenu-pop">
          <OptionRows name="marka-d" multi options={options} isOn={k => selected.includes(k)} onPick={onToggle} />
          <div className="bmenu-f">
            <button type="button" className="bmenu-clear" onClick={onClear} disabled={!n}>Wyczyść</button>
            <button type="button" className="bmenu-ok" onClick={() => setOpen(false)}>Gotowe</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* MARKA na telefonie — panel od dołu z listą pól wyboru. Zmiany działają od
   razu, a przycisk na dole na żywo mówi, ile produktów zostanie. Systemowe
   „wstecz" go zamyka (patrz historia w ProductDatabase), tak jak ✕ i tapnięcie
   w tło. Kategoria i rodzaj nie siedzą w panelu — są widoczne na stronie. */
function BrandSheet({ onClose, count, brandOpts, brands, onBrand, onClear }) {
  const closeRef = useRef(null);
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    if (closeRef.current) closeRef.current.focus();
    return () => { document.body.style.overflow = prev; document.removeEventListener('keydown', onKey); };
  }, []);
  return (
    <div className="sheet-wrap">
      <div className="sheet-bg" onClick={onClose} />
      <div className="sheet" role="dialog" aria-modal="true" aria-label="Marka">
        <div className="sheet-h">
          <strong>Marka</strong>
          <button type="button" ref={closeRef} className="sheet-x" onClick={onClose} aria-label="Zamknij"><IX s={22}/></button>
        </div>
        <div className="sheet-body">
          <OptionRows name="marka-m" multi options={brandOpts} isOn={k => brands.includes(k)} onPick={onBrand} />
        </div>
        <div className="sheet-f">
          <button type="button" className="btn btn-ghost" onClick={onClear} disabled={!brands.length}>Wyczyść</button>
          <button type="button" className="btn btn-dark" onClick={onClose}>
            Pokaż {count} {plProducts(count)}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ===== BAZA PRODUKTÓW =====
   Dwa rodzaje wyboru, każdy z jednym, przewidywalnym zachowaniem:
   • KATEGORIA to nawigacja („gdzie jestem") — zakładki, zawsze jedna aktywna.
   • RODZAJ (podkategoria) i MARKA to filtry wewnątrz kategorii. Marki można
     łączyć (Soudal + Den Braven).
   Żaden wybór nie zmienia po cichu innego. Gdy filtry się wykluczają, pusty
   stan mówi to wprost i daje jeden przycisk naprawy.
   Liczniki zawsze mówią, ile zostanie po kliknięciu — uwzględniają
   wyszukiwanie i pozostałe filtry.
   Listy marek nie trzymamy w kodzie ani w panelu: bierzemy ją z produktów,
   więc każda marka, która jest w bazie, da się odfiltrować. */
function ProductDatabase({ products, initialCatRef }) {
  const initial = useRef(null);
  if (!initial.current) initial.current = readFilterUrl();
  const [q, setQ] = useState('');
  const [cat, setCat] = useState(initial.current.cat);
  const [sub, setSub] = useState(initial.current.sub);
  const [brands, setBrands] = useState(initial.current.brands);
  const [sort, setSort] = useState('name');
  const [shown, setShown] = useState(PAGE);
  const [sheet, setSheet] = useState(false);
  const [stuck, setStuck] = useState(false);
  const narrow = useNarrow();
  const resultsRef = useRef(null);
  const barRef = useRef(null);
  const sentinelRef = useRef(null);
  const pickRef = useRef(null);
  const sheetRef = useRef(false);
  const stateRef = useRef(null);
  stateRef.current = { cat, sub, brands };

  useEffect(() => {
    // Wejście z innych sekcji: kategoria, a opcjonalnie też marki
    // („Wszystkie produkty Langer" ustawia filtr marki Langer).
    if (initialCatRef) initialCatRef.current = (c, opts = {}) => {
      setCat(c || 'all'); setSub('all');
      if (opts.brands) setBrands(opts.brands);
      if (opts.q !== undefined) setQ(opts.q);
    };
  }, [initialCatRef]);

  const goCat = (id) => { setCat(id); setSub('all'); };
  const toggleBrand = (k) => setBrands(bs => bs.includes(k) ? bs.filter(x => x !== k) : [...bs, k]);
  const clearAll = () => { setQ(''); setCat('all'); setSub('all'); setBrands([]); };

  const term = q.trim().toLowerCase();
  const searched = useMemo(() => {
    if (!term) return products;
    return products.filter(p => {
      const hay = [p.name, p.brand, p.sku, p.variant, p.subcategory, (p.tags || []).join(' ')]
        .filter(Boolean).join(' ').toLowerCase();
      return hay.includes(term);
    });
  }, [products, term]);

  // Nazwa marki do wyświetlenia: pisownia z panelu, jeśli tam jest, inaczej
  // pierwsza napotkana w produktach („SOUDAL" i „Soudal" to ta sama marka).
  const brandLabels = useMemo(() => {
    const m = new Map();
    for (const b of BRANDS) m.set(String(b).trim().toLowerCase(), String(b).trim());
    const out = new Map();
    for (const p of products) {
      const k = brandKey(p);
      if (k && !out.has(k)) out.set(k, m.get(k) || String(p.brand).trim());
    }
    return out;
  }, [products]);

  const inCat = (p) => cat === 'all' || p.category === cat;
  const inSub = (p) => sub === 'all' || subKey(p) === sub;
  const inBrand = (p) => !brands.length || brands.includes(brandKey(p));

  /* Zakładki: kategorie, w których cokolwiek jest w bazie (puste się nie
     pokazują). Lista nie zależy od wyszukiwania ani marki — zakładki nie
     skaczą; zmienia się tylko licznik. */
  const catTabs = useMemo(() => {
    const inBase = new Set(products.map(p => p.category).filter(Boolean));
    const counts = new Map();
    let all = 0;
    for (const p of searched) {
      if (brands.length && !brands.includes(brandKey(p))) continue;
      all++;
      if (p.category) counts.set(p.category, (counts.get(p.category) || 0) + 1);
    }
    const list = CATEGORIES
      .filter(c => !products.length || inBase.has(c.id) || c.id === cat)
      .map(c => ({ id: c.id, label: c.label, count: counts.get(c.id) || 0 }));
    return [{ id: 'all', label: 'Wszystkie', count: all }, ...list];
  }, [products, searched, brands, cat]);

  // Rodzaje w kategorii — lista z całej kategorii, licznik z bieżącymi filtrami.
  const subOpts = useMemo(() => {
    if (cat === 'all') return [];
    const acc = new Map();
    for (const p of products) {
      if (p.category !== cat) continue;
      const k = subKey(p);
      if (k && !acc.has(k)) acc.set(k, { key: k, label: String(p.subcategory).trim(), count: 0 });
    }
    for (const p of searched) {
      if (p.category !== cat || (brands.length && !brands.includes(brandKey(p)))) continue;
      const o = acc.get(subKey(p));
      if (o) o.count++;
    }
    return [...acc.values()].sort((a, b) => a.label.localeCompare(b.label, 'pl'));
  }, [products, searched, cat, brands]);

  const subAll = useMemo(() => searched.filter(p => inCat(p) && inBrand(p)).length, [searched, cat, brands]);

  // Marki obecne w bieżącej kategorii i rodzaju (+ już zaznaczone, żeby dało
  // się je odznaczyć), licznik z wyszukiwaniem.
  const brandOpts = useMemo(() => {
    const acc = new Map();
    for (const p of products) {
      if (!inCat(p) || !inSub(p)) continue;
      const k = brandKey(p);
      if (k && !acc.has(k)) acc.set(k, { key: k, label: brandLabels.get(k), count: 0 });
    }
    for (const k of brands) if (!acc.has(k)) acc.set(k, { key: k, label: brandLabels.get(k) || k, count: 0 });
    for (const p of searched) {
      if (!inCat(p) || !inSub(p)) continue;
      const o = acc.get(brandKey(p));
      if (o) o.count++;
    }
    return [...acc.values()].sort((a, b) =>
      (b.key === 'langer') - (a.key === 'langer') || a.label.localeCompare(b.label, 'pl'));
  }, [products, searched, cat, sub, brands, brandLabels]);

  const results = useMemo(() => {
    const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'pl');
    const byBrand = (a, b) => (a.brand || '').localeCompare(b.brand || '', 'pl');
    const r = searched.filter(p => inCat(p) && inSub(p) && inBrand(p));
    return r.sort((a, b) => langerFirst(a, b) || (sort === 'brand' ? byBrand(a, b) : 0) || byName(a, b));
  }, [searched, cat, sub, brands, sort]);

  useEffect(() => { setShown(PAGE); }, [q, cat, sub, brands, sort]);

  /* Adres z linku mógł wskazywać kategorię, rodzaj albo markę, których (już)
     nie ma. Po załadowaniu produktów zdejmujemy to, co nie istnieje — bez
     nowego wpisu w historii. */
  const hist = useRef({ ready: false, quiet: false, prev: null });
  useEffect(() => {
    if (!products.length) return;
    const cur = stateRef.current;
    const catOk = cur.cat === 'all' || (CATEGORIES.some(c => c.id === cur.cat) && products.some(p => p.category === cur.cat));
    const nextCat = catOk ? cur.cat : 'all';
    const nextSub = nextCat !== 'all' && cur.sub !== 'all' &&
      products.some(p => p.category === nextCat && subKey(p) === cur.sub) ? cur.sub : 'all';
    const nextBrands = cur.brands.filter(k => products.some(p => brandKey(p) === k));
    if (nextCat !== cur.cat || nextSub !== cur.sub || !sameList(nextBrands, cur.brands)) {
      hist.current.quiet = true;
      setCat(nextCat); setSub(nextSub); setBrands(nextBrands);
    }
  }, [products]);

  /* Wejście z linku z filtrami (?kat=…) — od razu pokazujemy katalog, a nie
     hero. Przy odświeżeniu i „wstecz" przeglądarka sama odtwarza przewinięcie. */
  const fromLink = useRef(/[?&](kat|pod|marka)=/.test(location.search));
  useEffect(() => {
    if (!products.length || !fromLink.current) return;
    fromLink.current = false;
    const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (nav && nav.type !== 'navigate') return;
    requestAnimationFrame(() => {
      const el = document.getElementById('baza');
      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 60 });
    });
  }, [products]);

  /* HISTORIA PRZEGLĄDARKI
     Na telefonie ludzie cofają się gestem albo systemowym „wstecz". Zmiana
     kategorii i rodzaju to nowy wpis (jedno cofnięcie = poprzedni widok),
     marka tylko podmienia bieżący. Otwarty panel filtrów to osobny wpis, więc
     „wstecz" go zamyka, zamiast wyrzucać ze strony.
     `quiet` — stan przywracany z historii (albo poprawiany po załadowaniu) nie
     dopisuje nowego wpisu, tylko podmienia bieżący. */
  useEffect(() => {
    const h = hist.current;
    const st = { cat, sub, brands };
    const nav = h.prev && (h.prev.cat !== cat || h.prev.sub !== sub);
    const push = h.ready && nav && !h.quiet && !sheetRef.current;
    h.ready = true; h.quiet = false; h.prev = st;
    writeHistory(push ? 'pushState' : 'replaceState', { ...st, sheet: sheetRef.current });
  }, [cat, sub, brands]);

  useEffect(() => {
    const onPop = (e) => {
      if (sheetRef.current) {
        // „Wstecz" przy otwartym panelu tylko go zamyka. Filtry wybrane w panelu
        // zostają — zapisujemy je we wpisie, na który wróciliśmy.
        sheetRef.current = false;
        setSheet(false);
        writeHistory('replaceState', { ...stateRef.current, sheet: false });
        return;
      }
      const st = (e.state && e.state.langer) || readFilterUrl();
      const cur = stateRef.current;
      const nextBrands = st.brands || [];
      if (st.cat === cur.cat && st.sub === cur.sub && sameList(nextBrands, cur.brands)) return;
      hist.current.quiet = true;
      setCat(st.cat || 'all'); setSub(st.sub || 'all'); setBrands(nextBrands);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const openSheet = () => {
    sheetRef.current = true;
    setSheet(true);
    try { history.pushState({ langer: { ...stateRef.current, sheet: true } }, '', filterUrl(stateRef.current)); } catch (e) {}
  };
  const closeSheet = () => {
    if (!sheetRef.current) return;
    const st = history.state && history.state.langer;
    if (st && st.sheet) { history.back(); return; }   // popstate zamknie panel
    sheetRef.current = false;
    setSheet(false);
  };
  const scrollToPick = () => {
    const el = pickRef.current;
    if (!el) return;
    const hdr = document.querySelector('.hdr');
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - (hdr ? hdr.offsetHeight : 76) - 16, behavior: 'smooth' });
  };
  // Obrót telefonu / poszerzenie okna do układu komputerowego — panel znika.
  useEffect(() => { if (!narrow && sheetRef.current) closeSheet(); }, [narrow]);

  /* Pasek narzędzi przykleja się na telefonie pod nagłówkiem. Kiedy jest
     przyklejony, dostaje białe tło i cień — odcina się od przewijanej listy —
     i pokazuje bieżącą kategorię z powrotem do wyboru. */
  useEffect(() => {
    const el = sentinelRef.current;
    if (!el || !narrow || !window.IntersectionObserver) { setStuck(false); return; }
    const hdr = document.querySelector('.hdr');
    const top = hdr ? hdr.offsetHeight : 76;
    const io = new IntersectionObserver(([e]) => setStuck(!e.isIntersecting && e.boundingClientRect.top < top + 1),
      { rootMargin: `-${top + 1}px 0px 0px 0px`, threshold: 0 });
    io.observe(el);
    return () => io.disconnect();
  }, [narrow]);

  /* Po zmianie wyboru, gdy jesteśmy przewinięci głęboko w listę, wracamy na jej
     początek (tuż pod przyklejony pasek) — inaczej nowa lista zaczynałaby się
     gdzieś w połowie. Jeśli początek wyników jest widoczny, nic nie ruszamy. */
  const navKey = cat + '|' + sub + '|' + brands.join(',');
  const lastNav = useRef(navKey);
  useEffect(() => {
    if (lastNav.current === navKey) return;
    lastNav.current = navKey;
    requestAnimationFrame(() => {
      const el = resultsRef.current;
      if (!el) return;
      const hdr = document.querySelector('.hdr');
      const bar = narrow ? barRef.current : null;
      const offset = (hdr ? hdr.offsetHeight : 76) + (bar ? bar.offsetHeight : 0) + 12;
      const top = el.getBoundingClientRect().top;
      if (top < offset) window.scrollTo({ top: top + window.scrollY - offset, behavior: 'smooth' });
    });
  }, [navKey]);

  const catObj = CATEGORIES.find(c => c.id === cat);
  const subObj = subOpts.find(o => o.key === sub);
  const brandName = (k) => brandLabels.get(k) || k;
  const showBrandMenu = brandOpts.length > 1 || brands.length > 0;
  const onlyLanger = brands.length === 1 && brands[0] === 'langer';
  const canLanger = onlyLanger || brandOpts.some(o => o.key === 'langer' && o.count > 0);
  const langerToggle = canLanger && (
    <button type="button" className={'tbtn tbtn-langer' + (onlyLanger ? ' on' : '')} aria-pressed={onlyLanger}
            onClick={() => setBrands(onlyLanger ? [] : ['langer'])}>
      <i aria-hidden="true"/>Tylko Langer
    </button>
  );

  // Pusty wynik: mówimy dlaczego i dajemy jeden przycisk naprawy.
  let emptyMsg = 'Nie znaleźliśmy produktów dla tych filtrów.';
  let emptyFix = null;
  if (!results.length) {
    const where = catObj ? ` w kategorii ${catObj.label}${subObj ? ' — ' + subObj.label : ''}`
      : term ? ` pasujących do „${q.trim()}”` : '';
    const withoutBrand = brands.length ? searched.filter(p => inCat(p) && inSub(p)).length : 0;
    if (brands.length && withoutBrand > 0) {
      const one = brands.length === 1;
      emptyMsg = `${one ? 'Marka' : 'Marki'} ${joinPl(brands.map(brandName))} nie ${one ? 'ma' : 'mają'} produktów${where}.`;
      emptyFix = { label: 'Pokaż wszystkie marki', run: () => setBrands([]) };
    } else if (term) {
      emptyMsg = `Nic nie pasuje do „${q.trim()}”${catObj ? ' w kategorii ' + catObj.label : ''}.`;
      emptyFix = { label: 'Wyczyść wyszukiwanie', run: () => setQ('') };
    }
  }

  const sortBox = (
    <div className="sortbox">
      <label htmlFor="pdb-sort">Sortuj</label>
      <select id="pdb-sort" value={sort} onChange={e => setSort(e.target.value)}>
        <option value="name">Nazwa A–Z</option>
        <option value="brand">Marka</option>
      </select>
    </div>
  );
  const count = (
    <span className="res-count"><span className="num">{results.length}</span> {plProducts(results.length)}</span>
  );
  // Nagłówki grup „Langer" / „Pozostałe marki" — tylko gdy w wynikach są obie
  const visible = results.slice(0, shown);
  const nLanger = results.filter(isLanger).length;
  const mixed = nLanger > 0 && nLanger < results.length;
  const firstOther = visible.findIndex(p => !isLanger(p));
  const brandChips = brands.map(k => (
    <button key={'b:' + k} type="button" className="fchip" onClick={() => toggleBrand(k)} aria-label={`Usuń filtr: ${brandName(k)}`}>
      {brandName(k)} <IX s={14}/>
    </button>
  ));

  return (
    <section id="baza" className="sec sec-base">
      <div className="wrap">
        <div className="base-head">
          <div>
            <span className="eyebrow">Katalog</span>
            <h2 className="h-base">Cały asortyment — Langer na{'\u00a0'}początku.</h2>
          </div>
          <div className="search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder={'Szukaj: nazwa, marka, SKU…'} aria-label="Szukaj produktów" />
            {q && <button className="search-x" onClick={() => setQ('')} aria-label="Wyczyść wyszukiwanie"><IX s={18}/></button>}
          </div>
        </div>

        {/* Kategoria i rodzaj — widoczne zawsze, na komputerze i na telefonie.
            Rodzaj pojawia się dopiero w wybranej kategorii. */}
        <div ref={pickRef} className="frow">
          <span className="frow-k">Kategoria</span>
          <CatTabs tabs={catTabs} active={cat} onPick={goCat} />
        </div>
        {subOpts.length > 0 && (
          <div className="frow">
            <span className="frow-k">Rodzaj</span>
            <div className="chips">
              <button type="button" className={'chip' + (sub === 'all' ? ' active' : '')} onClick={() => setSub('all')}>
                Wszystkie <span className="chip-n">{subAll}</span>
              </button>
              {subOpts.map(o => (
                <button key={o.key} type="button" className={'chip' + (sub === o.key ? ' active' : '')}
                        onClick={() => setSub(o.key)}>
                  {o.label} <span className="chip-n">{o.count}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Pasek narzędzi: marka, wybrane marki, licznik, sortowanie. Na telefonie
            przykleja się pod nagłówkiem; gdy jest przyklejony, po lewej pokazuje,
            w jakiej kategorii jesteś — tapnięcie wraca do wyboru kategorii. */}
        <div ref={sentinelRef} className="tools-sentinel" />
        <div ref={barRef} className={'tools' + (stuck ? ' stuck' : '')}>
          {narrow && stuck && (
            <button type="button" className="tback" onClick={scrollToPick}>
              <span className="tback-txt">
                <span className="tback-k">Kategoria</span>
                <span className="tback-v">{catObj ? catObj.label : 'Wszystkie'}{subObj ? ' · ' + subObj.label : ''}</span>
              </span>
              <IChevron s={16} style={{ transform: 'rotate(180deg)', flex: 'none' }}/>
            </button>
          )}
          {showBrandMenu && (narrow ? (
            <button type="button" className={'tbtn' + (brands.length ? ' on' : '')} onClick={openSheet}>
              Marka {brands.length > 0 && <span className="tbtn-n">{brands.length}</span>}
              <IChevron s={16}/>
            </button>
          ) : (
            <BrandMenu options={brandOpts} selected={brands} onToggle={toggleBrand} onClear={() => setBrands([])} />
          ))}
          {!narrow && langerToggle}
          {!narrow && !onlyLanger && brandChips}
          {!narrow && brands.length > 1 && <button type="button" className="fclear" onClick={() => setBrands([])}>Wyczyść marki</button>}
          <div className="tools-r">{!(narrow && stuck) && count}{sortBox}</div>
        </div>

        {/* Telefon: wybrane marki pod paskiem jako chipy z ✕. */}
        {narrow && brands.length > 0 && (
          <div className="applied">
            {brandChips}
            {brands.length > 1 && <button type="button" className="fclear" onClick={() => setBrands([])}>Wyczyść marki</button>}
          </div>
        )}

        <div ref={resultsRef} />

        {results.length ? (
          <>
            <div className="pgrid">
              {visible.map((p, i) => (
                <React.Fragment key={p.sku}>
                  {mixed && i === 0 && <div className="pgrid-sep"><span><b>Langer</b> · {nLanger} {plProducts(nLanger)}</span></div>}
                  {mixed && i === firstOther && <div className="pgrid-sep">Pozostałe marki · {results.length - nLanger} {plProducts(results.length - nLanger)}</div>}
                  <ProductTile p={p} />
                </React.Fragment>
              ))}
            </div>
            {results.length > shown && (
              <div className="load-more">
                <button className="btn btn-ghost" onClick={() => setShown(n => n + PAGE)}>
                  Pokaż kolejne {Math.min(PAGE, results.length - shown)} z {results.length}
                </button>
              </div>
            )}
          </>
        ) : products.length ? (
          <div className="empty">
            <span className="empty-ic"><IGrid s={30}/></span>
            <h3 className="why-t">Brak wyników</h3>
            <p className="why-d">{emptyMsg}</p>
            <div className="empty-act">
              {emptyFix && <button className="btn btn-dark" onClick={emptyFix.run}>{emptyFix.label}</button>}
              <button className="btn btn-ghost" onClick={clearAll}>Pokaż wszystkie produkty</button>
            </div>
          </div>
        ) : null}
      </div>

      {/* Portal do <body> — panel ma przykryć cały ekran, łącznie z nagłówkiem,
          niezależnie od tego, w czym siedzi sekcja. */}
      {sheet && ReactDOM.createPortal(
        <BrandSheet onClose={closeSheet} count={results.length}
                    brandOpts={brandOpts} brands={brands} onBrand={toggleBrand}
                    onClear={() => setBrands([])} />,
        document.body
      )}
    </section>
  );
}

/* ===== APP ===== */
const TWEAK_DEFAULTS = { accent: '#F04E23' };

function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((ents) => {
      ents.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  });
}

function App() {
  // Kolor akcentu startuje z panelu (SITE), a suwak w „Tweaks" może go jeszcze
  // podmienić na czas oglądania — bez zapisu.
  const [t, setTweak] = useTweaks({ ...TWEAK_DEFAULTS, accent: SITE.brand_accent || TWEAK_DEFAULTS.accent });
  const catRef = useRef(null);
  const [products, setProducts] = useState([]);

  useEffect(() => {
    // Pobieranie ruszyło już w <head> (window.__BOOT) — tu tylko odbieramy wynik.
    const boot = window.__BOOT && window.__BOOT.products;
    Promise.resolve(boot || fetch('/api/products').then(r => r.ok ? r.json() : null).catch(() => null))
      .then(d => {
        if (Array.isArray(d)) setProducts(d);
        else console.error('Nie udało się załadować produktów.');
      });
  }, []);

  useEffect(() => { applyAccent(t.accent); }, [t.accent]);

  useReveal();

  const pickCat = (c, opts) => {
    if (catRef.current) catRef.current(c, opts);
    requestAnimationFrame(() => {
      const el = document.getElementById('baza');
      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 60, behavior: 'smooth' });
    });
  };

  return (
    <React.Fragment>
      <Header />
      {/* Kolejność sekcji = kolejność pytań klienta: co to jest i co z tego
          mam (hero) → co konkretnie oferuje Langer (karuzela) → co zyskuje
          sklep → cały katalog → co jeszcze zyskuję → jak zacząć → kontakt. */}
      <Hero products={products} />
      <LangerSection products={products}
                     onShowAll={() => pickCat('all', { brands: ['langer'], q: '' })}
                     onFind={(sku) => pickCat('all', { brands: [], q: sku })} />
      <ShopBand />
      <ProductDatabase products={products} initialCatRef={catRef} />
      <WhyUs />
      <DeliverySection cta={<a href="#kontakt" className="btn btn-flame">Zapytaj o dowóz <IArrow/></a>} />
      <Process />
      <Contact />
      <Footer products={products} onPick={pickCat} />

      <TweaksPanel>
        <TweakSection label="Strona główna" />
        <TweakColor label="Kolor akcentu" value={t.accent} options={['#F04E23', '#E5421A', '#1E3FB5', '#0E1533']} onChange={(v) => setTweak('accent', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

// Bootstrap: poczekaj na marki/kategorie/ustawienia (żądania wystartowały już
// w <head>, patrz window.__BOOT), potem renderuj. Każde z nich osobno: gdy
// któreś nie odpowie albo zwróci błąd, tylko ono zostaje przy wartościach
// domyślnych. Po 3 s renderujemy z tym, co jest — strona nie może wisieć.
(async function bootstrap() {
  const boot = window.__BOOT || {};
  const within = (p, ms) => Promise.race([p, new Promise(res => setTimeout(() => res(null), ms))]);
  const [cats, brs, cfg] = await Promise.all([boot.categories, boot.brands, boot.settings].map(p => within(p, 3000)));
  if (Array.isArray(cats) && cats.length) CATEGORIES = cats;
  if (Array.isArray(brs)  && brs.length)  BRANDS = brs;
  if (cfg && typeof cfg === 'object') SITE = { ...SITE, ...cfg };
  if (!cats || !brs || !cfg) console.warn('Część konfiguracji z API niedostępna — używam wartości domyślnych.');
  applyAccent(SITE.brand_accent);
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
  </script>
</body>
</html>
